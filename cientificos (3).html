"Alfred Whitehead":"Con Bertrand Russell escribió los «Principia Mathematica». Más tarde desarrolló la filosofía del proceso.",
"Émile Borel":"Fundó la teoría de la medida moderna con Lebesgue y escribió sobre probabilidad. Fue también político.",
"René Thom":"Desarrolló la teoría de catástrofes, para estudiar cambios bruscos en sistemas. Recibió la Medalla Fields en 1958.",
"Jean Leray":"Creó las sucesiones espectrales y la teoría de haces, y estudió ecuaciones en derivadas parciales y fluidos. Las desarrolló durante su cautiverio de guerra.",
"Gerald Edelman":"Con Porter describió la estructura química de los anticuerpos. Compartió el Nobel de Medicina de 1972 y luego estudió la conciencia.",
"Rodney Porter":"Mostró cómo se descomponen las inmunoglobulinas en fragmentos y propuso su estructura. Compartió el Nobel de Medicina de 1972.",
"René Dubos":"Descubrió antibióticos en bacterias del suelo y escribió sobre la relación entre las personas y su ambiente. Se le atribuye la frase «pensar globalmente, actuar localmente».",
"Ernest Duchesne":"Observó en su tesis de 1897 que un moho, Penicillium glaucum, destruía bacterias, adelantándose a Fleming. Su trabajo pasó desapercibido.",
"Albert Kluyver":"Fundó la microbiología comparada y estudió la unidad bioquímica de los seres vivos. Dirigió la escuela de Delft.",
"Cornelis van Niel":"Mostró que la fotosíntesis de ciertas bacterias usa sulfuro en lugar de agua, lo que ayudó a entender el origen del oxígeno. Fue maestro de muchos microbiólogos.",
"Ferdinand Cohn":"Clasificó las bacterias como plantas y fundó la bacteriología. Apoyó a Robert Koch en la publicación de sus descubrimientos.",
"Anton de Bary":"Fundó la micología moderna, mostró que hongos causan enfermedades en plantas y acuñó el término «simbiosis».",
"Harold Jeffreys":"Geofísico que dedujo que el núcleo terrestre es líquido y estudió terremotos con Bullen. También escribió un influyente libro sobre probabilidad.",
"Rudolf Kálmán":"Desarrolló el filtro de Kalman, un algoritmo para estimar el estado de un sistema a partir de datos con ruido. Se usó en la navegación del Apolo y en muchos dispositivos.",
"Alan Blumlein":"Inventó el sonido estereofónico y contribuyó al desarrollo del radar y la televisión. Murió en un accidente aéreo durante la guerra, a los 38 años.",
"Charles Kettering":"Inventó el arranque eléctrico del automóvil y dirigió la investigación de General Motors, que incluyó el freón. Cofundó la empresa Delco.",
"Willis Carrier":"Inventó en 1902 el primer sistema moderno de aire acondicionado. Fundó la empresa que lleva su apellido.",
"Elmer Sperry":"Desarrolló el girocompás y los estabilizadores giroscópicos para barcos y aviones. Fundó varias empresas de ingeniería.",
"Samuel Langley":"Inventó el bolómetro para medir radiación infrarroja y construyó modelos de aeronaves con motor, aunque su aerodrome fracasó antes de los hermanos Wright.",
"Bertram Brockhouse":"Desarrolló la espectroscopía de neutrones para estudiar el movimiento de átomos en sólidos. Compartió el Nobel de Física de 1994.",
"Klaus Hasselmann":"Desarrolló modelos que vinculan el tiempo atmosférico y el clima y métodos para identificar la huella humana en el calentamiento. Compartió el Nobel de Física de 2021.",
"Robert Laughlin":"Explicó el efecto Hall cuántico fraccionario con una función de onda para un nuevo líquido cuántico. Compartió el Nobel de Física de 1998.",
"Eric Betzig":"Co-desarrolló la microscopía de localización de moléculas individuales, que supera el límite de difracción. Compartió el Nobel de Química de 2014.",
"Stefan Hell":"Inventó la microscopía STED, que permite ver estructuras de células más pequeñas que el límite de difracción. Compartió el Nobel de Química de 2014.",
"William Moerner":"Fue el primero en detectar la absorción de una molécula individual, base de la microscopía de superresolución. Compartió el Nobel de Química de 2014.",
"Martin Karplus":"Desarrolló modelos informáticos para simular reacciones químicas complejas y proteínas. Compartió el Nobel de Química de 2013.",
"Michael Levitt":"Con Karplus y Warshel desarrolló modelos multiescala para simular sistemas químicos. Compartió el Nobel de Química de 2013.",
"Arieh Warshel":"Desarrolló métodos que combinan física clásica y cuántica para simular reacciones de enzimas. Compartió el Nobel de Química de 2013.",
"Benjamin List":"Con MacMillan desarrolló la organocatálisis asimétrica, que usa moléculas orgánicas pequeñas como catalizadores. Compartieron el Nobel de Química de 2021.",
"David MacMillan":"Desarrolló catalizadores orgánicos quirales y acuñó el término organocatálisis. Compartió el Nobel de Química de 2021.",
"Marcelo Gleiser":"Físico teórico brasileño que estudia el origen del universo y de la vida y es un gran divulgador. Fue profesor en Dartmouth.",
"Luis Caffarelli":"Matemático argentino que hizo aportes a las ecuaciones en derivadas parciales y a los problemas de frontera libre. Recibió el premio Abel en 2023.",
"Alicia Dickenstein":"Matemática argentina que trabaja en geometría algebraica y sus aplicaciones a la biología de sistemas. Fue vicepresidenta de la Unión Matemática Internacional.",
"Mónica Olvera de la Cruz":"Física mexicana que estudia polímeros y materia blanda con simulaciones y teoría. Trabaja en Northwestern.",
"Gabriela González":"Física argentina que fue portavoz de la colaboración LIGO cuando se anunció la detección de ondas gravitacionales en 2016.",
"Sandra Díaz":"Ecóloga argentina que estudia cómo los rasgos de las plantas influyen en los ecosistemas y la biodiversidad. Coordinó informes internacionales sobre biodiversidad."
};
const $=id=>document.getElementById(id),yr=v=>v<0?Math.abs(v)+" a. C.":v;
const fields=[...new Set(D.map(d=>d[3]))].sort();
$("f").innerHTML='<option value="">Todos los campos</option>'+fields.map(x=>`<option>${x}</option>`).join("");
const E={"Física":"⚛️","Química":"⚗️","Biología":"🧬","Medicina":"🩺","Matemáticas":"∑","Astronomía":"🔭","Computación":"💻","Ingeniería":"⚙️","Geología":"🪨","Geografía":"🧭","Paleontología":"🦴","Psicología":"🧠","Arqueología":"🏺"};
function av(d){
 let h=0;for(const c of d[0])h=(h*31+c.charCodeAt(0))%360;
 const w=d[0].split(/[\s-]+/).filter(x=>/^[A-ZÀ-ÖØ-Þ]/.test(x));
 const ini=w.length>1?w[0][0]+w[w.length-1][0]:(w[0]||d[0])[0];
 return `<div class="av" style="background:linear-gradient(135deg,hsl(${h} 55% 45%),hsl(${(h+50)%360} 60% 32%))">${ini}<span>${E[d[3]]||"🔬"}</span></div>`;
}
const yt=n=>"https://www.youtube.com/results?search_query="+encodeURIComponent(n+" científico");
const Q={};
function qrSvg(n){
 if(n in Q)return Q[n];
 try{const q=qrcode(0,"L");q.addData(yt(n));q.make();Q[n]=q.createSvgTag(2,0);}catch(e){Q[n]="";}
 return Q[n];
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.innerHTML=qrSvg(e.target.dataset.n);io.unobserve(e.target);}}),{rootMargin:"400px"});
function ft(d){
 return `<div class="ft"><a class="qr" data-n="${d[0]}" target="_blank" rel="noopener" href="${yt(d[0])}" title="Ver videos"></a><div class="fi"><b>Escanea el QR para ver videos</b><a target="_blank" rel="noopener" href="https://es.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(d[0])}">Más información en Wikipedia</a></div></div>`;
}
function render(){
 const q=$("q").value.toLowerCase(),f=$("f").value,s=$("s").value;
 let r=D.filter(d=>(!f||d[3]===f)&&(d.join(" ").toLowerCase().includes(q)));
 r.sort((a,b)=>s==="n"?a[0].localeCompare(b[0]):s==="d"?b[1]-a[1]:a[1]-b[1]);
 $("n").textContent=r.length+" de "+D.length+" científicos";
 $("g").innerHTML=r.map(d=>`<article class="c"><div class="hd">${av(d)}<div><span class="t">${d[3]}</span><h2>${d[0]}</h2><div class="y">${yr(d[1])} – ${d[2]===null?"presente":yr(d[2])} · ${d[4]}</div></div></div><p>${d[5]}</p>${X[d[0]]?`<p class="x">${X[d[0]]}</p>`:""}${ft(d)}</article>`).join("")||"<p>Sin resultados.</p>";
 document.querySelectorAll(".qr[data-n]").forEach(el=>io.observe(el));
}
["q","f","s"].forEach(i=>$(i).addEventListener("input",render));
render();
</script>
</body>
</html>
