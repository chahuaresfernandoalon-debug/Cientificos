"Tales de Mileto":"Considerado el primer filósofo de la naturaleza, buscó explicaciones racionales en lugar de míticas. Se le atribuye haber predicho un eclipse solar y medido la altura de las pirámides con sus sombras.",

"Hipócrates":"Separó la medicina de la magia al insistir en observar al paciente y registrar la evolución de la enfermedad. El juramento hipocrático sigue inspirando la ética médica.",
"Aristóteles":"Estudió animales y plantas de forma sistemática y creó la lógica formal. Fue maestro de Alejandro Magno y su obra dominó el pensamiento científico durante siglos.",

"Arquímedes":"Descubrió que un cuerpo sumergido recibe un empuje igual al peso del líquido que desplaza. También calculó pi con gran precisión y diseñó máquinas como el tornillo que lleva su nombre.",
"Eratóstenes":"Midió la circunferencia de la Tierra comparando las sombras de dos ciudades egipcias, con un error pequeño. Dirigió la Biblioteca de Alejandría y creó la criba para hallar números primos.",
"Galeno":"Médico de gladiadores y de emperadores, estudió la anatomía mediante disecciones de animales. Sus ideas, con algunos errores, guiaron la medicina europea durante más de mil años.",
"Al-Juarismi":"Escribió en Bagdad el primer tratado sistemático de álgebra. Su nombre dio origen a la palabra «algoritmo», y difundió el sistema de numeración decimal.",
"Ibn al-Haytham":"En su «Libro de óptica» explicó que vemos porque la luz entra al ojo, y no al revés. Defendió comprobar las ideas con experimentos, un paso hacia el método científico.",
"Avicena":"Su «Canon de medicina» reunió el saber médico griego e islámico y se enseñó en universidades europeas durante siglos. También escribió sobre filosofía y describió el contagio de ciertas enfermedades.",
"Leonardo Fibonacci":"Con su «Liber Abaci» introdujo en Europa los números indo-arábigos que usamos hoy. La sucesión que lleva su nombre, donde cada número suma los dos anteriores, aparece en muchos fenómenos naturales.",
"Nicolás Copérnico":"Propuso en «De revolutionibus» que la Tierra y los planetas giran alrededor del Sol. Su modelo inició la revolución astronómica, aunque se publicó el año de su muerte.",

"Galileo Galilei":"Con el telescopio observó las lunas de Júpiter, las fases de Venus y los cráteres de la Luna. Defendió el sistema de Copérnico y fue juzgado por la Inquisición; también estudió la caída de los cuerpos.",
"Johannes Kepler":"A partir de las observaciones de Tycho Brahe, mostró que los planetas giran en órbitas elípticas. Sus tres leyes del movimiento planetario fueron clave para que Newton formulara la gravitación.",

"Isaac Newton":"Formuló las leyes del movimiento y la ley de gravitación universal en los «Principia». También desarrolló el cálculo y estudió la descomposición de la luz con prismas.",
"Robert Hooke":"Observó con un microscopio una lámina de corcho y llamó «células» a sus pequeños compartimentos. La ley de Hooke relaciona la fuerza con el estiramiento de un resorte.",
"Carlos Linneo":"Creó el sistema de nombrar cada especie con dos palabras latinas, género y especie, que aún se usa. Su «Systema Naturae» ordenó la clasificación de plantas y animales.",
"Antoine Lavoisier":"Mostró que en una reacción química la masa total se conserva y que la combustión es una combinación con oxígeno. Es considerado el padre de la química moderna y murió guillotinado en la Revolución francesa.",
"Edward Jenner":"Observó que quienes habían tenido viruela de las vacas quedaban protegidos de la viruela humana. En 1796 inoculó a un niño y creó así la primera vacuna, base de la inmunización.",
"Alexander von Humboldt":"Exploró América entre 1799 y 1804, incluidos los Andes, y mostró cómo clima, altura y vegetación se relacionan. Su obra «Cosmos» ayudó a formar la idea de la naturaleza como un sistema conectado.",
"Michael Faraday":"Descubrió la inducción electromagnética, base de los generadores y transformadores. También formuló las leyes de la electrólisis y llegó a la ciencia de origen humilde y sin formación universitaria.",
"Charles Darwin":"Tras viajar en el Beagle, propuso en «El origen de las especies» que las especies cambian por selección natural. Su teoría es el pilar de la biología evolutiva.",

"Louis Pasteur":"Demostró que los microbios causan la fermentación y muchas enfermedades, y refutó la generación espontánea. Desarrolló vacunas contra el ántrax y la rabia, y el proceso de pasteurización.",
"Dmitri Mendeléyev":"Ordenó los elementos por su masa atómica y propiedades en 1869, dejando huecos para elementos aún no descubiertos. Predijo con exactitud las propiedades de algunos, como el galio y el germanio.",

"Albert Einstein":"Formuló la relatividad especial (1905) y general (1915), y explicó el efecto fotoeléctrico, por el que ganó el Nobel. Su ecuación E=mc² relaciona masa y energía.",

"Niels Bohr":"Propuso un modelo del átomo con electrones en órbitas de energía definida, clave para la teoría cuántica. Fundó el instituto de Copenhague y defendió la interpretación de Copenhague de la mecánica cuántica.",
"Edwin Hubble":"Mostró que las «nebulosas espirales» son galaxias fuera de la Vía Láctea. En 1929 halló que las galaxias se alejan más rápido cuanto más lejos están, evidencia de un universo en expansión.",
"Alan Turing":"Describió la «máquina de Turing», modelo teórico de toda computación. En la Segunda Guerra Mundial ayudó a descifrar la máquina Enigma y propuso la prueba que lleva su nombre sobre inteligencia artificial.",
"Rosalind Franklin":"Sus imágenes de rayos X del ADN, entre ellas la «Fotografía 51», mostraron su forma helicoidal. Esos datos fueron esenciales para que Watson y Crick propusieran la doble hélice; murió antes del Nobel.",

"Jane Goodall":"Desde 1960 estudió a los chimpancés de Gombe, en Tanzania, y observó que fabrican y usan herramientas. Hoy impulsa la conservación y la educación ambiental.",
"Stephen Hawking":"Mostró que los agujeros negros emiten radiación y estudió el origen del universo, pese a padecer esclerosis lateral amiotrófica. Su libro «Historia del tiempo» acercó la cosmología al gran público.",
"Jennifer Doudna":"Junto con Emmanuelle Charpentier desarrolló la herramienta CRISPR-Cas9 para editar genes con precisión. Recibieron el Nobel de Química en 2020.",
"Ptolomeo":"Su «Almagesto» describió con matemáticas un universo con la Tierra en el centro, modelo que se usó durante casi catorce siglos. También escribió sobre geografía y óptica.",
"Hipatia de Alejandría":"Dirigió una escuela de filosofía y matemáticas en Alejandría y comentó obras de Diofanto y Apolonio. Fue asesinada en 415 durante disturbios políticos y se la recuerda como símbolo del saber.",
"Brahmagupta":"En su «Brahmasphutasiddhanta» dio reglas para operar con el cero y con números negativos. También resolvió ecuaciones cuadráticas y escribió sobre astronomía.",
"Omar Jayam":"Clasificó las ecuaciones cúbicas y las resolvió con intersecciones de cónicas. Además participó en una reforma del calendario persa de gran exactitud y es famoso por sus cuartetas.",
"Roger Bacon":"Franciscano inglés que insistió en comprobar el conocimiento con la experiencia y las matemáticas. Estudió la óptica y las lentes, y anticipó ideas asociadas al método científico.",
"Tycho Brahe":"Construyó el observatorio de Uraniborg y registró las posiciones de planetas y estrellas, sin telescopio, con gran exactitud. Sus datos permitieron a Kepler deducir sus leyes.",
"René Descartes":"Unió el álgebra y la geometría con el sistema de coordenadas cartesianas. En su «Discurso del método» defendió dudar de todo para llegar a verdades seguras.",
"Evangelista Torricelli":"Llenó con mercurio un tubo y mostró que el aire ejerce presión, con lo que creó el barómetro. Su experimento también demostró la existencia del vacío.",
"Blaise Pascal":"Estableció que la presión se transmite por igual en un fluido, principio que lleva su nombre. Con Fermat sentó las bases de la probabilidad e inventó una calculadora mecánica.",
"Robert Boyle":"Mostró que el volumen de un gas disminuye al aumentar su presión a temperatura constante. En «El químico escéptico» criticó la alquimia y defendió que los elementos son sustancias simples.",
"Antonie van Leeuwenhoek":"Fabricó microscopios de una sola lente muy potentes y observó bacterias, glóbulos rojos y espermatozoides. Fue el primero en describir microorganismos, a los que llamó «animálculos».",
"Christiaan Huygens":"Propuso que la luz se comporta como una onda, descubrió Titán, luna de Saturno, y explicó la forma de sus anillos. En 1656 construyó el primer reloj de péndulo preciso.",
"Gottfried Leibniz":"Desarrolló el cálculo infinitesimal en paralelo a Newton, y su notación es la que se usa hoy. También perfeccionó el sistema binario y construyó una calculadora mecánica.",
"Edmond Halley":"Calculó que los cometas de 1531, 1607 y 1682 eran el mismo cuerpo y predijo su regreso en 1758. También elaboró un mapa de las estrellas del hemisferio sur y animó a Newton a publicar los «Principia».",
"Benjamin Franklin":"Demostró que el rayo es electricidad y propuso el pararrayos. También estudió las corrientes oceánicas, inventó las lentes bifocales y fue figura clave de la independencia de EE. UU.",
"Leonhard Euler":"Es uno de los matemáticos más prolíficos de la historia, con trabajos sobre cálculo, números, grafos y mecánica. Siguió investigando tras quedar casi ciego y popularizó símbolos como e, i y f(x).",
"Joseph Priestley":"Obtuvo oxígeno al calentar óxido de mercurio, al que llamó «aire desflogisticado», y estudió el dióxido de carbono. También observó que las plantas renuevan el aire viciado.",
"John Dalton":"Propuso que cada elemento está formado por átomos de masa característica y que los compuestos resultan de combinarlos en proporciones simples. También describió el daltonismo, que él mismo padecía.",
"Alessandro Volta":"Apiló discos de cobre y zinc separados por tela empapada en salmuera y creó la pila, la primera fuente de corriente continua. La unidad de voltaje, el voltio, lleva su nombre.",
"Pierre-Simon Laplace":"En su «Mecánica celeste» explicó la estabilidad del sistema solar con las leyes de Newton. También desarrolló la teoría de la probabilidad y propuso la hipótesis nebular sobre el origen del sistema solar.",
"Jean-Baptiste Lamarck":"Propuso que los organismos cambian a lo largo del tiempo y popularizó el término «biología». Su idea de heredar caracteres adquiridos fue superada, pero abrió el debate evolutivo.",
"Carl Friedrich Gauss":"Demostró el teorema fundamental del álgebra y desarrolló la teoría de números moderna. También creó el método de mínimos cuadrados y estudió el magnetismo.",
"Humphry Davy":"Usó la electrólisis para aislar sodio, potasio, calcio, bario y magnesio. Estudió el óxido nitroso y creó una lámpara de seguridad para mineros.",
"Ada Lovelace":"Al traducir un artículo sobre la máquina analítica de Babbage, añadió notas con un algoritmo para calcular números de Bernoulli. Se la considera la primera programadora y vio que las máquinas podrían manipular más que números.",
"James Prescott Joule":"Midió con experimentos cuánta energía mecánica se convierte en calor, base de la primera ley de la termodinámica. La unidad de energía, el julio, lleva su nombre.",
"Lord Kelvin":"Propuso la escala absoluta de temperatura, cuyo cero corresponde a la ausencia de agitación térmica. También contribuyó a la segunda ley de la termodinámica y al cable telegráfico transatlántico.",
"Joseph Lister":"Aplicó ácido carbólico en heridas e instrumentos y redujo de forma drástica las infecciones tras operaciones. Inspirado por Pasteur, introdujo la cirugía antiséptica.",
"James Clerk Maxwell":"Unificó la electricidad, el magnetismo y la luz en un conjunto de ecuaciones y predijo las ondas electromagnéticas. También contribuyó a la teoría cinética de los gases y a la fotografía en color.",
"Robert Koch":"Estableció criterios para demostrar que un microbio causa una enfermedad, los postulados de Koch. Identificó los bacilos de la tuberculosis y del cólera y recibió el Nobel en 1905.",
"Wilhelm Röntgen":"En 1895 observó una radiación desconocida que atravesaba el cuerpo y la llamó rayos X. Recibió el primer Nobel de Física, en 1901, y su descubrimiento transformó el diagnóstico médico.",
"Thomas Edison":"Registró más de mil patentes y desarrolló una bombilla incandescente práctica y el fonógrafo. Creó en Menlo Park uno de los primeros laboratorios de investigación industrial.",
"Iván Pávlov":"Mostró que los perros salivaban al oír una señal asociada a la comida, el condicionamiento clásico. Antes había recibido el Nobel de 1904 por su trabajo sobre la digestión.",
"Sigmund Freud":"Neurólogo que desarrolló el psicoanálisis, con conceptos como el inconsciente, la represión y la interpretación de los sueños. Sus ideas, influyentes pero también criticadas, marcaron la psicología y la cultura.",
"Heinrich Hertz":"Generó y detectó ondas de radio en el laboratorio y confirmó así la teoría de Maxwell. La unidad de frecuencia, el hercio, lleva su nombre.",
"Max Planck":"Para explicar la radiación del cuerpo negro propuso en 1900 que la energía se emite en paquetes discretos, los cuantos. Esa idea dio origen a la física cuántica y le valió el Nobel de 1918.",
"Ernest Rutherford":"Con el experimento de la lámina de oro mostró que el átomo tiene un núcleo pequeño y denso. También identificó las radiaciones alfa y beta y logró la primera transmutación artificial.",
"Lise Meitner":"Con Otto Hahn trabajó en el uranio y, junto a Otto Frisch, explicó teóricamente la fisión nuclear. No recibió el Nobel que sí se otorgó a Hahn; el elemento meitnerio lleva su nombre.",
"Carlos Chagas":"Describió por completo una nueva enfermedad: el parásito, el insecto transmisor y el cuadro clínico, hoy llamada enfermedad de Chagas. Es un caso raro de un solo investigador que describió todo el ciclo.",
"Erwin Schrödinger":"Formuló en 1926 la ecuación que describe cómo evoluciona el estado cuántico de un sistema. Es conocido también por el experimento mental del gato y recibió el Nobel de 1933.",
"Bernardo Houssay":"Demostró que las hormonas de la hipófisis influyen en el metabolismo de los azúcares. Fue el primer latinoamericano en ganar un Nobel de ciencias, en Medicina en 1947.",
"Werner Heisenberg":"Formuló la mecánica matricial y el principio de incertidumbre, según el cual no se pueden conocer a la vez con precisión la posición y el momento de una partícula. Recibió el Nobel de Física de 1932.",
"Enrico Fermi":"Dirigió en 1942 el primer reactor nuclear, Chicago Pile-1, y desarrolló la teoría de la desintegración beta. Ganó el Nobel de 1938 y trabajó en el Proyecto Manhattan.",
"Linus Pauling":"Aplicó la mecánica cuántica a los enlaces químicos y propuso la estructura helicoidal de las proteínas. Ganó dos Nobel: Química en 1954 y Paz en 1962.",
"Barbara McClintock":"Estudiando el maíz descubrió que ciertos fragmentos de ADN pueden cambiar de posición en el genoma. Su hallazgo tardó décadas en aceptarse y le dio el Nobel en 1983.",
"Paul Dirac":"Combinó mecánica cuántica y relatividad en una ecuación que predijo la antimateria. Compartió el Nobel de 1933 con Schrödinger y ocupó la cátedra lucasiana de Cambridge.",
"Robert Oppenheimer":"Dirigió el laboratorio de Los Álamos durante el Proyecto Manhattan, que desarrolló las primeras armas nucleares. En 1954 perdió su acreditación de seguridad tras una audiencia polémica.",
"Luis Federico Leloir":"Descubrió los nucleótidos de azúcar y su papel en la síntesis de carbohidratos. Recibió el Nobel de Química en 1970 y fundó un instituto de investigación en Buenos Aires.",
"Grace Hopper":"Almirante de la Marina de EE. UU. que desarrolló uno de los primeros compiladores y contribuyó a crear COBOL. Popularizó programar con lenguajes cercanos al inglés.",
"Rachel Carson":"Su libro «Primavera silenciosa» (1962) alertó sobre los daños de plaguicidas como el DDT en la fauna. Impulsó el movimiento ambiental y cambios en la regulación de EE. UU.",
"Dorothy Hodgkin":"Con cristalografía de rayos X determinó la estructura de la penicilina, la vitamina B12 y la insulina. Recibió el Nobel de Química en 1964.",
"Chien-Shiung Wu":"En 1956 demostró en un experimento que la paridad no se conserva en la interacción débil. El hallazgo valió el Nobel a sus colegas Lee y Yang, pero no a ella.",
"Francis Crick":"Con James Watson propuso en 1953 la estructura de doble hélice del ADN, apoyándose en datos de Franklin y Wilkins. También ayudó a descifrar cómo el ADN codifica las proteínas.",
"Richard Feynman":"Desarrolló la electrodinámica cuántica y sus diagramas, y compartió el Nobel de 1965. También participó en el Proyecto Manhattan y en la investigación del accidente del Challenger.",
"Peter Higgs":"En 1964 propuso un mecanismo que explica cómo las partículas adquieren masa y que predice el bosón de Higgs. Se confirmó en el CERN en 2012 y recibió el Nobel de 2013.",
"Tu Youyou":"Revisó textos de medicina tradicional china y aisló la artemisinina, un fármaco eficaz contra la malaria. Recibió el Nobel de Medicina en 2015.",
"Carl Sagan":"Astrónomo que participó en misiones planetarias de la NASA y divulgó la ciencia en la serie «Cosmos». Impulsó la búsqueda de vida extraterrestre y ayudó a preparar mensajes para las sondas espaciales.",
"Mario Molina":"Junto a Sherwood Rowland mostró que los CFC destruyen la capa de ozono. Compartieron el Nobel de Química de 1995 y su trabajo apoyó el Protocolo de Montreal.",
"Tim Berners-Lee":"En 1989 propuso el sistema de hipertexto que se convirtió en la World Wide Web, mientras trabajaba en el CERN. Defendió que la web fuera abierta y libre de uso.",
"Katalin Karikó":"Con Drew Weissman descubrió cómo modificar el ARN mensajero para que no active una fuerte reacción inmune. Su trabajo hizo posibles las vacunas de ARNm contra la COVID-19 y recibieron el Nobel en 2023.",
"Emmanuelle Charpentier":"Descubrió una molécula clave del sistema CRISPR de las bacterias y con Jennifer Doudna lo convirtió en herramienta de edición genética. Compartieron el Nobel de Química de 2020.",
"Anaximandro":"Propuso que el origen de todo era lo «ilimitado» y que la Tierra flota sin apoyo. Se le atribuye uno de los primeros mapas del mundo.",
"Demócrito":"Sostuvo que todo está formado por átomos indivisibles que se mueven en el vacío. Su idea se adelantó más de dos mil años a la teoría atómica moderna.",
"Teofrasto":"Discípulo de Aristóteles que describió cientos de plantas, su estructura y reproducción en su «Historia de las plantas». Es considerado el padre de la botánica.",
"Hiparco":"Elaboró un catálogo de estrellas y descubrió la precesión de los equinoccios. Desarrolló la trigonometría para sus cálculos astronómicos.",
"Dioscórides":"Médico militar griego que escribió «De materia medica», un tratado sobre unas 600 plantas y sus usos. Fue referencia farmacológica durante más de mil años.",
"Zhang Heng":"Inventó un sismoscopio que indicaba la dirección de un temblor lejano. También construyó esferas armilares y estudió los eclipses.",
"Aryabhata":"En su «Aryabhatiya» aproximó el valor de pi y propuso que la Tierra rota sobre su eje. También explicó los eclipses por causas naturales.",
"Al-Razi":"Médico persa que distinguió el sarampión de la viruela y dirigió hospitales en Rayy y Bagdad. Escribió extensos tratados clínicos que se tradujeron al latín.",
"Al-Biruni":"Midió el radio de la Tierra con un método basado en la altura de una montaña. Escribió sobre astronomía, geografía, mineralogía y la India.",
"Shen Kuo":"Sabio de la dinastía Song que describió la brújula magnética y propuso que el terreno se forma por erosión y sedimentación. Reunió sus observaciones en los «Ensayos del estanque de los sueños».",
"William Gilbert":"En «De Magnete» (1600) propuso que la Tierra es un gran imán. Distinguió el magnetismo de la electricidad estática, a la que dio nombre.",
"Simon Stevin":"Popularizó el uso de fracciones decimales en Europa y estudió estática e hidrostática. También mostró que cuerpos de distinto peso caen a la vez.",
"John Napier":"Inventó los logaritmos, que simplificaron durante siglos los cálculos con números grandes. También ideó los «huesos de Napier» para multiplicar.",
"Marcello Malpighi":"Con el microscopio observó los capilares que unen arterias y venas, completando la descripción de Harvey. Fue pionero de la anatomía microscópica.",
"Henry Cavendish":"Aisló el hidrógeno y calculó la densidad de la Tierra con un experimento de balanza de torsión. Fue muy reservado y publicó poco de su trabajo.",
"Carl Scheele":"Farmacéutico sueco que descubrió el oxígeno, el cloro y varios ácidos orgánicos. Publicó tarde su hallazgo del oxígeno, por lo que el crédito suele compartirse con Priestley.",
"William Herschel":"Descubrió Urano en 1781 y miles de nebulosas y estrellas dobles. Con su hermana Caroline construyó telescopios de gran tamaño.",
"Georges Cuvier":"Mostró que algunas especies se habían extinguido y relacionó fósiles con animales. Fue clave para fundar la anatomía comparada y la paleontología.",
"Amedeo Avogadro":"Propuso que volúmenes iguales de gases, a igual presión y temperatura, contienen igual número de moléculas. La constante de Avogadro lleva su nombre.",
"Hans Christian Ørsted":"En 1820 observó que una corriente eléctrica desvía una brújula, lo que mostró la relación entre electricidad y magnetismo. Su hallazgo inició el electromagnetismo.",
"André-Marie Ampère":"Describió la fuerza entre corrientes eléctricas y formuló la ley que lleva su nombre. La unidad de corriente, el amperio, se nombró en su honor.",
"Georg Ohm":"Estableció que la corriente en un conductor es proporcional al voltaje e inversa a la resistencia. Su trabajo fue ignorado al principio y reconocido después.",
"Charles Babbage":"Diseñó la máquina diferencial y la máquina analítica, antecesoras de la computadora. Nunca las terminó, pero sus planos incluían memoria y unidad de cálculo.",
"Mary Anning":"Recolectó en los acantilados de Lyme Regis fósiles de ictiosaurios y plesiosaurios, entre otros. Rara vez recibió crédito en su época, pero aportó pruebas claves sobre la extinción.",
"Charles Lyell":"En «Principios de geología» sostuvo que la Tierra cambia por procesos lentos que aún operan. Su idea del tiempo profundo influyó mucho en Darwin.",
"Friedrich Wöhler":"Al sintetizar urea a partir de compuestos inorgánicos en 1828 mostró que lo orgánico puede crearse en el laboratorio. También aisló el aluminio.",
"Ignaz Semmelweis":"Observó que las muertes por fiebre puerperal bajaban si los médicos se lavaban las manos con cloro. Sus ideas fueron rechazadas en su época y se confirmaron después.",
"Florence Nightingale":"Mejoró la higiene en hospitales durante la guerra de Crimea y usó gráficos estadísticos para mostrar las causas de mortalidad. Fundó la enfermería profesional moderna.",
"Rudolf Virchow":"Afirmó que toda célula procede de otra célula y fundó la patología celular. También impulsó la salud pública y la antropología.",
"Ludwig Boltzmann":"Explicó la termodinámica con el comportamiento estadístico de los átomos y relacionó la entropía con el número de estados posibles. Su fórmula está grabada en su tumba.",
"Henri Becquerel":"En 1896 descubrió que las sales de uranio emiten radiación sin luz externa. Compartió el Nobel de 1903 con los Curie y la unidad becquerelio lleva su nombre.",
"Hendrik Lorentz":"Explicó el efecto Zeeman y propuso transformaciones de coordenadas que son la base matemática de la relatividad especial. Compartió el Nobel de 1902.",
"J. J. Thomson":"En 1897 demostró que los rayos catódicos son partículas con carga negativa, los electrones. Ganó el Nobel de 1906 y propuso el modelo atómico del «pudín de pasas».",
"Pierre Curie":"Descubrió con su hermano la piezoelectricidad y estudió el magnetismo. Con Marie investigó la radiactividad y compartió el Nobel de 1903.",
"Henrietta Leavitt":"Estudiando estrellas variables descubrió la relación entre su brillo y su periodo. Esa regla permitió medir distancias a otras galaxias.",
"Alfred Wegener":"En 1912 propuso que los continentes se desplazan, apoyándose en fósiles y en el encaje de las costas. Su idea se rechazó en vida y se confirmó con la tectónica de placas.",
"Emmy Noether":"Su teorema relaciona cada simetría de un sistema físico con una ley de conservación. También fue figura central del álgebra abstracta.",
"Max Born":"Propuso que el cuadrado de la función de onda da la probabilidad de hallar una partícula. Recibió el Nobel de 1954 por esa interpretación.",
"Srinivasa Ramanujan":"Matemático autodidacta que envió a Hardy cuadernos con cientos de fórmulas, muchas nuevas. Trabajó en series, fracciones continuas y teoría de números, y murió joven, a los 32 años.",
"Louis de Broglie":"Propuso en su tesis que las partículas, como el electrón, tienen propiedades ondulatorias. Su idea se confirmó con experimentos y le valió el Nobel de 1929.",
"Frederick Banting":"Junto a Charles Best, en el laboratorio de Macleod, aisló la insulina en 1921. Recibió el Nobel en 1923, que compartió con Macleod.",
"Kurt Gödel":"Demostró que en todo sistema formal consistente que incluya la aritmética hay enunciados verdaderos que no se pueden demostrar. Cambió los fundamentos de la matemática.",
"John von Neumann":"Aportó a la teoría de juegos, la mecánica cuántica y el diseño de computadoras con programa almacenado. También participó en el Proyecto Manhattan.",
"Claude Shannon":"En 1948 publicó «Una teoría matemática de la comunicación», que introdujo el bit y midió la información. Es la base de las telecomunicaciones digitales.",
"Jonas Salk":"Desarrolló en 1955 una vacuna inactivada contra la poliomielitis, probada en millones de niños. Nunca la patentó y la ofreció para uso público.",
"Rita Levi-Montalcini":"Descubrió el factor de crecimiento nervioso, que regula el desarrollo de las neuronas. Compartió el Nobel de 1986 con Stanley Cohen y fue senadora vitalicia de Italia.",
"Vera Rubin":"Midió la rotación de las galaxias y vio que las estrellas lejanas giran más rápido de lo esperado. Ese resultado fue una de las pruebas principales de la materia oscura.",
"Jocelyn Bell Burnell":"Como estudiante de doctorado detectó señales de radio pulsantes que resultaron ser púlsares. El Nobel de 1974 fue para su supervisor, no para ella.",
"Elizabeth Blackburn":"Descubrió cómo los telómeros protegen los extremos de los cromosomas y la enzima telomerasa que los mantiene. Compartió el Nobel de Medicina de 2009.",
"Svante Pääbo":"Secuenció el genoma neandertal y descubrió a los denisovanos. Ganó el Nobel de Medicina de 2022 y fundó la paleogenética.",
"Andrea Ghez":"Con telescopios en Hawái siguió estrellas que orbitan el centro de la Vía Láctea y mostró que allí hay un agujero negro supermasivo. Compartió el Nobel de Física de 2020.",
"Ahmed Zewail":"Usó pulsos láser ultracortos para observar átomos moviéndose durante una reacción química. Recibió el Nobel de Química de 1999 por fundar la femtoquímica.",
"Fabiola Gianotti":"Física de partículas que coordinó el experimento ATLAS durante el hallazgo del bosón de Higgs en 2012. Fue la primera mujer en dirigir el CERN.",
"Daniel Alcides Carrión":"Estudiante de medicina peruano que en 1885 se inoculó sangre de un paciente con verruga peruana para entender la enfermedad. Murió de fiebre de la Oroya y su sacrificio mostró que ambas eran fases de una misma enfermedad.",
"Alberto Barton":"Médico peruano que en 1905 identificó la bacteria causante de la fiebre de la Oroya y la enfermedad de Carrión. El género Bartonella lleva su nombre.",
"Pedro Paulet":"Ingeniero peruano que a inicios del siglo XX experimentó con motores de cohete de propulsante líquido. Algunos historiadores lo consideran un precursor de la astronáutica moderna.",
"Carlos Monge Medrano":"Describió el mal de montaña crónico, hoy conocido como enfermedad de Monge, y fundó la fisiología de altura en el Perú. Impulsó el estudio de cómo el cuerpo se adapta a vivir en altitud.",
"Empédocles":"Propuso que toda la materia se compone de cuatro «raíces»: tierra, agua, aire y fuego, movidas por el amor y la discordia. Su teoría influyó en la ciencia durante siglos.",
"Herófilo":"Médico alejandrino que realizó disecciones públicas del cuerpo humano y describió el cerebro, los nervios y el duodeno. Distinguió los nervios de los tendones.",
"Aristarco de Samos":"Propuso en el siglo III a. C. que la Tierra gira alrededor del Sol y estimó los tamaños relativos del Sol y la Luna. Su idea fue ignorada hasta Copérnico.",
"Apolonio de Perge":"Su tratado «Las cónicas» estudió la elipse, la parábola y la hipérbola, nombres que él introdujo. Fue la base de la geometría de esas curvas durante siglos.",
"Herón de Alejandría":"Describió la eolípila, una esfera giratoria impulsada por vapor, y escribió sobre autómatas y mecánica. También dio una fórmula para el área de un triángulo.",
"Zu Chongzhi":"Calculó pi entre 3,1415926 y 3,1415927, una aproximación récord durante casi mil años. También trabajó en el calendario y en la mecánica.",
"Al-Zahrawi":"Médico de Córdoba que escribió el «Kitab al-Tasrif», con ilustraciones de instrumentos quirúrgicos. Describió el uso de ligaduras y la cirugía de heridas.",
"Nasir al-Din al-Tusi":"Dirigió el observatorio de Maraga y propuso un recurso matemático, el par de Tusi, para explicar el movimiento planetario. Escribió sobre trigonometría plana y esférica.",
"Ibn al-Nafis":"Describió que la sangre pasa del corazón derecho a los pulmones y de allí al izquierdo, no por poros del tabique. Su idea precedió a Servet y Harvey.",
"Ulugh Beg":"Gobernante timúrida que construyó el observatorio de Samarcanda y publicó un catálogo de unas mil estrellas. Fue de los más precisos antes del telescopio.",
"Paracelso":"Defendió que las enfermedades tienen causas químicas y usó minerales como medicamentos. También afirmó que la dosis distingue el remedio del veneno.",
"Georgius Agricola":"Su obra «De re metallica» describió con detalle la minería y la metalurgia de su tiempo. Es considerado el padre de la mineralogía.",
"Ambroise Paré":"Cirujano militar francés que reemplazó la cauterización con aceite hirviendo por ligaduras y ungüentos suaves. Mejoró también las prótesis y la obstetricia.",
"Gerardus Mercator":"En 1569 presentó un mapa del mundo cuya proyección conserva los ángulos, útil para navegar con rumbo constante. Su método distorsiona el tamaño cerca de los polos.",
"Conrad Gessner":"Publicó la «Historia animalium», una gran obra ilustrada que reunía lo conocido sobre los animales. También escribió sobre plantas y lenguas.",
"José de Acosta":"Jesuita que vivió en el Perú y describió el «mal de las montañas», hoy mal de altura, en su «Historia natural y moral de las Indias». Propuso explicaciones sobre el aire delgado.",
"Johannes Hevelius":"Cartografió la Luna en su «Selenographia» y descubrió varios cometas y constelaciones. También catalogó estrellas con instrumentos de gran precisión.",
"Niels Steno":"Formuló principios de la estratigrafía: los estratos se depositan en capas horizontales y las inferiores son más antiguas. Estudió también los fósiles y la anatomía.",
"Giovanni Cassini":"Descubrió cuatro lunas de Saturno y la división de sus anillos, que lleva su nombre. Dirigió el Observatorio de París y midió la rotación de Marte y Júpiter.",
"Ole Rømer":"En 1676 notó retrasos en los eclipses de las lunas de Júpiter y dedujo que la luz tiene velocidad finita. Fue la primera estimación de ese valor.",
"Denis Papin":"Inventó el digestor, precursor de la olla a presión, con válvula de seguridad. Propuso usar vapor para mover un pistón, idea clave de la máquina de vapor.",
"Jacob Bernoulli":"Demostró la ley de los grandes números en «Ars Conjectandi» y estudió la constante e y las series. Fue el primero de una gran familia de matemáticos suizos.",
"Stephen Hales":"Midió por primera vez la presión arterial, en un caballo, y estudió la transpiración de las plantas. Fue pionero de la fisiología vegetal y animal.",
"Daniel Fahrenheit":"Construyó termómetros de mercurio fiables y propuso una escala de temperatura aún usada en EE. UU. Fijó puntos de referencia con mezclas de hielo, sal y agua.",
"Anders Celsius":"Propuso en 1742 una escala centígrada basada en los puntos de congelación y ebullición del agua. También fue pionero en el estudio de la aurora boreal.",
"James Hutton":"Defendió que la Tierra es muy antigua y que sus rocas se forman por procesos lentos y cíclicos. Sus ideas, el uniformismo, fueron desarrolladas por Lyell.",
"Joseph Black":"Descubrió el dióxido de carbono, al que llamó «aire fijo», y distinguió calor de temperatura. Introdujo los conceptos de calor específico y calor latente.",
"Joseph-Louis Lagrange":"Su «Mecánica analítica» reformuló la mecánica de Newton con ecuaciones generales. Hizo aportes a la teoría de números y a la mecánica celeste.",
"Luigi Galvani":"Observó que las patas de rana se contraían al aplicarles electricidad e interpretó el hecho como «electricidad animal». Volta lo discutió y de ello surgió la pila.",
"Caroline Herschel":"Astrónoma alemana que descubrió ocho cometas y varias nebulosas. Colaboró con su hermano William y recibió una medalla de oro de la Real Sociedad Astronómica.",
"Joseph Fourier":"Mostró que funciones periódicas pueden descomponerse en sumas de ondas simples, hoy series de Fourier. También estudió la conducción del calor e intuyó el efecto invernadero.",
"Thomas Young":"Con su experimento de la doble rendija mostró que la luz se comporta como una onda. También estudió la elasticidad y ayudó a descifrar los jeroglíficos egipcios.",
"Augustin Fresnel":"Desarrolló una teoría ondulatoria de la luz con matemática rigurosa y diseñó la lente que lleva su nombre. Se usó en faros para concentrar la luz.",
"Sadi Carnot":"En 1824 analizó el rendimiento de las máquinas térmicas y mostró que depende de la diferencia de temperatura. Su trabajo sentó las bases de la segunda ley de la termodinámica.",
"Joseph Henry":"Descubrió la autoinducción y construyó electroimanes potentes y un telégrafo temprano. Fue el primer secretario de la Smithsonian; la unidad henrio lleva su nombre.",
"Justus von Liebig":"Desarrolló el análisis orgánico cuantitativo y mostró que las plantas necesitan nitrógeno, fósforo y potasio. Impulsó el uso de fertilizantes y creó laboratorios de enseñanza.",
"Matthias Schleiden":"Botánico que propuso en 1838 que todas las plantas están hechas de células. Su idea, junto con la de Schwann, dio forma a la teoría celular.",
"Theodor Schwann":"Amplió la teoría celular a los animales y descubrió las células que envuelven los nervios. También identificó la pepsina, enzima del estómago.",
"Évariste Galois":"Joven genio que sentó las bases de la teoría de grupos al estudiar cuándo una ecuación se resuelve con radicales. Murió en un duelo a los 20 años.",
"Robert Bunsen":"Perfeccionó el mechero que lleva su nombre y con Kirchhoff creó la espectroscopía. Con ella descubrieron el cesio y el rubidio.",
"Claude Bernard":"Introdujo el concepto de «medio interior» y estudió la función del hígado y el páncreas. Defendió el método experimental en medicina.",
"Alfred Russel Wallace":"Propuso la selección natural de forma independiente a Darwin mientras exploraba el archipiélago malayo. Es considerado el padre de la biogeografía.",
"Gustav Kirchhoff":"Formuló las leyes de los circuitos eléctricos y, con Bunsen, fundó la espectroscopía. También explicó las líneas oscuras del espectro solar.",
"Bernhard Riemann":"Introdujo una geometría de espacios curvos que Einstein usó para la relatividad general. También planteó la hipótesis de Riemann sobre los números primos, aún sin resolver.",
"Carlos Finlay":"Médico cubano que propuso en 1881 que los mosquitos transmiten la fiebre amarilla. Su hipótesis se confirmó años después y ayudó a controlar la enfermedad.",
"Georg Cantor":"Creó la teoría de conjuntos y mostró que hay infinitos de distinto tamaño. Sus ideas, polémicas en su época, son hoy base de la matemática.",
"Walter Reed":"Dirigió la comisión que confirmó en Cuba que el mosquito transmite la fiebre amarilla. Su trabajo llevó a campañas sanitarias que redujeron la enfermedad.",
"Paul Ehrlich":"Propuso la idea de la «bala mágica»: compuestos que atacan al microbio sin dañar al paciente. Desarrolló el salvarsán contra la sífilis y recibió el Nobel de 1908.",
"Emil von Behring":"Desarrolló la antitoxina contra la difteria, con la que se trató a niños enfermos. Recibió el primer Nobel de Medicina, en 1901.",
"Henri Poincaré":"Hizo aportes a la topología, la mecánica celeste y la relatividad. Estudió el problema de los tres cuerpos y sentó bases de la teoría del caos; su conjetura se demostró en 2003.",
"Svante Arrhenius":"Propuso que las sales en solución se disocian en iones y calculó cómo el CO₂ afecta la temperatura de la Tierra. Recibió el Nobel de Química de 1903.",
"David Hilbert":"En 1900 planteó 23 problemas que guiaron la matemática del siglo XX. Sentó bases de la geometría, el álgebra y los espacios que llevan su nombre.",
"Thomas Hunt Morgan":"Con experimentos en la mosca de la fruta demostró que los genes están en los cromosomas. Recibió el Nobel de Medicina de 1933.",
"Karl Landsteiner":"Descubrió los grupos sanguíneos A, B y O, lo que hizo seguras las transfusiones. Recibió el Nobel de 1930 y también identificó el factor Rh.",
"Fritz Haber":"Desarrolló la síntesis de amoníaco a partir de nitrógeno e hidrógeno, base de los fertilizantes modernos. También impulsó el uso de armas químicas en la Primera Guerra Mundial.",
"Oswaldo Cruz":"Médico sanitarista brasileño que dirigió campañas contra la fiebre amarilla, la peste y la viruela en Río de Janeiro. Fundó el instituto que hoy lleva su nombre.",
"Arthur Eddington":"Dirigió expediciones durante el eclipse solar de 1919 que midieron la desviación de la luz estelar y respaldaron la relatividad general. También estudió la estructura de las estrellas.",
"C. V. Raman":"En 1928 descubrió que parte de la luz dispersada por una sustancia cambia de color, el efecto Raman. Ganó el Nobel de Física de 1930, el primero de un asiático en ciencias.",
"James Chadwick":"En 1932 descubrió el neutrón, partícula sin carga del núcleo atómico. Recibió el Nobel de 1935 y fue importante en el programa nuclear británico.",
"Satyendra Nath Bose":"Su trabajo con Einstein dio origen a la estadística de Bose-Einstein y a los bosones, partículas que llevan su nombre. Su cálculo sobre la radiación de la luz fue clave.",
"Georges Lemaître":"Sacerdote y físico belga que propuso que el universo nació de un «átomo primitivo» y se expande. Fue precursor de la teoría del Big Bang.",
"Alexander Oparin":"Propuso que la vida surgió en la Tierra primitiva a partir de reacciones químicas en una «sopa» de moléculas orgánicas. Su hipótesis orientó el estudio del origen de la vida.",
"Jean Piaget":"Describió cómo los niños desarrollan el pensamiento en etapas, de la inteligencia sensoriomotora a la lógica formal. Influyó en la pedagogía y la psicología.",
"Hans Krebs":"Describió en 1937 el ciclo del ácido cítrico, ruta central del metabolismo celular. Recibió el Nobel de Medicina de 1953.",
"Theodosius Dobzhansky":"Unió genética y evolución en «La genética y el origen de las especies». Su frase más conocida sostiene que nada en biología tiene sentido sino a la luz de la evolución.",
"Konrad Lorenz":"Estudió la impronta en gansos y cómo ciertas conductas son innatas. Compartió el Nobel de Medicina de 1973 con Tinbergen y von Frisch.",
"Ernst Mayr":"Defendió que una especie es un grupo de poblaciones que se reproducen entre sí y están aisladas de otras. Fue figura clave de la síntesis evolutiva.",
"B. F. Skinner":"Estudió cómo las consecuencias moldean la conducta, con experimentos en cajas con palancas. Su conductismo influyó en la educación y la terapia.",
"Severo Ochoa":"Descubrió una enzima que sintetiza ARN fuera de la célula, paso clave para descifrar el código genético. Recibió el Nobel de Medicina de 1959.",
"Hideki Yukawa":"En 1935 predijo que una partícula, el mesón, mediaba la fuerza nuclear fuerte. Fue el primer japonés en ganar un Nobel, en 1949.",
"Nikolaas Tinbergen":"Estudió el comportamiento de gaviotas y peces y propuso cuatro preguntas para analizar la conducta animal. Compartió el Nobel de 1973.",
"Subrahmanyan Chandrasekhar":"Calculó que las estrellas enanas blancas no pueden superar cierta masa sin colapsar, el límite de Chandrasekhar. Recibió el Nobel de Física de 1983.",
"Abdus Salam":"Co-desarrolló la teoría que unifica el electromagnetismo y la fuerza débil, por la que compartió el Nobel de 1979. Fundó un centro internacional de física en Trieste.",
"Anaxágoras":"Explicó que la Luna brilla con luz reflejada del Sol y que los eclipses se deben a sombras. Fue acusado de impiedad por afirmar que el Sol era una roca incandescente.",
"Plinio el Viejo":"Autor de la «Historia natural», enciclopedia de 37 libros sobre astronomía, geografía, zoología y botánica. Murió en el 79 durante la erupción del Vesubio, cuando fue a investigar y a ayudar.",
"Gerolamo Cardano":"Publicó en «Ars Magna» las soluciones de las ecuaciones cúbicas y cuárticas, con ideas de Tartaglia y Ferrari. También escribió sobre probabilidad y ejerció como médico.",
"Niccolò Tartaglia":"Descubrió un método para resolver ecuaciones cúbicas y se lo reveló a Cardano bajo promesa de secreto. Tradujo a Euclides y Arquímedes al italiano.",
"François Viète":"Introdujo el uso sistemático de letras para representar incógnitas y datos en las ecuaciones. También fue criptoanalista al servicio del rey de Francia.",
"Pierre de Fermat":"Hizo avances en teoría de números y anotó en un margen su «último teorema», que tardó más de 350 años en demostrarse. También contribuyó a la probabilidad y a la óptica.",
"Otto von Guericke":"En 1654 unió dos hemisferios metálicos haciendo el vacío y ni dos tiros de caballos pudieron separarlos. Inventó una bomba de vacío y una máquina electrostática.",
"Giovanni Borelli":"Aplicó la mecánica al movimiento de músculos y huesos en «De motu animalium». Es considerado el padre de la biomecánica.",
"Thomas Willis":"Describió con detalle la anatomía del cerebro, incluido el círculo arterial que lleva su nombre. Introdujo el término «neurología».",
"Francesco Redi":"Mostró en 1668 que las larvas no surgen espontáneamente de la carne en descomposición, sino de huevos de moscas. Su experimento con frascos fue un golpe a la generación espontánea.",
"John Ray":"Clasificó plantas y animales y propuso una definición temprana de especie. Su «Historia de las plantas» influyó mucho en Linneo.",
"Jan Swammerdam":"Disecó insectos con microscopio y describió su metamorfosis como un desarrollo continuo. También observó por primera vez los glóbulos rojos.",
"Brook Taylor":"Desarrolló la serie de Taylor, que aproxima funciones mediante polinomios. También estudió la perspectiva y las vibraciones de cuerdas.",
"Pieter van Musschenbroek":"En 1746 inventó la botella de Leiden, el primer condensador capaz de almacenar carga eléctrica. Estudió además el magnetismo y la resistencia de materiales.",
"Conde de Buffon":"Dirigió el Jardín del Rey y escribió una «Historia natural» de 36 volúmenes. Estimó que la Tierra era mucho más antigua de lo que decían las cronologías bíblicas.",
"Jean d'Alembert":"Resolvió la ecuación de onda para una cuerda vibrante y formuló el principio que lleva su nombre en dinámica. También codirigió la «Enciclopedia» con Diderot.",
"Lazzaro Spallanzani":"Hirvió caldos y los selló para demostrar que no surgen microbios por generación espontánea. También estudió la fecundación, la digestión y cómo se orientan los murciélagos.",
"Jan Ingenhousz":"Mostró que las plantas verdes liberan oxígeno con la luz y consumen dióxido de carbono. Fue médico y promovió la inoculación contra la viruela.",
"Charles Messier":"Compiló un catálogo de unos cien objetos difusos del cielo, como nebulosas y cúmulos, para no confundirlos con cometas. Aún se usan sus designaciones, como M31.",
"Charles-Augustin de Coulomb":"Midió con una balanza de torsión la fuerza entre cargas eléctricas, que disminuye con el cuadrado de la distancia. La unidad de carga, el culombio, lleva su nombre.",
"James Watt":"Mejoró la máquina de vapor con un condensador separado, que la hizo mucho más eficiente. La unidad de potencia, el vatio, lleva su nombre.",
"Martin Klaproth":"Químico alemán que descubrió el uranio y el circonio y contribuyó a establecer la química analítica. Fue el primer profesor de química de la Universidad de Berlín.",
"Philippe Pinel":"Médico francés que impulsó el trato humano de los pacientes mentales en los hospitales de Bicêtre y la Salpêtrière. Se le considera pionero de la psiquiatría moderna.",
"Xavier Bichat":"Propuso que los órganos se componen de tejidos y los distinguió de forma sistemática. Murió a los 30 años tras una enorme producción científica.",
"Robert Brown":"Observó el movimiento irregular de partículas en el agua, hoy llamado browniano, y describió el núcleo de la célula. También hizo importantes aportes a la botánica.",
"Sophie Germain":"Autodidacta que usó un seudónimo masculino para corresponder con Gauss. Hizo avances en el último teorema de Fermat y ganó un premio por su teoría de la elasticidad.",
"Jöns Jacob Berzelius":"Introdujo los símbolos químicos con letras y determinó pesos atómicos con gran precisión. Descubrió el selenio, el torio y el cerio.",
"Nikolái Lobachevski":"Desarrolló una geometría en la que por un punto exterior a una recta pasan infinitas paralelas. Su trabajo fue poco reconocido en vida y es base de las geometrías no euclidianas.",
"János Bolyai":"Descubrió de forma independiente una geometría no euclidiana a los 21 años. Su obra se publicó como apéndice de un libro de su padre.",
"Niels Henrik Abel":"Demostró que la ecuación general de quinto grado no se puede resolver con radicales. Murió de tuberculosis a los 26 años, poco antes de recibir una oferta de trabajo en Berlín.",
"William Rowan Hamilton":"Inventó los cuaterniones, números de cuatro componentes útiles para describir rotaciones. También reformuló la mecánica clásica con el formalismo hamiltoniano.",
"Louis Agassiz":"Propuso que Europa estuvo cubierta por grandes glaciares en el pasado, la teoría de las edades de hielo. Fue un influyente naturalista que se opuso a la evolución darwiniana.",
"George Boole":"Creó un álgebra de la lógica con los valores verdadero y falso. Su sistema, el álgebra de Boole, es base de los circuitos digitales y la programación.",
"Hermann von Helmholtz":"Formuló con claridad el principio de conservación de la energía y estudió la visión y la audición. Inventó el oftalmoscopio.",
"Francis Galton":"Primo de Darwin que aplicó la estadística a la herencia e introdujo la correlación y la regresión. Propuso usar huellas dactilares para identificar personas y fundó la eugenesia, hoy desacreditada.",
"Rudolf Clausius":"Introdujo el concepto de entropía y enunció que el calor no pasa espontáneamente de un cuerpo frío a uno caliente. Fue figura clave de la segunda ley de la termodinámica.",
"Wilhelm Wundt":"Abrió en Leipzig en 1879 el primer laboratorio de psicología experimental. Estudió la percepción y el tiempo de reacción.",
"William Henry Perkin":"A los 18 años sintetizó por accidente la malveína, el primer colorante sintético, mientras buscaba quinina. Con ello nació la industria de los colorantes artificiales.",
"Josiah Willard Gibbs":"Aplicó la termodinámica a las reacciones químicas y definió la energía libre de Gibbs. También fundó la mecánica estadística moderna.",
"Camillo Golgi":"Inventó una tinción con nitrato de plata que mostró detalles de las células nerviosas. Compartió con Cajal el Nobel de 1906, pese a defender una teoría distinta del sistema nervioso.",
"Ilya Méchnikov":"Descubrió que ciertas células blancas engullen microbios, proceso llamado fagocitosis. Compartió el Nobel de 1908 con Ehrlich y sentó bases de la inmunología.",
"Hugo de Vries":"Redescubrió las leyes de Mendel y propuso que las especies nuevas surgen por mutaciones. Estudió la onagra para mostrarlo.",
"Karl Pearson":"Fundó la estadística matemática y creó el coeficiente de correlación y la prueba chi-cuadrado. Creó el primer departamento universitario de estadística.",
"Robert Millikan":"Con el experimento de la gota de aceite midió la carga del electrón. Recibió el Nobel de 1923 y estudió también el efecto fotoeléctrico y los rayos cósmicos.",
"Otto Hahn":"En 1938 detectó bario al bombardear uranio con neutrones, evidencia de la fisión nuclear. Recibió el Nobel de Química de 1944.",
"Ronald Fisher":"Desarrolló el análisis de varianza y la inferencia estadística moderna, y unió la selección natural con la genética mendeliana. Su libro sobre el diseño de experimentos es un clásico.",
"Norbert Wiener":"Fundó la cibernética, el estudio del control y la comunicación en máquinas y seres vivos. También contribuyó al movimiento browniano y al análisis de señales.",
"Gerty Cori":"Con su esposo describió el ciclo de Cori, cómo el cuerpo recicla glucosa entre músculo e hígado. Fue la primera mujer en ganar un Nobel de Medicina, en 1947.",
"Irène Joliot-Curie":"Hija de Marie Curie. Con su esposo Frédéric produjo isótopos radiactivos artificiales y recibió el Nobel de Química de 1935.",
"Manuel Sandoval Vallarta":"Físico mexicano que estudió con Lemaître el efecto de la latitud sobre los rayos cósmicos. Fue profesor en el MIT y luego impulsó la ciencia en México.",
"Wolfgang Pauli":"Formuló el principio de exclusión, según el cual dos electrones no pueden ocupar el mismo estado cuántico. También predijo la existencia del neutrino.",
"Andréi Kolmogórov":"Dio a la probabilidad una base axiomática en 1933 y contribuyó al estudio de la turbulencia y la complejidad algorítmica. Es una de las figuras clave de la matemática del siglo XX.",
"Georgy Gamow":"Aplicó la mecánica cuántica al núcleo atómico y contribuyó a la teoría del Big Bang con Alpher y Herman. También fue un gran divulgador de la ciencia.",
"Hans Bethe":"Explicó en 1938 cómo las estrellas producen energía por fusión nuclear y recibió el Nobel de 1967. También participó en el Proyecto Manhattan.",
"Clyde Tombaugh":"Descubrió Plutón en 1930 comparando placas fotográficas en el Observatorio Lowell. Fue considerado planeta hasta su reclasificación en 2006.",
"John Bardeen":"Co-inventó el transistor y desarrolló la teoría BCS de la superconductividad. Es el único ganador de dos Nobel de Física, en 1956 y 1972.",
"Fred Hoyle":"Propuso que los elementos pesados se forman en el interior de las estrellas. También popularizó el nombre «Big Bang» al criticar esa teoría en la radio.",
"Maurice Wilkins":"Obtuvo imágenes de difracción de rayos X de ADN que ayudaron a descifrar su estructura. Compartió el Nobel de 1962 con Watson y Crick.",
"Edward Lorenz":"Descubrió en 1963 que sistemas simples pueden ser muy sensibles a pequeños cambios, el origen del «efecto mariposa». Su trabajo en meteorología fundó la teoría del caos.",
"Frederick Sanger":"Desarrolló métodos para secuenciar proteínas y ADN y ganó dos Nobel de Química, en 1958 y 1980. Su técnica fue clave para el Proyecto Genoma Humano.",
"Gertrude Elion":"Diseñó medicamentos de forma racional, no por ensayo y error, como los usados contra la leucemia, la gota y el herpes. Compartió el Nobel de Medicina de 1988.",
"James Lovelock":"Propuso la hipótesis Gaia, que ve la Tierra como un sistema autorregulado. Inventó el detector de captura de electrones, que ayudó a detectar los CFC en la atmósfera.",
"Rosalyn Yalow":"Desarrolló el radioinmunoensayo, una técnica que mide cantidades diminutas de hormonas. Recibió el Nobel de Medicina de 1977.",
"César Lattes":"Co-descubrió el mesón pi en 1947 usando emulsiones nucleares expuestas en el monte Chacaltaya, en Bolivia. Impulsó la física en Brasil.",
"Luis Miramontes":"Con Carl Djerassi y George Rosenkranz sintetizó la noretisterona en 1951, base de las primeras píldoras anticonceptivas orales. Era entonces un joven químico mexicano.",
"Benoît Mandelbrot":"Acuñó el término «fractal» y estudió su geometría, incluido el conjunto que lleva su nombre. Aplicó estas ideas a las finanzas, las formas naturales y el ruido.",
"Ricardo Miledi":"Neurocientífico mexicano que estudió con Bernard Katz cómo se transmiten las señales entre neuronas y músculos. Investigó los neurotransmisores y sus receptores.",
"Humberto Maturana":"Chileno que propuso con Francisco Varela el concepto de autopoiesis para definir a los seres vivos. También estudió la visión de las ranas.",
"Lynn Margulis":"Defendió que las mitocondrias y los cloroplastos proceden de bacterias incorporadas a otras células. Su teoría endosimbiótica se aceptó con el tiempo.",
"Andrew Wiles":"En 1995 demostró el último teorema de Fermat tras siete años de trabajo casi en secreto. Recibió numerosos reconocimientos, entre ellos el premio Abel de 2016.",
"Maryam Mirzakhani":"Estudió la geometría de superficies hiperbólicas y sus espacios de moduli. Fue la primera mujer en ganar la Medalla Fields, en 2014, y murió en 2017.",
"Averroes":"Filósofo y médico de Córdoba que comentó las obras de Aristóteles y escribió el «Kulliyat» de medicina. Reconoció que quien supera la viruela queda inmune.",
"José Celestino Mutis":"Dirigió la Real Expedición Botánica de Nueva Granada durante más de 25 años, con miles de láminas de plantas. Fue médico, botánico y matemático.",
"Francisco José de Caldas":"Sabio colombiano que estudió la distribución de las plantas según la altura y usó la ebullición del agua para medir altitudes. Murió fusilado durante la reconquista española.",
"Hipólito Unanue":"Médico peruano que estudió el clima, la geografía y las enfermedades del Perú y escribió «Observaciones sobre el clima de Lima». Fue figura de la ciencia ilustrada del país.",
"Pedro de Peralta y Barnuevo":"Polímata limeño y rector de la Universidad de San Marcos. Escribió sobre matemáticas, astronomía, fortificaciones e historia, y publicó almanaques astronómicos.",
"Richard Owen":"Anatomista inglés que acuñó el término «dinosaurio» en 1842 y fundó el Museo de Historia Natural de Londres. Se opuso a la teoría de Darwin.",
"Isambard Brunel":"Ingeniero que construyó el Great Western Railway, el puente colgante de Clifton y barcos de vapor como el SS Great Britain. Planificó grandes obras de ingeniería civil.",
"Elizabeth Blackwell":"Fue la primera mujer en obtener un título de médica en EE. UU., en 1849. Fundó un hospital y una escuela de medicina para mujeres en Nueva York.",
"Paul Broca":"Identificó en 1861 una región del lóbulo frontal ligada a la producción del habla, hoy llamada área de Broca. También impulsó la antropología física.",
"Eduard Suess":"Geólogo austriaco que propuso el supercontinente Gondwana y acuñó el término «biosfera». Describió cómo se formaron los Alpes.",
"Ernst Haeckel":"Naturalista alemán que acuñó el término «ecología» y difundió las ideas de Darwin en Alemania. Es famoso por sus detallados dibujos de organismos marinos.",
"Alexander Graham Bell":"Patentó el teléfono en 1876 tras trabajar con personas sordas y estudiar el habla. También fundó laboratorios y colaboró en el desarrollo de la aviación.",
"Adolfo Lutz":"Médico brasileño que estudió enfermedades como la leishmaniasis, la esquistosomiasis y la fiebre amarilla. Sus investigaciones en entomología médica fueron pioneras.",
"Jagadish Chandra Bose":"Demostró la transmisión de ondas de radio de corta longitud y diseñó detectores. También mostró, con instrumentos propios, que las plantas responden a estímulos.",
"Ronald Ross":"Mostró en 1897 que el parásito de la malaria se desarrolla en mosquitos Anopheles. Recibió el Nobel de Medicina de 1902.",
"Andrija Mohorovičić":"Sismólogo croata que en 1909 identificó el límite entre la corteza y el manto terrestres, hoy llamado Moho. Lo dedujo del análisis de ondas sísmicas.",
"Konstantin Tsiolkovski":"Dedujo la ecuación del cohete y propuso cohetes de combustible líquido y de varias etapas. Es considerado el padre de la astronáutica teórica.",
"Rudolf Diesel":"Patentó en 1892 un motor de combustión interna con encendido por compresión, el motor diésel. Murió en 1913 en circunstancias que no se aclararon.",
"Willem Einthoven":"Desarrolló el galvanómetro de cuerda, un electrocardiógrafo sensible, y describió las derivaciones del ECG. Recibió el Nobel de Medicina de 1924.",
"Annie Jump Cannon":"Clasificó cientos de miles de espectros estelares en el Observatorio de Harvard y creó la secuencia O, B, A, F, G, K, M. Aún se usa.",
"Wilbur Wright":"Con su hermano Orville diseñó, construyó y voló en 1903 el primer avión con motor controlado por un piloto. Antes probaron con planeadores y un túnel de viento.",
"Harvey Cushing":"Perfeccionó técnicas quirúrgicas del cerebro y redujo mucho la mortalidad en neurocirugía. Describió también la enfermedad que lleva su nombre.",
"Alberto Santos-Dumont":"Brasileño que diseñó y voló dirigibles en París y en 1906 realizó un vuelo público en su avión 14-bis. Es considerado pionero de la aviación en Brasil.",
"Guglielmo Marconi":"Desarrolló la telegrafía sin hilos y envió señales a través del Atlántico en 1901. Recibió el Nobel de Física de 1909.",
"Oswald Avery":"Con MacLeod y McCarty mostró en 1944 que el ADN, y no las proteínas, transmite la información hereditaria. Su hallazgo preparó el camino de la biología molecular.",
"Robert Goddard":"Lanzó en 1926 el primer cohete de combustible líquido. Obtuvo muchas patentes y fue pionero de la propulsión de cohetes.",
"Santiago Antúnez de Mayolo":"Ingeniero peruano nacido en Áncash que propuso aprovechar el Cañón del Pato para generar electricidad. También fue estudioso de la física y las matemáticas.",
"Aldo Leopold":"Forestal y ecólogo que escribió «Almanaque de un condado arenoso», donde propuso la ética de la tierra. Es una figura clave de la conservación.",
"Inge Lehmann":"Sismóloga danesa que dedujo en 1936 que la Tierra tiene un núcleo interno sólido dentro del núcleo líquido. Lo logró estudiando ondas sísmicas.",
"Selman Waksman":"Descubrió la estreptomicina, el primer antibiótico eficaz contra la tuberculosis, y acuñó el término «antibiótico». Recibió el Nobel de Medicina de 1952.",
"Meghnad Saha":"Derivó la ecuación de ionización que relaciona la temperatura y composición de las estrellas con sus espectros. Fue clave para la astrofísica.",
"Raymond Dart":"Describió en 1925 el cráneo del niño de Taung, el primer Australopithecus africanus. Su hallazgo apuntó al origen africano de la humanidad.",
"Pyotr Kapitsa":"Descubrió la superfluidez del helio líquido, por lo que recibió el Nobel de 1978. También estudió campos magnéticos intensos.",
"Gerhard Domagk":"Descubrió que el colorante prontosil combate infecciones bacterianas, base de las sulfamidas. Recibió el Nobel de 1939, pero el régimen nazi le prohibió aceptarlo.",
"Howard Florey":"Dirigió el equipo de Oxford que, con Chain y Heatley, convirtió la penicilina en un fármaco utilizable. Compartió el Nobel de 1945 con Fleming y Chain.",
"Percy Julian":"Químico afroamericano que sintetizó la fisostigmina y esteroides como la cortisona a partir de la soja. Facilitó tratamientos para el glaucoma y la artritis.",
"Charles Richter":"Creó con Gutenberg en 1935 una escala para medir la magnitud de los terremotos. Se popularizó con su nombre.",
"Cecilia Payne":"En su tesis de 1925 mostró que las estrellas son sobre todo hidrógeno y helio. Su resultado fue minimizado al principio y luego aceptado.",
"Louis Leakey":"Con su familia exploró Olduvai, en Tanzania, y halló fósiles de homínidos. Apoyó a Goodall, Fossey y Galdikas en el estudio de los primates.",
"Alonzo Church":"Creó el cálculo lambda, un sistema formal de funciones, y enunció la tesis de Church-Turing. Fue director de tesis de Alan Turing.",
"Charles Drew":"Desarrolló métodos para separar y almacenar plasma sanguíneo y organizó bancos de sangre durante la Segunda Guerra Mundial. Fue un destacado cirujano.",
"Erwin Chargaff":"Descubrió que en el ADN la cantidad de adenina iguala a la de timina y la de guanina a la de citosina. Su regla ayudó a Watson y Crick.",
"Harry Hess":"Propuso en 1960 que el fondo oceánico se crea en las dorsales y se desplaza hacia los lados. Su idea fue clave para la tectónica de placas.",
"Albert Sabin":"Desarrolló una vacuna oral contra la polio con virus atenuado, más barata y fácil de administrar. Se usó en campañas masivas que casi erradicaron la enfermedad.",
"Ernst Chain":"Aisló y purificó la penicilina junto con Florey y mostró su eficacia en animales. Compartió el Nobel de Medicina de 1945.",
"Maria Goeppert Mayer":"Propuso el modelo de capas del núcleo atómico, donde los nucleones se agrupan en niveles de energía. Compartió el Nobel de Física de 1963.",
"Sergei Korolev":"Fue el diseñador jefe del programa espacial soviético, desde el Sputnik hasta el vuelo de Gagarin. Su identidad se mantuvo secreta durante su vida.",
"Lev Landau":"Teórico soviético que desarrolló la teoría de la superfluidez y contribuyó a muchas áreas de la física. Recibió el Nobel de 1962 y fue coautor de un famoso curso de física teórica.",
"Virginia Apgar":"Creó en 1952 un sistema de cinco criterios para evaluar la salud de un recién nacido al minuto de nacer. Se usa en todo el mundo.",
"Konrad Zuse":"Construyó la Z3 en 1941, considerada la primera computadora programable de funcionamiento completo. También diseñó el lenguaje Plankalkül.",
"Jacques Monod":"Con François Jacob propuso el modelo del operón, que explica cómo se activan y desactivan los genes. Compartieron el Nobel de Medicina de 1965.",
"Wernher von Braun":"Dirigió el desarrollo del cohete V-2 en Alemania y luego del Saturno V, que llevó a los astronautas del Apolo a la Luna. Su pasado nazi es muy polémico.",
"Mary Leakey":"Descubrió el cráneo de Proconsul y las huellas fósiles de Laetoli, de unos 3,6 millones de años. Mostraron que los homínidos caminaban erguidos.",
"Hedy Lamarr":"Actriz e inventora que patentó en 1942 con George Antheil un sistema de saltos de frecuencia para guiar torpedos. Sus ideas inspiraron tecnologías de comunicación como el wifi.",
"Maurice Hilleman":"Desarrolló más de ocho vacunas de uso habitual, como las del sarampión, las paperas, la hepatitis B y la varicela. Se calcula que salvó millones de vidas.",
"François Jacob":"Con Jacques Monod descubrió el operón lac, que explica la regulación de genes en bacterias. Compartió el Nobel de Medicina de 1965.",
"Marie Tharp":"Con Bruce Heezen elaboró los primeros mapas del fondo oceánico y descubrió el valle del rift de la dorsal mesoatlántica. Sus mapas respaldaron la deriva continental.",
"Christiaan Barnard":"Realizó en 1967 en Ciudad del Cabo el primer trasplante de corazón humano. El paciente sobrevivió 18 días.",
"Har Gobind Khorana":"Sintetizó genes artificiales y contribuyó a descifrar el código genético. Compartió el Nobel de Medicina de 1968.",
"Stephanie Kwolek":"Descubrió en 1965 una solución de polímero que dio origen a la fibra Kevlar, cinco veces más resistente que el acero a igual peso. Se usa en chalecos antibalas.",
"Marshall Nirenberg":"Descifró los primeros codones del código genético con experimentos en sistemas sin células. Compartió el Nobel de Medicina de 1968.",
"César Milstein":"Con Georges Köhler desarrolló la técnica de los anticuerpos monoclonales. Compartieron el Nobel de Medicina de 1984 con Niels Jerne.",
"John McCarthy":"Organizó la conferencia de Dartmouth de 1956 y acuñó el término «inteligencia artificial». También creó el lenguaje LISP.",
"Marvin Minsky":"Cofundó el laboratorio de inteligencia artificial del MIT y escribió «La sociedad de la mente». Recibió el premio Turing en 1969.",
"E. O. Wilson":"Estudió las hormigas y desarrolló con MacArthur la teoría de biogeografía de islas. Popularizó el término «biodiversidad».",
"Murray Gell-Mann":"Propuso en 1964 que los hadrones están formados por quarks y clasificó partículas con el «camino óctuple». Recibió el Nobel de Física de 1969.",
"Edsger Dijkstra":"Ideó el algoritmo del camino más corto en un grafo que lleva su nombre. Defendió la programación estructurada y recibió el premio Turing en 1972.",
"Roger Penrose":"Demostró con teoremas de singularidades que los agujeros negros son una consecuencia de la relatividad general. Recibió el Nobel de Física de 2020.",
"Arno Penzias":"Con Robert Wilson detectó por accidente en 1964 la radiación cósmica de fondo de microondas, evidencia del Big Bang. Compartieron el Nobel de 1978.",
"Margaret Hamilton":"Dirigió el equipo que desarrolló el software de vuelo del Apolo y acuñó el término «ingeniería de software». Recibió la Medalla de la Libertad en 2016.",
"Donald Knuth":"Autor de «El arte de programar ordenadores» y creador del sistema TeX de composición de textos. Recibió el premio Turing en 1974.",
"Ada Yonath":"Con cristalografía de rayos X determinó la estructura del ribosoma, clave para entender cómo se fabrican las proteínas. Compartió el Nobel de Química de 2009.",
"Wangari Maathai":"Fundó el Movimiento Cinturón Verde, que plantó millones de árboles en Kenia. Fue la primera mujer africana en recibir el Nobel de la Paz, en 2004.",
"Kip Thorne":"Teórico que ayudó a concebir el observatorio LIGO y asesoró la película «Interstellar». Compartió el Nobel de Física de 2017.",
"Dennis Ritchie":"Creó el lenguaje C y co-creó el sistema operativo Unix en los Laboratorios Bell. Recibió el premio Turing en 1983.",
"Stephen Jay Gould":"Con Niles Eldredge propuso la teoría del equilibrio puntuado, que ve la evolución como largos periodos estables y cambios rápidos. Fue un gran divulgador.",
"Vinton Cerf":"Con Robert Kahn diseñó los protocolos TCP/IP, la base técnica de internet. Recibió el premio Turing en 2004.",
"Kary Mullis":"Inventó la reacción en cadena de la polimerasa (PCR), que permite copiar ADN millones de veces. Recibió el Nobel de Química de 1993.",
"Shinya Yamanaka":"Demostró que las células adultas pueden reprogramarse a un estado similar al embrionario, las células iPS. Compartió el Nobel de Medicina de 2012.",
"Francisco Mojica":"Descubrió y estudió las repeticiones CRISPR en microbios y propuso que forman un sistema inmune bacteriano. Sus ideas fueron clave para la edición genética.",
"Posidonio":"Estoico de Rodas que estimó la circunferencia de la Tierra y relacionó las mareas con la Luna. Según Cicerón, también construyó un planetario mecánico.",
"Al-Kindi":"Filósofo de Bagdad que escribió sobre matemáticas, óptica y medicina. En su tratado sobre criptografía describió el análisis de frecuencias para descifrar mensajes.",
"Thabit ibn Qurra":"Traductor y científico de Bagdad que revisó traducciones de Euclides y Arquímedes y estudió los números amigos. Propuso una fórmula para generarlos.",
"Al-Battani":"Astrónomo que midió la duración del año solar con gran precisión y mejoró los cálculos de Ptolomeo. Sus tablas fueron muy usadas en Europa.",
"Abu al-Wafa":"Matemático de Bagdad que desarrolló funciones trigonométricas como la tangente y mejoró métodos de geometría esférica. Escribió un manual de aritmética práctica.",
"Ibn Zuhr":"Médico de al-Ándalus que describió enfermedades y tratamientos basándose en la observación clínica. Su obra «Taysir» fue traducida al latín.",
"Bhaskara II":"Escribió el «Lilavati» y otros tratados de álgebra y astronomía. Resolvió ecuaciones diofánticas y anticipó ideas del cálculo diferencial.",
"Nicole Oresme":"Obispo francés que representó funciones con gráficas y criticó la astrología. Defendió que la Tierra podría rotar.",
"Madhava de Sangamagrama":"Fundó la escuela de Kerala y halló series infinitas para seno, coseno y arcotangente siglos antes que en Europa. También calculó pi con gran precisión.",
"Regiomontano":"Astrónomo alemán que escribió un tratado de trigonometría y difundió las obras de Ptolomeo. Su imprenta en Núremberg publicó tablas astronómicas.",
"Leonardo da Vinci":"Pintor e ingeniero que dejó miles de páginas de estudios de anatomía, hidráulica y mecánica. Diseñó máquinas voladoras y observó el vuelo de las aves.",
"Miguel Servet":"Médico aragonés que describió la circulación pulmonar antes que Harvey. Fue condenado por sus ideas religiosas y quemado en Ginebra en 1553.",
"Gabriele Falloppio":"Anatomista italiano que describió las trompas que llevan su nombre y estudió el oído y los huesos. Fue discípulo de Vesalio.",
"Ulisse Aldrovandi":"Naturalista boloñés que reunió una enorme colección de plantas, animales y minerales. Su obra enciclopédica influyó en la historia natural.",
"Santorio Santorio":"Médico veneciano que se pesó durante décadas en una balanza para estudiar la pérdida de peso por transpiración. Aplicó el termómetro a la clínica.",
"Marin Mersenne":"Fraile francés que organizó una red de correspondencia entre científicos de su tiempo. Estudió los números primos de la forma 2ⁿ−1.",
"Athanasius Kircher":"Jesuita alemán que escribió sobre volcanes, magnetismo, acústica y egiptología. Bajó al cráter del Vesubio y diseñó aparatos curiosos.",
"John Wallis":"Matemático inglés que introdujo el símbolo ∞ y trabajó en el cálculo antes de Newton. Escribió una «Aritmética de los infinitos».",
"Guillaume de l'Hôpital":"Publicó el primer libro de texto de cálculo diferencial, basado en ideas de Johann Bernoulli. La regla para límites indeterminados lleva su nombre.",
"Abraham de Moivre":"Matemático francés exiliado en Londres que trabajó en probabilidad y estadística. Su fórmula relaciona potencias de números complejos con senos y cosenos.",
"Thomas Bayes":"Pastor presbiteriano y matemático cuyo ensayo póstumo sobre probabilidad dio origen al teorema de Bayes. Hoy es base de la estadística bayesiana.",
"Émilie du Châtelet":"Tradujo los «Principia» de Newton al francés con comentarios y sostuvo que la energía depende del cuadrado de la velocidad. Fue colaboradora de Voltaire.",
"Laura Bassi":"En 1732 se doctoró en Bolonia y fue profesora universitaria de física. Impulsó la enseñanza de la física de Newton en Italia.",
"Maria Gaetana Agnesi":"Escribió «Instituciones analíticas», un manual de cálculo muy claro. Estudió una curva que, por un error de traducción, se llama «bruja de Agnesi».",
"John Michell":"Clérigo y geólogo inglés que propuso en 1783 que podrían existir estrellas tan masivas que ni la luz escaparía. También estudió terremotos y magnetismo.",
"Nevil Maskelyne":"Astrónomo real de Inglaterra que publicó el Almanaque Náutico y midió la atracción de una montaña para estimar la densidad de la Tierra.",
"Joseph Banks":"Naturalista que acompañó a Cook en su viaje a Tahití y Australia y fue presidente de la Royal Society. Impulsó el jardín botánico de Kew.",
"Gaspard Monge":"Matemático francés que fundó la geometría descriptiva, base del dibujo técnico. Cofundó la Escuela Politécnica y fue consejero de Napoleón.",
"William Smith":"Ingeniero inglés que observó que las capas de roca contienen fósiles característicos y publicó en 1815 el primer mapa geológico de Inglaterra y Gales.",
"Mary Somerville":"Escocesa que tradujo y explicó a Laplace y escribió «Sobre la conexión de las ciencias físicas». La llamaron la «reina de la ciencia del siglo XIX».",
"Joseph von Fraunhofer":"Óptico alemán que catalogó cientos de líneas oscuras en el espectro solar y creó la red de difracción. Sus instrumentos mejoraron los telescopios.",
"Augustin-Louis Cauchy":"Dio rigor al cálculo con definiciones precisas de límite y continuidad. Fue muy productivo y contribuyó a la teoría de funciones complejas.",
"Adolphe Quetelet":"Belga que aplicó la estadística a la sociedad y propuso la idea del «hombre medio». Su índice de masa corporal se usa hoy en medicina.",
"Carl Gustav Jacobi":"Matemático alemán que desarrolló las funciones elípticas y los determinantes que llevan su nombre. También aportó a la mecánica analítica.",
"Peter Dirichlet":"Probó que hay infinitos primos en toda progresión aritmética adecuada y formuló la definición moderna de función. Fue sucesor de Gauss en Gotinga.",
"Urbain Le Verrier":"Calculó la posición de un planeta desconocido a partir de las perturbaciones de Urano. Neptuno fue observado en 1846 donde él predijo.",
"Hippolyte Fizeau":"Midió la velocidad de la luz en 1849 con una rueda dentada y estudió el efecto Doppler en la luz. También fotografió el Sol.",
"George Stokes":"Matemático irlandés que formuló ecuaciones del movimiento de fluidos viscosos y estudió la fluorescencia. Su teorema relaciona integrales de superficie y de línea.",
"Léon Foucault":"En 1851 colgó un péndulo en el Panteón de París y mostró la rotación de la Tierra. También midió la velocidad de la luz y estudió las corrientes que llevan su nombre.",
"Stanislao Cannizzaro":"En 1860 defendió en Karlsruhe distinguir átomos y moléculas y usar la hipótesis de Avogadro. Eso permitió acordar los pesos atómicos.",
"Marcellin Berthelot":"Sintetizó compuestos orgánicos como el metanol y el acetileno a partir de elementos. También investigó la termoquímica y los explosivos.",
"August Kekulé":"Propuso que el carbono forma cuatro enlaces y que el benceno es un anillo de seis carbonos. Según la anécdota, lo imaginó al soñar con una serpiente que se mordía la cola.",
"Richard Dedekind":"Definió los números reales mediante cortaduras y estudió los ideales en la teoría de números. Fue amigo y corresponsal de Cantor.",
"William Crookes":"Descubrió el talio con espectroscopía y creó el tubo de rayos catódicos que lleva su nombre. También investigó el espiritismo.",
"John Venn":"Lógico inglés que popularizó los diagramas de círculos superpuestos para representar conjuntos. Escribió sobre lógica y probabilidad.",
"Giovanni Schiaparelli":"Observó en Marte líneas que llamó «canali», lo que alimentó la idea de canales artificiales. También demostró que las lluvias de meteoros provienen de cometas.",
"Johannes van der Waals":"Propuso una ecuación para gases que considera el volumen de las moléculas y sus fuerzas de atracción. Recibió el Nobel de Física de 1910.",
"Ernst Mach":"Estudió ondas de choque y fue de los primeros en fotografiar balas supersónicas. Su crítica al espacio absoluto inspiró a Einstein.",
"Edward Morley":"Con Michelson realizó en 1887 el experimento que no detectó el «éter» luminífero. También determinó con precisión el peso atómico del oxígeno.",
"Lord Rayleigh":"Explicó por qué el cielo es azul con su teoría de la dispersión de la luz. Descubrió el argón junto con Ramsay y recibió el Nobel de Física de 1904.",
"Albert Michelson":"Diseñó interferómetros de gran precisión para medir la velocidad de la luz. Fue el primer estadounidense en ganar un Nobel de ciencias, en 1907.",
"Emil Fischer":"Sintetizó azúcares como la glucosa y estudió cómo se unen los aminoácidos en péptidos. Propuso el modelo de «llave y cerradura» de las enzimas y recibió el Nobel de Química de 1902.",
"William Ramsay":"Descubrió, solo o con otros, los gases nobles neón, argón, criptón y xenón, y halló helio en la Tierra. Recibió el Nobel de Química de 1904.",
"Heike Kamerlingh Onnes":"Licuó el helio en 1908 y en 1911 descubrió que el mercurio pierde su resistencia eléctrica a temperaturas muy bajas: la superconductividad. Recibió el Nobel de 1913.",
"Andréi Márkov":"Estudió secuencias de eventos donde el futuro depende solo del presente, hoy llamadas cadenas de Márkov. Se usan en estadística, física e informática.",
"William Bragg":"Con su hijo Lawrence desarrolló la espectroscopía de rayos X para analizar cristales. Compartieron el Nobel de Física de 1915.",
"Karl Schwarzschild":"Halló en 1916 la primera solución exacta de las ecuaciones de Einstein, la que describe un agujero negro sin rotación. Murió ese año en el frente de la Primera Guerra Mundial.",
"Ejnar Hertzsprung":"Danés que relacionó el color y el brillo de las estrellas y calculó distancias a estrellas variables. Su diagrama, con el de Russell, es esencial en astrofísica.",
"Frederick Soddy":"Con Rutherford explicó la desintegración radiactiva y propuso que un mismo elemento puede tener átomos de distinta masa, los isótopos. Recibió el Nobel de Química de 1921.",
"Francis Aston":"Construyó el espectrógrafo de masas y descubrió isótopos de muchos elementos no radiactivos. Recibió el Nobel de Química de 1922.",
"Henry Norris Russell":"Astrónomo estadounidense que estudió la relación entre la luminosidad y el tipo espectral de las estrellas, base del diagrama H-R. También estudió la composición del Sol.",
"Victor Hess":"En 1912 midió la radiación en globos aerostáticos y mostró que aumenta con la altura, por lo que su origen es cósmico. Recibió el Nobel de Física de 1936.",
"Harlow Shapley":"Usó estrellas variables para medir la distancia a cúmulos globulares y mostró que el Sol no está en el centro de la galaxia. Debatió con Curtis sobre la escala del universo.",
"Hermann Weyl":"Matemático alemán que trabajó en geometría diferencial, grupos y relatividad. Propuso una teoría de «calibre» que se volvió central en la física moderna.",
"Lawrence Bragg":"Formuló la ley de Bragg para la difracción de rayos X en cristales. A los 25 años recibió el Nobel de 1915 con su padre, el más joven en lograrlo.",
"Stefan Banach":"Matemático polaco fundador del análisis funcional; los espacios de Banach llevan su nombre. Escribía muchas de sus ideas en cafés de Lviv.",
"Arthur Compton":"Mostró en 1923 que los rayos X cambian su longitud de onda al chocar con electrones, el efecto Compton, evidencia de la naturaleza corpuscular de la luz. Recibió el Nobel de 1927.",
"Fritz Zwicky":"Notó en 1933 que las galaxias del cúmulo de Coma se mueven como si hubiera mucha masa invisible. También propuso la existencia de las estrellas de neutrones.",
"Ernest Lawrence":"Inventó el ciclotrón, un acelerador de partículas circular. Recibió el Nobel de Física de 1939 y su nombre lleva el laboratorio de Berkeley.",
"Jan Oort":"Estudió la rotación de la Vía Láctea y propuso una nube de cometas en los confines del sistema solar. Fue pionero de la radioastronomía holandesa.",
"Carl Anderson":"Detectó en 1932 el positrón, la primera partícula de antimateria observada. Recibió el Nobel de Física de 1936 y descubrió también el muón.",
"Emilio Segrè":"Descubrió el tecnecio, el primer elemento creado artificialmente, y con Chamberlain el antiprotón. Compartió el Nobel de Física de 1959.",
"Edward Teller":"Físico húngaro que trabajó en el Proyecto Manhattan y fue principal defensor de la bomba de hidrógeno. También contribuyó a la física molecular y nuclear.",
"Paul Erdős":"Matemático errante que publicó más de 1.500 artículos con unos 500 coautores. Dio origen al «número de Erdős», que mide la distancia de colaboración.",
"Martin Ryle":"Pionero de la radioastronomía que desarrolló la síntesis de apertura para formar imágenes precisas. Compartió el Nobel de Física de 1974 con Hewish.",
"Yoichiro Nambu":"Propuso la ruptura espontánea de simetría en la física de partículas y contribuyó a los orígenes de la teoría de cuerdas. Recibió el Nobel de Física de 2008.",
"Antony Hewish":"Dirigió el grupo de Cambridge que detectó los púlsares con Jocelyn Bell. Recibió el Nobel de Física de 1974 con Ryle.",
"John Bell":"Demostró en 1964 un teorema que permite comprobar si la realidad cumple ciertas condiciones locales. Los experimentos mostraron que la mecánica cuántica lo viola.",
"Alexander Grothendieck":"Reconstruyó la geometría algebraica con esquemas y topos y recibió la Medalla Fields en 1966. Se retiró de la vida pública y vivió de forma solitaria en los Pirineos.",
"Steven Weinberg":"Con Glashow y Salam unificó el electromagnetismo y la fuerza débil, y recibió el Nobel de Física de 1979. También escribió libros divulgativos como «Los tres primeros minutos».",
"Su Song":"Construyó en Kaifeng una torre de reloj astronómico impulsada por agua, con esfera armilar y mecanismo de escape. También escribió un tratado de farmacología.",
