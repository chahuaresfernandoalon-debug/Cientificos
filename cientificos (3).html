"Alfred Nobel":"Inventó la dinamita en 1867 y registró más de 350 patentes. Con su fortuna creó los premios Nobel.",
"Adolf von Baeyer":"Sintetizó el colorante índigo y estudió las ftaleínas y el ácido barbitúrico. Recibió el Nobel de Química de 1905.",
"Otto Diels":"Con su alumno Kurt Alder descubrió una reacción que forma anillos de seis átomos, hoy una de las más usadas en síntesis orgánica. Compartieron el Nobel de Química de 1950.",
"Leo Baekeland":"Inventó la baquelita en 1907, el primer plástico totalmente sintético. Antes había creado el papel fotográfico Velox.",
"Charles Martin Hall":"Descubrió en 1886 un método electrolítico para producir aluminio barato, casi a la vez que Héroult. Eso hizo accesible el metal.",
"Percy Bridgman":"Desarrolló equipos para estudiar la materia a presiones extremas y fundó la física de altas presiones. Recibió el Nobel de Física de 1946.",
"Ludwig Prandtl":"Introdujo el concepto de capa límite en fluidos y desarrolló la teoría del ala. Es considerado el padre de la aerodinámica moderna.",
"Theodore von Kármán":"Estudió la dinámica de fluidos y las estelas de vórtices que llevan su nombre. Cofundó el Laboratorio de Propulsión a Reacción de la NASA.",
"Otto Lilienthal":"Realizó miles de vuelos en planeadores y estudió el vuelo de las aves. Murió en un accidente en 1896; sus tablas aerodinámicas inspiraron a los hermanos Wright.",
"Igor Sikorsky":"Diseñó los primeros helicópteros de producción práctica y aviones de gran tamaño, como el Ilya Muromets. Fundó una empresa de helicópteros en EE. UU.",
"Frank Whittle":"Patentó en 1930 el motor a reacción de turbina y construyó el primer prototipo funcional. Su diseño llevó a los aviones a reacción modernos.",
"Hermann Oberth":"Escribió «El cohete en el espacio interplanetario» y sentó bases teóricas de la astronáutica. Influyó en von Braun y en los primeros ingenieros de cohetes.",
"Carl Correns":"Redescubrió en 1900 las leyes de la herencia de Mendel, de forma casi simultánea con De Vries y Tschermak. Estudió la herencia extranuclear.",
"William Osler":"Impulsó la enseñanza clínica junto al paciente en Johns Hopkins y escribió «Principios y práctica de la medicina». Es considerado un fundador de la medicina moderna.",
"Theodor Billroth":"Realizó con éxito las primeras resecciones de estómago y de laringe. Fue figura clave de la cirugía y amigo de Brahms.",
"Emil Theodor Kocher":"Perfeccionó la cirugía de la glándula tiroides y mostró la relación entre su extirpación y el mixedema. Recibió el Nobel de Medicina de 1909.",
"Pierre Fauchard":"Publicó «El cirujano dentista» en 1728, que sistematizó la odontología. Describió empastes, prótesis y ortodoncia.",
"Gerhard Hansen":"Descubrió en 1873 el bacilo que causa la lepra, el Mycobacterium leprae. Fue uno de los primeros hallazgos que asoció una bacteria con una enfermedad humana.",
"Theodor Escherich":"Pediatra que descubrió en 1885 la bacteria que hoy lleva su nombre, Escherichia coli. También estudió las infecciones intestinales en niños.",
"Hans Christian Gram":"Desarrolló en 1884 la tinción que separa las bacterias en grampositivas y gramnegativas. Sigue siendo una prueba básica en microbiología.",
"Julius Petri":"Ayudante de Koch que diseñó en 1887 la placa de vidrio con tapa usada para cultivar microorganismos. Hoy es un símbolo de los laboratorios.",
"Charles Walcott":"Descubrió en 1909 en Canadá los esquistos de Burgess, con fósiles excepcionales de animales del Cámbrico. Dirigió el Servicio Geológico y la Smithsonian.",
"Othniel Marsh":"Describió numerosos dinosaurios, como Stegosaurus y Allosaurus, y fósiles que respaldaron la evolución. Su rivalidad con Cope se conoció como la «guerra de los huesos».",
"Edward Cope":"Describió cientos de especies fósiles de vertebrados y fue rival de Marsh en la «guerra de los huesos». Propuso ideas sobre la evolución de los mamíferos.",
"Donald Johanson":"Halló en 1974 en Etiopía el esqueleto parcial de Lucy, un Australopithecus afarensis de unos 3,2 millones de años. Fundó el Instituto de Orígenes Humanos.",
"Tuzo Wilson":"Propuso la teoría de los puntos calientes para explicar islas como Hawái y describió el ciclo de apertura y cierre de océanos. Fue figura clave de la tectónica de placas.",
"Beno Gutenberg":"Sismólogo que determinó la profundidad del límite entre el manto y el núcleo terrestre, la discontinuidad de Gutenberg. Con Richter desarrolló la escala de magnitud sísmica.",
"John Tukey":"Con Cooley desarrolló el algoritmo de la transformada rápida de Fourier y acuñó el término «bit». También fundó el análisis exploratorio de datos.",
"Richard Hamming":"Inventó códigos que detectan y corrigen errores en la transmisión de datos. Recibió el premio Turing en 1968.",
"Jean Bartik":"Fue una de las seis programadoras originales del ENIAC, que lo programaron sin manuales. Más tarde trabajó en el UNIVAC.",
"Seymour Papert":"Co-creó el lenguaje Logo para enseñar a niños a programar y desarrolló el construccionismo. Trabajó con Piaget y en el laboratorio de inteligencia artificial del MIT.",
"Judea Pearl":"Desarrolló las redes bayesianas y una teoría matemática de la causalidad. Recibió el premio Turing en 2011.",
"Demis Hassabis":"Cofundó DeepMind, cuyos sistemas AlphaGo y AlphaFold vencieron en el juego Go y predijeron estructuras de proteínas. Compartió el Nobel de Química de 2024.",
"Fei-Fei Li":"Impulsó ImageNet, un gran conjunto de imágenes etiquetadas que ayudó a avanzar la visión artificial con aprendizaje profundo. Es profesora en Stanford.",
"María Reiche":"Matemática alemana que dedicó su vida a medir y proteger las líneas y geoglifos de Nazca, en el Perú. Propuso que tenían relación con la astronomía y el calendario.",
"Hiram Bingham":"Explorador de Yale que en 1911 llegó a Machu Picchu guiado por campesinos locales y lo dio a conocer al mundo. Sus expediciones y colecciones fueron objeto de debate.",
"Max Uhle":"Arqueólogo alemán que excavó Pachacámac y otros sitios andinos y estableció secuencias cronológicas de las culturas del Perú. Es considerado padre de la arqueología científica peruana.",
"Rebeca Carrión Cachot":"Arqueóloga peruana que estudió los mantos de Paracas y la cultura Chavín. Dirigió el Museo Nacional de Arqueología de Lima.",
"Carlos Ponce Sanginés":"Arqueólogo boliviano que dirigió investigaciones en Tiwanaku, cerca del lago Titicaca, y estableció su cronología. Fue figura clave de la arqueología andina.",
"Manuel Sadosky":"Matemático que impulsó la computación científica en Argentina y trajo la computadora Clementina a la Universidad de Buenos Aires. Fue figura de la divulgación científica.",
"Cecilia Grierson":"Se graduó en 1889 como la primera médica de Argentina. Impulsó la formación de enfermeras y fundó una escuela de enfermería.",
"Alfonso Caso":"Arqueólogo mexicano que dirigió las excavaciones de Monte Albán y halló la famosa Tumba 7. Fue figura clave de la arqueología de Mesoamérica.",
"Otto Frisch":"Con Meitner dio la primera explicación teórica de la fisión nuclear y acuñó el término «fisión». Con Peierls elaboró el memorándum que impulsó el proyecto de bomba atómica británico.",
"Fritz Strassmann":"Con Hahn identificó el bario producido al bombardear uranio con neutrones, evidencia de la fisión. Su papel suele quedar en segundo plano; fue honrado como Justo entre las Naciones.",
"Owen Chamberlain":"Con Emilio Segrè produjo y detectó en 1955 el antiprotón en un acelerador. Compartieron el Nobel de Física de 1959.",
"Patrick Blackett":"Usó la cámara de niebla para observar la primera transmutación de un núcleo en una colisión y para estudiar rayos cósmicos. Recibió el Nobel de Física de 1948.",
"Varahamihira":"Astrónomo y matemático indio que escribió la «Brhat Samhita» sobre astronomía, meteorología y geología. Resumió los cinco sistemas astronómicos de su época.",
"Al-Farghani":"Astrónomo de Bagdad cuyo «Elementos de astronomía» resumió a Ptolomeo y fue muy leído en Europa. Calculó el diámetro de la Tierra.",
"Ibn Yunus":"Astrónomo de El Cairo que compiló las tablas hakimíes con observaciones de eclipses y conjunciones. Sus datos se usaron siglos después.",
"Ibn Sahl":"Describió hacia el año 984 la ley de refracción de la luz, siglos antes que Snell, y estudió lentes curvas. Su tratado sobre espejos ardientes fue pionero.",
"Al-Karaji":"Desarrolló el álgebra de polinomios y usó una forma temprana de inducción matemática. Describió el triángulo de coeficientes binomiales.",
"Jamshid al-Kashi":"Calculó pi con 16 cifras decimales y mejoró métodos de cálculo numérico. Trabajó en el observatorio de Samarcanda.",
"Qin Jiushao":"Publicó el «Tratado matemático en nueve secciones» con el método que hoy se llama teorema chino del resto. También resolvió ecuaciones de grado superior.",
"Guo Shoujing":"Astrónomo e ingeniero que construyó instrumentos y elaboró el calendario Shoushi con un año de 365,2425 días. Dirigió obras hidráulicas.",
"Girolamo Fracastoro":"Médico y poeta que propuso que algunas enfermedades se transmiten por «semillas» contagiosas. Dio nombre a la sífilis en un poema de 1530.",
"Bartolomeo Eustachi":"Anatomista italiano que describió la trompa que lleva su nombre, que une el oído medio con la faringe. Sus láminas anatómicas se publicaron mucho después.",
"Realdo Colombo":"Anatomista que describió la circulación de la sangre por los pulmones y estudió el corazón. Sucedió a Vesalio en Padua.",
"Gaspard Bauhin":"Botánico que describió unas 6.000 plantas en su «Pinax» y usó nombres de dos palabras, un antecedente de Linneo.",
"Jan van Helmont":"Acuñó el término «gas» y mostró con un sauce que las plantas ganan masa sobre todo a partir del agua. Estudió el dióxido de carbono.",
"Vincenzo Viviani":"Fue el último discípulo de Galileo y escribió su primera biografía. Realizó una medida temprana de la velocidad del sonido.",
"Francesco Maria Grimaldi":"Jesuita que describió la difracción de la luz y acuñó ese nombre. También elaboró un mapa detallado de la Luna.",
"Nehemiah Grew":"Fue pionero de la anatomía de las plantas con el microscopio y reconoció el papel de los estambres en la reproducción. Escribió «Anatomía de las plantas».",
"Antoine Laurent de Jussieu":"Botánico que publicó una clasificación natural de las plantas por familias. Su sistema influyó mucho en la botánica.",
"Michel Adanson":"Naturalista que estudió Senegal y propuso clasificar con muchos caracteres a la vez. El baobab africano lleva su nombre, Adansonia.",
"Torbern Bergman":"Sistematizó la química analítica y las afinidades químicas, y estudió las aguas minerales. Fue maestro de Scheele.",
"Joseph Proust":"Formuló la ley según la cual un compuesto contiene siempre los mismos elementos en proporciones fijas. Su disputa con Berthollet fue célebre.",
"Claude Berthollet":"Estudió el equilibrio de las reacciones químicas y las aplicaciones del cloro como blanqueador. Participó en la nueva nomenclatura química.",
"Aimé Bonpland":"Botánico que acompañó a Humboldt por América y reunió miles de plantas. Se estableció después en Argentina y Paraguay.",
"Félix de Azara":"Militar y naturalista que describió las aves y cuadrúpedos del Paraguay y el Río de la Plata. Su obra influyó en Darwin.",
"Alcide d'Orbigny":"Naturalista francés que recorrió Sudamérica durante ocho años, incluidos Bolivia y Perú, y publicó «Viaje a la América meridional». Fundó la micropaleontología.",
"Robert FitzRoy":"Capitán del Beagle en el viaje de Darwin y pionero de los pronósticos del tiempo. Fue el primer jefe del servicio meteorológico británico.",
"Frederick Reines":"Con Clyde Cowan detectó en 1956 el neutrino, una partícula propuesta por Pauli en 1930. Recibió el Nobel de Física de 1995.",
"James Cronin":"Con Val Fitch mostró en 1964 que la simetría CP se viola en la desintegración de los kaones. Compartieron el Nobel de Física de 1980.",
"Burton Richter":"Co-descubrió la partícula J/psi, que mostró la existencia del quark encantado. Compartió el Nobel de Física de 1976 con Samuel Ting.",
"Martin Perl":"Descubrió el leptón tau, una partícula similar al electrón pero mucho más pesada. Recibió el Nobel de Física de 1995.",
"Carlo Rubbia":"Dirigió el experimento del CERN que detectó los bosones W y Z, portadores de la fuerza débil. Compartió el Nobel de Física de 1984 con van der Meer.",
"Simon van der Meer":"Inventó el enfriamiento estocástico de haces de partículas, clave para producir los bosones W y Z. Compartió el Nobel de Física de 1984.",
"Georges Köhler":"Con César Milstein desarrolló la técnica para producir anticuerpos monoclonales con hibridomas. Compartieron el Nobel de Medicina de 1984.",
"Richard Smalley":"Con Kroto y Curl descubrió el buckminsterfullereno en 1985 usando láseres. Compartieron el Nobel de Química de 1996.",
"Robert Curl":"Co-descubrió los fulerenos junto con Kroto y Smalley. Compartió el Nobel de Química de 1996.",
"Frank Sherwood Rowland":"Con Mario Molina mostró que los CFC destruyen la capa de ozono. Compartieron el Nobel de Química de 1995 con Crutzen.",
"Paul Crutzen":"Mostró cómo los óxidos de nitrógeno afectan la capa de ozono y popularizó el término «Antropoceno». Compartió el Nobel de Química de 1995.",
"Susan Solomon":"Propuso que las nubes polares estratosféricas y los compuestos de cloro causan el agujero de ozono antártico. Su trabajo respaldó el Protocolo de Montreal.",
"Joseph Farman":"Con Gardiner y Shanklin publicó en 1985 las mediciones que mostraron la caída del ozono sobre la Antártida. Su hallazgo impulsó la acción internacional.",
"Syukuro Manabe":"Desarrolló modelos físicos del clima que mostraron cómo el aumento de CO₂ calienta la atmósfera. Compartió el Nobel de Física de 2021 con Hasselmann y Parisi.",
"Charles Keeling":"Comenzó en 1958 en Mauna Loa las mediciones continuas de CO₂ atmosférico que muestran su aumento. Su registro se conoce como curva de Keeling.",
"Wallace Broecker":"Describió la «cinta transportadora» de las corrientes oceánicas y su papel en los cambios climáticos. Popularizó la expresión «calentamiento global» en 1975.",
"Milutin Milanković":"Calculó cómo las variaciones de la órbita terrestre influyen en el clima y las glaciaciones. Sus ciclos fueron confirmados décadas después.",
"John Tyndall":"Mostró que gases como el vapor de agua y el CO₂ absorben calor y explicó por qué el cielo es azul. Estudió también los glaciares.",
"Eunice Foote":"Realizó en 1856 experimentos que mostraron que el dióxido de carbono atrapa el calor del Sol. Su trabajo se redescubrió mucho después.",
"Guy Callendar":"Ingeniero que argumentó en 1938 que la quema de combustibles estaba aumentando el CO₂ y calentando la Tierra. Su idea se conoció como efecto Callendar.",
"Vilhelm Bjerknes":"Fundó la escuela de Bergen de meteorología y propuso predecir el tiempo con ecuaciones físicas. Su trabajo introdujo el concepto de frentes.",
"Carl-Gustaf Rossby":"Describió las grandes ondas de la atmósfera y los océanos que llevan su nombre y fundó la meteorología moderna en EE. UU.",
"Luke Howard":"Propuso en 1802 los nombres de nubes que aún se usan, como cumulus, stratus y cirrus. Fue un meteorólogo aficionado y farmacéutico.",
"Francis Beaufort":"Almirante e hidrógrafo que creó la escala de Beaufort para estimar la fuerza del viento por sus efectos. También dirigió el servicio hidrográfico británico.",
"Thomas Addison":"Describió la insuficiencia de las glándulas suprarrenales, hoy enfermedad de Addison, y la anemia perniciosa. Trabajó en el Guy's Hospital.",
"Richard Bright":"Relacionó la presencia de proteínas en la orina y la hinchazón con enfermedad del riñón, antes llamada enfermedad de Bright. Fue pionero de la nefrología.",
"Thomas Hodgkin":"Describió en 1832 un grupo de casos de enfermedad de los ganglios linfáticos, hoy linfoma de Hodgkin. También defendió causas humanitarias.",
"James Parkinson":"Describió en 1817 la «parálisis agitante», hoy enfermedad de Parkinson. También fue geólogo y activista social.",
"George Huntington":"Describió en 1872 la enfermedad hereditaria que lleva su nombre, con movimientos involuntarios y deterioro mental. Su descripción fue base de la genética de la enfermedad.",
"Guillaume Duchenne":"Describió la distrofia muscular que lleva su nombre y fue pionero del uso de la estimulación eléctrica en neurología. Fotografió expresiones faciales con electricidad.",
"Tilly Edinger":"Fundó la paleoneurología al estudiar la forma del cerebro en fósiles. Huyó de la Alemania nazi y trabajó en Harvard.",
"Florence Sabin":"Mostró que el sistema linfático se desarrolla a partir de las venas y fue la primera mujer catedrática de Johns Hopkins. Luego impulsó reformas de salud pública en Colorado.",
"Alice Hamilton":"Pionera de la salud laboral que investigó los efectos del plomo y otras sustancias tóxicas en trabajadores. Fue la primera mujer en la facultad de Harvard.",
"Harish-Chandra":"Desarrolló la teoría de representaciones de grupos de Lie semisimples y el análisis armónico sobre ellos. Trabajó en Princeton.",
"C. R. Rao":"Estadístico indio que contribuyó a la teoría de la estimación, con la cota de Cramér-Rao, y al análisis multivariado. Recibió el premio Internacional de Estadística en 2023.",
"Kunihiko Kodaira":"Hizo aportes a la geometría compleja y a la clasificación de superficies. Recibió la Medalla Fields en 1954.",
"Hirotugu Akaike":"Desarrolló el criterio de información de Akaike, un método para comparar modelos estadísticos. Es usado en muchas ciencias.",
"Niklaus Wirth":"Diseñó los lenguajes Pascal, Modula y Oberon y formuló la «ley de Wirth» sobre el software que se vuelve más lento. Recibió el premio Turing en 1984.",
"Ken Thompson":"Co-creó el sistema operativo Unix y el lenguaje B, antecesor de C. Recibió el premio Turing en 1983 con Ritchie.",
"Linus Torvalds":"Creó en 1991 el núcleo Linux y más tarde el sistema de control de versiones Git. Linux es hoy base de muchos servidores y de Android.",
"Guido van Rossum":"Creó el lenguaje de programación Python, conocido por su sintaxis legible. Python es hoy uno de los lenguajes más usados.",
"Bjarne Stroustrup":"Diseñó el lenguaje C++ como extensión de C con programación orientada a objetos. Se usa en sistemas, videojuegos y software de alto rendimiento.",
"Leslie Lamport":"Hizo aportes fundamentales a los sistemas distribuidos, como los relojes lógicos y el algoritmo Paxos. Creó también LaTeX. Recibió el premio Turing en 2013.",
"Whitfield Diffie":"Con Hellman propuso en 1976 el intercambio de claves y la criptografía de clave pública. Recibieron el premio Turing en 2015.",
"Martin Hellman":"Co-inventó el intercambio de claves Diffie-Hellman, que permite acordar una clave secreta por un canal inseguro. Recibió el premio Turing en 2015.",
"John Clauser":"Realizó los primeros experimentos que mostraron que la mecánica cuántica viola las desigualdades de Bell. Compartió el Nobel de Física de 2022 con Aspect y Zeilinger.",
"Anton Zeilinger":"Realizó experimentos pioneros de entrelazamiento y teleportación cuántica. Compartió el Nobel de Física de 2022.",
"Anne L'Huillier":"Descubrió la generación de armónicos de alto orden, base de los pulsos de luz de attosegundos. Compartió el Nobel de Física de 2023.",
"Donna Strickland":"Con Mourou desarrolló la amplificación de pulsos chirpeados, que permite láseres ultracortos de gran intensidad. Compartieron el Nobel de Física de 2018 con Ashkin.",
"Gérard Mourou":"Con Donna Strickland inventó la técnica de pulsos láser amplificados, usada, por ejemplo, en cirugía ocular. Compartió el Nobel de Física de 2018.",
"Arthur Ashkin":"Inventó las pinzas ópticas, que atrapan y mueven partículas diminutas con luz láser. Recibió el Nobel de Física de 2018 a los 96 años.",
"Giorgio Parisi":"Descubrió patrones ocultos en sistemas desordenados y complejos, desde vidrios de espín hasta fenómenos naturales. Compartió el Nobel de Física de 2021.",
"Gerard 't Hooft":"Con Veltman demostró que la teoría electrodébil se puede renormalizar. Compartieron el Nobel de Física de 1999.",
"Frank Wilczek":"Con Gross y Politzer descubrió la libertad asintótica de la interacción fuerte. Compartieron el Nobel de Física de 2004.",
"Theodor Hänsch":"Desarrolló el peine de frecuencias óptico, que permite medir la frecuencia de la luz con gran precisión. Compartió el Nobel de Física de 2005.",
"Roy Glauber":"Desarrolló la teoría cuántica de la coherencia óptica y de la detección de luz. Compartió el Nobel de Física de 2005.",
"Anthony Leggett":"Elaboró la teoría de la superfluidez del helio-3. Compartió el Nobel de Física de 2003.",
"Brian Josephson":"Predijo siendo estudiante el efecto que lleva su nombre, el paso de corriente entre superconductores separados por un aislante delgado. Recibió el Nobel de Física de 1973.",
"Hans Dehmelt":"Desarrolló técnicas para atrapar y estudiar un solo electrón o ion durante mucho tiempo. Compartió el Nobel de Física de 1989.",
"Norman Ramsey":"Desarrolló el método de campos oscilantes separados, base de los relojes atómicos de cesio. Compartió el Nobel de Física de 1989.",
"Willis Lamb":"Midió una pequeña diferencia de energía en el átomo de hidrógeno, el desplazamiento de Lamb, que impulsó la electrodinámica cuántica. Recibió el Nobel de Física de 1955.",
"J. Hans Jensen":"Propuso, independientemente de Goeppert Mayer, el modelo de capas del núcleo atómico. Compartieron el Nobel de Física de 1963.",
"Aage Bohr":"Hijo de Niels Bohr que, con Mottelson, desarrolló el modelo colectivo del núcleo atómico. Compartió el Nobel de Física de 1975.",
"Nicolaas Bloembergen":"Fue pionero de la óptica no lineal y de la espectroscopía láser. Compartió el Nobel de Física de 1981.",
"Arthur Schawlow":"Con Townes propuso en 1958 el principio del láser. Compartió el Nobel de Física de 1981 por su espectroscopía láser.",
"Nikolay Basov":"Con Prokhorov y Townes desarrolló el principio del máser y del láser. Compartieron el Nobel de Física de 1964.",
"Margaret Geller":"Con John Huchra mapeó la distribución de galaxias y descubrió la «Gran Muralla», una enorme estructura cósmica. Mostró que el universo tiene una estructura de filamentos y vacíos.",
"Sandra Faber":"Estudió la formación y evolución de las galaxias y la materia oscura. Es conocida por la relación Faber-Jackson entre la luminosidad y la dispersión de velocidades de las galaxias elípticas.",
"Wendy Freedman":"Dirigió el proyecto clave del telescopio Hubble que midió la constante de Hubble con cefeidas. Sus mediciones refinaron la edad y el ritmo de expansión del universo.",
"Jill Tarter":"Dirigió el Proyecto Phoenix y fue una de las fundadoras del Instituto SETI. Su trabajo inspiró al personaje principal de «Contact».",
"Lyman Spitzer":"Propuso ya en 1946 los telescopios en el espacio y fue figura clave del Hubble. También estudió el medio interestelar y la fusión nuclear.",
"Nancy Grace Roman":"Primera jefa de astronomía de la NASA y figura clave en la planificación del telescopio espacial Hubble. Se la llamó «la madre de Hubble».",
"Bengt Strömgren":"Estudió la ionización del gas alrededor de estrellas calientes, las esferas de Strömgren, y la fotometría estelar. Hizo aportes a la evolución estelar.",
"Robert Grubbs":"Desarrolló catalizadores que facilitan la metátesis de olefinas, una reacción para construir moléculas orgánicas. Compartió el Nobel de Química de 2005.",
"Ei-ichi Negishi":"Desarrolló reacciones de acoplamiento cruzado con paladio que forman enlaces carbono-carbono. Compartió el Nobel de Química de 2010.",
"K. Barry Sharpless":"Desarrolló reacciones de oxidación asimétrica y el concepto de química «click». Ganó dos veces el Nobel de Química, en 2001 y en 2022.",
"Jacques Dubochet":"Desarrolló la vitrificación de muestras para la crio-microscopía electrónica de biomoléculas. Compartió el Nobel de Química de 2017.",
"Paul Flory":"Estudió la estructura y las propiedades de los polímeros y las cadenas largas de moléculas. Recibió el Nobel de Química de 1974.",
"Hideki Shirakawa":"Descubrió con MacDiarmid y Heeger que el poliacetileno puede conducir electricidad. Compartieron el Nobel de Química de 2000.",
"Alan MacDiarmid":"Co-descubrió los polímeros conductores y desarrolló aplicaciones en electrónica orgánica. Compartió el Nobel de Química de 2000.",
"Geoffrey Wilkinson":"Determinó la estructura del ferroceno y desarrolló catalizadores de rodio. Compartió el Nobel de Química de 1973.",
"Vladimir Prelog":"Estudió la estereoquímica de moléculas orgánicas y enzimas y propuso reglas de nomenclatura. Compartió el Nobel de Química de 1975.",
"Melvin Calvin":"Descubrió con trazadores de carbono-14 las reacciones de la fotosíntesis que fijan CO₂, el ciclo de Calvin. Recibió el Nobel de Química de 1961.",
"Gerhard Herzberg":"Pionero de la espectroscopía de moléculas y radicales libres, con aplicaciones en astronomía. Recibió el Nobel de Química de 1971.",
"Francis Collins":"Dirigió el Proyecto Genoma Humano público, que completó la secuencia del ADN humano en 2003. Antes localizó genes de enfermedades como la fibrosis quística.",
"John Sulston":"Trazó el linaje celular completo del gusano C. elegans y lideró la secuenciación británica del genoma humano. Compartió el Nobel de Medicina de 2002.",
"Günter Blobel":"Descubrió que las proteínas llevan señales que las dirigen a su destino dentro de la célula. Recibió el Nobel de Medicina de 1999.",
"Randy Schekman":"Identificó genes que controlan el transporte de proteínas por vesículas en la célula, usando levaduras. Compartió el Nobel de Medicina de 2013.",
"Linda Buck":"Con Richard Axel descubrió la familia de genes de los receptores olfativos. Compartieron el Nobel de Medicina de 2004.",
"John O'Keefe":"Descubrió en el hipocampo las «células de lugar», que codifican la posición de un animal. Compartió el Nobel de Medicina de 2014.",
"May-Britt Moser":"Con Edvard Moser descubrió las «células de cuadrícula» de la corteza entorrinal, que forman un sistema de coordenadas cerebral. Compartieron el Nobel de Medicina de 2014.",
"Harold Varmus":"Con Bishop mostró que los oncogenes virales proceden de genes normales de las células. Compartieron el Nobel de Medicina de 1989.",
"Arvid Carlsson":"Mostró que la dopamina es un neurotransmisor y que su falta se relaciona con el párkinson. Compartió el Nobel de Medicina de 2000.",
"Julius Axelrod":"Descubrió cómo las neuronas recaptan y degradan la noradrenalina, y estudió la melatonina. Compartió el Nobel de Medicina de 1970.",
"Bernard Katz":"Mostró que los neurotransmisores se liberan en paquetes discretos, las vesículas sinápticas. Compartió el Nobel de Medicina de 1970.",
"John Eccles":"Estudió las sinapsis excitadoras e inhibidoras en las neuronas motoras. Compartió el Nobel de Medicina de 1963.",
"Paul Greengard":"Descubrió cómo la dopamina y otros transmisores modifican proteínas dentro de las neuronas. Compartió el Nobel de Medicina de 2000.",
"Peter Agre":"Descubrió las acuaporinas, canales que permiten que el agua entre y salga de las células. Compartió el Nobel de Química de 2003.",
"Tim Hunt":"Descubrió las ciclinas, proteínas que regulan el ciclo de división celular, al estudiar huevos de erizo de mar. Compartió el Nobel de Medicina de 2001.",
"Abraham Maslow":"Propuso la jerarquía de necesidades humanas y fue figura central de la psicología humanista. Su pirámide es muy conocida, aunque discutida.",
"Erik Erikson":"Propuso ocho etapas del desarrollo psicosocial a lo largo de la vida, cada una con una crisis. Acuñó el término «crisis de identidad».",
"Albert Bandura":"Mostró con el experimento del muñeco Bobo que los niños aprenden por observación. Propuso el concepto de autoeficacia.",
"Daniel Kahneman":"Con Amos Tversky estudió los sesgos y heurísticos en las decisiones humanas y la teoría prospectiva. Recibió el Nobel de Economía de 2002.",
"Harry Harlow":"Con crías de mono rhesus mostró que el contacto afectivo es esencial para el desarrollo, más que la comida. Sus experimentos cambiaron la psicología del apego y plantearon dilemas éticos.",
"Stanley Milgram":"Realizó en los años 1960 experimentos que mostraron hasta dónde personas comunes obedecen a la autoridad. También estudió el fenómeno del «mundo pequeño».",
"Carl Rogers":"Desarrolló la terapia centrada en la persona, basada en la empatía y la aceptación incondicional. Fue pionero de la investigación en psicoterapia.",
"Gregorio Weber":"Bioquímico argentino que fue pionero de la espectroscopía de fluorescencia aplicada a proteínas. Trabajó en la Universidad de Illinois.",
"Claudio Bunster":"Físico chileno que estudió los agujeros negros y la gravedad cuántica. Fundó y dirigió el Centro de Estudios Científicos de Valdivia.",
"Cecilia Hidalgo":"Bióloga chilena que estudió cómo el calcio regula la contracción muscular y la memoria. Es una figura destacada de la ciencia en Chile.",
"Gustave Eiffel":"Ingeniero que construyó puentes y viaductos de hierro, y la torre de París para la Exposición de 1889. También hizo investigaciones de aerodinámica y meteorología.",
"Thomas Telford":"Construyó puentes, canales y carreteras en el Reino Unido, como el puente colgante de Menai. Fue el primer presidente de la Institución de Ingenieros Civiles.",
"George Westinghouse":"Inventó el freno de aire para trenes y promovió el sistema de corriente alterna de Tesla. Fundó empresas de equipos eléctricos.",
"Charles Parsons":"Inventó la turbina de vapor de varias etapas y la usó en el barco Turbinia. Su turbina se usa en centrales eléctricas.",
"Nikolaus Otto":"Desarrolló el motor de combustión interna de cuatro tiempos, el ciclo Otto. Sentó la base de los motores de gasolina.",
"Karl Benz":"Construyó en 1885 el primer automóvil con motor de combustión interna y lo patentó en 1886. Fundó la empresa que dio origen a Mercedes-Benz.",
"Paul Cohen":"Demostró en 1963 que la hipótesis del continuo es independiente de los axiomas de la teoría de conjuntos, con el método del forcing. Recibió la Medalla Fields en 1966.",
"Stephen Smale":"Demostró la conjetura de Poincaré en dimensiones altas y creó el «caballo de Smale» en sistemas dinámicos. Recibió la Medalla Fields en 1966.",
"John Milnor":"Descubrió que existen estructuras diferenciables no equivalentes en la esfera de siete dimensiones, las esferas exóticas. Recibió la Medalla Fields en 1962 y el premio Abel en 2011.",
"Laurent Schwartz":"Desarrolló la teoría de distribuciones, que da sentido a objetos como la delta de Dirac. Recibió la Medalla Fields en 1950.",
"Henri Cartan":"Fue miembro fundador del grupo Bourbaki y contribuyó a la topología algebraica y a las funciones de varias variables complejas. Vivió 104 años.",
"Jacques Hadamard":"Demostró en 1896, a la vez que de la Vallée Poussin, el teorema de los números primos. También hizo aportes a las ecuaciones diferenciales y a la psicología de la invención matemática.",
"Camille Jordan":"Desarrolló la teoría de grupos, el teorema de la curva de Jordan y la forma canónica de Jordan de las matrices. Fue influyente en el álgebra del siglo XIX.",
"Sophus Lie":"Creó la teoría de los grupos continuos de transformaciones, hoy grupos de Lie, para estudiar ecuaciones diferenciales. Es fundamental en física teórica.",
"Ferdinand von Lindemann":"Demostró en 1882 que pi es trascendente, lo que resolvió la cuadratura del círculo con regla y compás. Fue maestro de Hilbert.",
"Charles Hermite":"Demostró en 1873 que el número e es trascendente. Hizo aportes a las funciones elípticas y a las formas cuadráticas.",
"Joseph Liouville":"Dio los primeros ejemplos de números trascendentes y fundó el «Journal de Liouville». Publicó los trabajos de Galois.",
"Pafnuti Chebyshov":"Hizo aportes a los números primos, la probabilidad y los polinomios que llevan su nombre. Fue fundador de la escuela matemática de San Petersburgo.",
"Aleksandr Lyapunov":"Desarrolló la teoría de estabilidad de sistemas dinámicos con funciones de Lyapunov y demostró una versión del teorema central del límite. Es clave en teoría del control.",
"Atle Selberg":"Dio una demostración elemental del teorema de los números primos y desarrolló la fórmula de la traza. Recibió la Medalla Fields en 1950.",
"Marston Morse":"Creó la teoría de Morse, que relaciona los puntos críticos de una función con la topología de un espacio. Es una herramienta central en geometría y topología.",
"George Birkhoff":"Demostró el teorema ergódico y hizo aportes a la teoría de sistemas dinámicos y a la relatividad. Fue de los matemáticos más influyentes de EE. UU. de su época.",
"Lloyd Shapley":"Desarrolló conceptos de teoría de juegos cooperativos, como el valor de Shapley, y algoritmos de asignación estable. Compartió el Nobel de Economía de 2012.",
"Leonid Kantorovich":"Desarrolló la programación lineal y la aplicó a la asignación óptima de recursos. Compartió el Nobel de Economía de 1975.",
"George Dantzig":"Inventó el método símplex para resolver problemas de programación lineal. Su algoritmo es una de las herramientas más usadas en optimización.",
"Ingrid Daubechies":"Construyó ondículas ortogonales de soporte compacto, ampliamente usadas en compresión de imágenes. Fue la primera mujer presidenta de la Unión Matemática Internacional.",
"Cathleen Morawetz":"Estudió ecuaciones diferenciales y la propagación de ondas, con aplicaciones al flujo transónico. Recibió la Medalla Nacional de Ciencias de EE. UU.",
"Julio Rey Pastor":"Matemático español que impulsó la matemática en Argentina y en España. Escribió textos influyentes y formó a una generación de matemáticos latinoamericanos.",
"Julius Robert von Mayer":"Formuló en 1842 el principio de conservación de la energía y calculó el equivalente mecánico del calor. Su trabajo fue reconocido tardíamente.",
"Michael Polanyi":"Contribuyó a la cinética química y a la teoría del estado de transición. Luego escribió sobre filosofía de la ciencia y el conocimiento tácito.",
"Victor Weisskopf":"Hizo aportes a la electrodinámica cuántica y la física nuclear, y fue director del CERN. Participó en el Proyecto Manhattan y fue activo en el control de armas nucleares.",
"Rudolf Peierls":"Con Frisch calculó la masa crítica de uranio-235 necesaria para una bomba, lo que impulsó el proyecto británico. También hizo aportes a la física del estado sólido.",
"Ernest Walton":"Con Cockcroft logró en 1932 dividir el átomo con partículas aceleradas artificialmente. Compartieron el Nobel de Física de 1951.",
"John Cockcroft":"Con Walton construyó un acelerador de partículas y transmutó núcleos de litio. Compartió el Nobel de Física de 1951 y dirigió la investigación atómica británica.",
"Kathleen Lonsdale":"Demostró con rayos X que el anillo de benceno es plano y estudió diamantes y moléculas orgánicas. Fue una de las dos primeras mujeres elegidas miembros de la Royal Society.",
"Thomas Graham":"Formuló la ley de difusión de los gases que lleva su nombre y descubrió la diálisis. Es considerado fundador de la química de coloides.",
"August Wilhelm von Hofmann":"Estudió las anilinas y su química, base de los colorantes sintéticos. Fue maestro de Perkin y fundó la Sociedad Química Alemana.",
"Emil Erlenmeyer":"Propuso la estructura del naftaleno y una regla sobre dobles enlaces que lleva su nombre. Inventó el matraz cónico de uso universal en los laboratorios.",
"Jacobus van 't Hoff":"Propuso que el átomo de carbono tiene geometría tetraédrica y fundó la química física moderna. Recibió el primer Nobel de Química, en 1901.",
"Robert Mulliken":"Desarrolló la teoría de orbitales moleculares para describir los enlaces químicos. Recibió el Nobel de Química de 1966.",
"John Pople":"Desarrolló métodos computacionales para calcular propiedades de moléculas. Compartió el Nobel de Química de 1998 con Kohn.",
"Walter Kohn":"Desarrolló la teoría del funcional de la densidad, usada para calcular la estructura electrónica de átomos, moléculas y sólidos. Compartió el Nobel de Química de 1998.",
"Edward Calvin Kendall":"Aisló la hormona tiroidea tiroxina y hormonas de la corteza suprarrenal, como la cortisona. Compartió el Nobel de Medicina de 1950.",
"Osamu Shimomura":"Aisló la proteína verde fluorescente de la medusa Aequorea victoria, hoy herramienta clave en biología. Compartió el Nobel de Química de 2008.",
"Roger Tsien":"Amplió la gama de colores de las proteínas fluorescentes, que permiten ver procesos dentro de células vivas. Compartió el Nobel de Química de 2008.",
"Ryoji Noyori":"Desarrolló catalizadores quirales para hidrogenaciones asimétricas, que producen una sola forma de una molécula. Compartió el Nobel de Química de 2001.",
"Yuan T. Lee":"Desarrolló el método de haces moleculares cruzados para estudiar cómo ocurren las reacciones químicas. Compartió el Nobel de Química de 1986.",
"Shuji Nakamura":"Desarrolló el LED azul de alta luminosidad y el láser azul, base de la iluminación LED y de los discos Blu-ray. Compartió el Nobel de Física de 2014.",
"Eduard Strasburger":"Describió la división celular y la fecundación en plantas y acuñó términos como citoplasma y nucleoplasma. Escribió un influyente tratado de botánica.",
"Walther Flemming":"Describió la mitosis y los cromosomas con tinciones y acuñó el término mitosis. Su trabajo fue base de la citogenética.",
"August Weismann":"Propuso la separación entre células germinales y somáticas y rechazó la herencia de caracteres adquiridos con experimentos en ratones. Influyó en el neodarwinismo.",
"Julian Huxley":"Escribió «La evolución: la síntesis moderna» y fue el primer director general de la UNESCO. Cofundó el World Wildlife Fund.",
"Ynes Mexía":"Botánica mexicano-estadounidense que recolectó más de 140.000 plantas en México y Sudamérica, incluidos los Andes y el Amazonas. Descubrió muchas especies nuevas.",
"Mayana Zatz":"Genetista brasileña que estudia enfermedades hereditarias, distrofias musculares y células madre. Dirige el Centro de Estudios del Genoma Humano en São Paulo.",
"Sergei Winogradsky":"Descubrió la quimiosíntesis, por la que ciertas bacterias obtienen energía de compuestos inorgánicos. Fundó la microbiología ambiental.",
"Cicely Williams":"Pediatra que describió el kwashiorkor, una forma de desnutrición infantil, en Ghana. Fue pionera de la salud materno infantil y trabajó en la OMS.",
"Paul Farmer":"Cofundó Partners In Health y llevó atención médica de calidad a comunidades pobres de Haití, Perú y Ruanda. Promovió tratamientos contra la tuberculosis multirresistente y el VIH.",
"John Vane":"Mostró que la aspirina actúa al inhibir la síntesis de prostaglandinas. Compartió el Nobel de Medicina de 1982.",
"James Black":"Desarrolló el propranolol, primer betabloqueante, y la cimetidina contra las úlceras. Compartió el Nobel de Medicina de 1988.",
"George Hitchings":"Con Gertrude Elion desarrolló fármacos como los usados en leucemia y para evitar el rechazo de trasplantes. Compartió el Nobel de Medicina de 1988.",
"Akira Endo":"Descubrió la primera estatina en un hongo, un tipo de fármaco que reduce el colesterol. Su hallazgo abrió el camino a medicamentos de gran uso.",
"Sidney Farber":"Mostró en 1947 que la aminopterina podía inducir remisiones en niños con leucemia. Es considerado padre de la quimioterapia moderna.",
"Charles Huggins":"Demostró que algunos cánceres dependen de hormonas y que el de próstata responde a la supresión de andrógenos. Compartió el Nobel de Medicina de 1966.",
"Ramón Carrillo":"Neurocirujano que fue ministro de Salud de Argentina y expandió hospitales y la atención sanitaria. Fue pionero de la medicina social en el país.",
"Tomás Romay":"Médico cubano que introdujo la vacuna contra la viruela en Cuba y fue impulsor de la salud pública. También escribió sobre la fiebre amarilla.",
"Mariano Felipe Paz Soldán":"Geógrafo e historiador peruano que publicó el «Atlas geográfico del Perú» y el «Diccionario geográfico estadístico». Es referencia de la geografía del país en el siglo XIX.",
"Manuel Gamio":"Pionero de la arqueología científica en México, usó excavaciones estratigráficas en Teotihuacán. También promovió el estudio de las poblaciones indígenas.",
"Leopoldo Río de la Loza":"Químico mexicano que escribió textos pioneros de química, estudió los minerales y aguas del país y fue fundador de la farmacia moderna en México.",
"Julio Garavito":"Ingeniero y astrónomo colombiano que dirigió el Observatorio Astronómico Nacional y estudió la mecánica celeste. Un cráter lunar lleva su nombre.",
"Narcís Monturiol":"Construyó el Ictíneo, un submarino de propulsión mecánica que se probó con éxito en 1859. Fue también un pensador social.",
"Pedro Nunes":"Matemático portugués que describió la curva loxodrómica y mejoró los métodos de navegación. Inventó el nonio, precursor del vernier.",
"James Dwight Dana":"Geólogo y naturalista que escribió un influyente sistema de mineralogía y estudió volcanes y corales en el Pacífico. Propuso ideas sobre la formación de los continentes.",
"Roderick Murchison":"Geólogo que describió el período Silúrico y exploró los Urales y otras regiones. Fue director del Servicio Geológico británico.",
"Adam Sedgwick":"Geólogo que nombró el período Cámbrico y fue maestro de Darwin en geología. Tuvo una célebre disputa con Murchison.",
"William Buckland":"Describió en 1824 al Megalosaurus, el primer dinosaurio nombrado científicamente. Fue geólogo en Oxford y estudió cuevas con fósiles.",
"Antonio Meucci":"Inventor italiano que construyó aparatos de comunicación por voz y desarrolló un «telettrofono». En 2002 el Congreso de EE. UU. reconoció su papel en la invención del teléfono.",
"Jean-Baptiste Biot":"Con Savart formuló la ley que describe el campo magnético creado por una corriente eléctrica. También estudió la polarización de la luz y participó en ascensos científicos en globo.",
"Félix Savart":"Con Biot formuló la ley de Biot-Savart sobre el magnetismo de las corrientes. También investigó la acústica y la vibración de los cuerpos sólidos.",
"François Arago":"Estudió la polarización de la luz y el electromagnetismo, y apoyó la teoría ondulatoria de Fresnel. Dirigió el Observatorio de París y fue político.",
"William Huggins":"Pionero de la espectroscopía astronómica que mostró que las estrellas contienen elementos presentes en la Tierra. Demostró que algunas nebulosas son de gas.",
"David Gill":"Midió con precisión la paralaje solar y la de estrellas cercanas desde Sudáfrica. Impulsó la fotografía para elaborar mapas del cielo.",
"Edward Barnard":"Descubrió la quinta luna de Júpiter, Amaltea, y la estrella de Barnard, de gran movimiento propio. Fotografió la Vía Láctea y nebulosas oscuras.",
"Max Wolf":"Introdujo la fotografía con largas exposiciones para descubrir asteroides y halló más de 200. También catalogó nebulosas oscuras.",
"Simon Newcomb":"Determinó con gran precisión constantes astronómicas y calculó tablas de los movimientos de los planetas. Fue una autoridad en mecánica celeste.",
"George Darwin":"Hijo de Charles Darwin que estudió las mareas y propuso que la Luna se separó de la Tierra. Su hipótesis de fisión fue luego reemplazada.",
"James Jeans":"Hizo aportes a la teoría cinética y a la formación de estrellas, con la masa de Jeans. Fue un conocido divulgador de la física y la astronomía.",
"Frank Dyson":"Como astrónomo real organizó las expediciones de 1919 que midieron la desviación de la luz estelar durante un eclipse. Sus resultados respaldaron la relatividad general.",
"Bernard Lyot":"Inventó el coronógrafo, que permite observar la corona solar sin un eclipse. También desarrolló filtros y estudió la polarización de la luz de los planetas.",
"Joseph Larmor":"Describió el movimiento de precesión de partículas cargadas en un campo magnético y fórmulas de radiación. Anticipó transformaciones relacionadas con la relatividad.",
"George FitzGerald":"Propuso la contracción de longitud para explicar el resultado negativo del experimento de Michelson-Morley. La idea fue desarrollada por Lorentz.",
"Jacques Curie":"Con su hermano Pierre descubrió la piezoelectricidad en cristales y desarrolló el electrómetro de cuarzo. Fue profesor en Montpellier.",
"Bruno Rossi":"Estudió los rayos cósmicos y fue pionero de la astronomía de rayos X en el MIT. Su trabajo abrió el camino al descubrimiento de la primera fuente cósmica de rayos X.",
"Giuseppe Occhialini":"Con Powell y Lattes usó emulsiones nucleares para descubrir el pion. Colaboró con Blackett en el uso de contadores en coincidencia.",
"Edwin McMillan":"Descubrió el neptunio, el primer elemento transuránico, y propuso el principio del sincrotrón. Compartió el Nobel de Química de 1951 con Seaborg.",
"Kai Siegbahn":"Desarrolló la espectroscopía de electrones para estudiar la composición química de superficies. Compartió el Nobel de Física de 1981.",
"Manne Siegbahn":"Desarrolló la espectroscopía de rayos X de alta precisión. Recibió el Nobel de Física de 1924 y fue padre de Kai Siegbahn.",
"Charles Barkla":"Descubrió los rayos X característicos de cada elemento y su polarización. Recibió el Nobel de Física de 1917.",
"Owen Richardson":"Estudió la emisión de electrones por metales calientes, base de las válvulas de vacío. Recibió el Nobel de Física de 1928.",
"Robert Hofstadter":"Midió con haces de electrones el tamaño y la estructura de protones y neutrones. Compartió el Nobel de Física de 1961.",
"Jack Steinberger":"Con Lederman y Schwartz descubrió el neutrino muónico. Compartió el Nobel de Física de 1988.",
"Hantaro Nagaoka":"Propuso en 1904 un modelo del átomo con electrones en anillo alrededor de un núcleo, como Saturno. Su modelo anticipó ideas de Rutherford.",
"Yoshio Nishina":"Trabajó en Copenhague con Bohr, derivó la fórmula de Klein-Nishina y fundó la física moderna en Japón. Dirigió un instituto de investigación nuclear.",
"Hermann Kolbe":"Sintetizó ácido acético a partir de sus elementos y desarrolló la reacción de Kolbe, base de la síntesis de la aspirina. Contribuyó a refutar el vitalismo.",
"Adolphe Wurtz":"Descubrió los glicoles y la reacción que une dos halogenuros de alquilo con sodio. Fue maestro de muchos químicos franceses.",
"Archibald Couper":"Propuso ideas sobre la valencia del carbono y los enlaces entre átomos, casi a la vez que Kekulé. Padeció una enfermedad y su trabajo fue reconocido tarde.",
"Ernest Solvay":"Desarrolló un método industrial para producir carbonato de sodio y fundó la empresa que lleva su nombre. Organizó las conferencias Solvay de física.",
"Henry Eyring":"Desarrolló la teoría del estado de transición para explicar las velocidades de las reacciones químicas. Fue profesor en Princeton y Utah.",
"Elias Corey":"Desarrolló la retrosíntesis, método para planear la síntesis de moléculas orgánicas complejas. Recibió el Nobel de Química de 1990.",
"William Lipscomb":"Estudió la estructura y los enlaces de los boranos mediante cristalografía. Recibió el Nobel de Química de 1976.",
"Carl Djerassi":"Dirigió el equipo que sintetizó la noretisterona en 1951, base de las píldoras anticonceptivas orales. También escribió novelas y obras de teatro sobre ciencia.",
"Prafulla Chandra Ray":"Fundó la industria química farmacéutica en la India y descubrió el nitrito mercuroso. Escribió una historia de la química hindú.",
"Shanti Swaroop Bhatnagar":"Fue el primer director del Consejo de Investigación Científica e Industrial de la India. Estudió la magnetoquímica y fundó laboratorios nacionales.",
"Gregory Pincus":"Dirigió el desarrollo y los ensayos de la píldora anticonceptiva, con Rock y Chang. También investigó la fecundación in vitro en conejos.",
"George Gaylord Simpson":"Fue un paleontólogo clave de la síntesis evolutiva, que estudió la evolución de los mamíferos. Escribió «Tempo and Mode in Evolution».",
"Willi Hennig":"Fundó la cladística, un método de clasificar los seres vivos según su ancestro común. Cambió la sistemática biológica.",
"Erasmus Darwin":"Médico y naturalista, abuelo de Charles Darwin, que especuló sobre la evolución en «Zoonomía». Fue miembro de la Lunar Society.",
"Hilde Mangold":"Descubrió con Hans Spemann el organizador embrionario en anfibios, una región que induce el desarrollo del embrión. Murió joven, a los 26 años.",
"Ross Harrison":"Fue pionero del cultivo de tejidos al hacer crecer fibras nerviosas fuera del cuerpo en 1907. Su técnica fue base de la biología celular moderna.",
"Rudolf Schoenheimer":"Usó isótopos para mostrar que los componentes del cuerpo se renuevan continuamente, el «estado dinámico». Murió joven, a los 43 años.",
"Charles Richet":"Descubrió la anafilaxia, una reacción alérgica grave, junto con Portier. Recibió el Nobel de Medicina de 1913.",
"Clemens von Pirquet":"Acuñó el término «alergia» y desarrolló la prueba cutánea de la tuberculina. Fundó una escuela de pediatría en Viena.",
"Salim Ali":"Ornitólogo indio que estudió las aves de la India y publicó guías de campo, y fue pionero de la conservación. Se le llama el «hombre pájaro de la India».",
"Yellapragada Subbarow":"Descubrió el papel del ATP como fuente de energía y desarrolló el metotrexato, usado en quimioterapia. Su trabajo no tuvo mucho reconocimiento en vida.",
"Kiyoshi Shiga":"Descubrió en 1897 el bacilo que causa la disentería, hoy Shigella. Trabajó con Ehrlich y fue profesor en Seúl.",
"Fridtjof Nansen":"Exploró el Ártico y la Antártida, desarrolló instrumentos oceanográficos y aportó a la neurociencia temprana. Recibió el Nobel de la Paz de 1922 por su labor humanitaria.",
"Ferdinand von Richthofen":"Exploró China y acuñó el término «Ruta de la Seda». Fue un geógrafo y geólogo influyente.",
"Carl Ritter":"Cofundó la geografía moderna como ciencia con estudios comparados de la Tierra y los pueblos. Fue contemporáneo de Humboldt.",
"Élisée Reclus":"Geógrafo francés que escribió la «Nueva geografía universal» en 19 volúmenes. Fue también pensador anarquista.",
"Maurice Ewing":"Pionero de la geofísica marina que estudió el fondo oceánico con sismología y descubrió el canal SOFAR del sonido. Fundó el observatorio Lamont.",
"Bruce Heezen":"Con Marie Tharp cartografió el fondo del océano y descubrió el rift mesoatlántico. También estudió las corrientes de turbidez.",
"Fred Vine":"Con Drummond Matthews propuso en 1963 que las bandas magnéticas del fondo oceánico registran inversiones del campo terrestre. Su idea apoyó la expansión del fondo marino.",
"Drummond Matthews":"Con Fred Vine interpretó las anomalías magnéticas del fondo oceánico como evidencia de su expansión. Fue geofísico en Cambridge.",
"Hugo Benioff":"Describió las zonas de terremotos profundos asociadas a la subducción, hoy zonas de Wadati-Benioff. Inventó sismómetros de precisión.",
"Kiyoo Wadati":"Descubrió que los terremotos profundos se alinean en planos inclinados bajo Japón. Fue director de la Agencia Meteorológica de Japón.",
"Harry Fielding Reid":"Formuló la teoría del rebote elástico para explicar los terremotos, tras estudiar el de San Francisco de 1906. También estudió glaciares.",
"Alexandre Brongniart":"Con Cuvier estudió la estratigrafía de la cuenca de París y usó fósiles para datar capas de roca. Dirigió la manufactura de porcelana de Sèvres.",
"Prasanta Mahalanobis":"Introdujo la distancia que lleva su nombre y fundó el Instituto Estadístico de la India. Impulsó el uso de encuestas por muestreo.",
"Hua Luogeng":"Matemático chino autodidacta que hizo aportes a la teoría de números y al análisis. Impulsó la matemática aplicada en China.",
"Chen Jingrun":"Demostró en 1966 que todo número par suficientemente grande es suma de un primo y un número con a lo sumo dos factores primos. Es el mejor resultado hacia la conjetura de Goldbach.",
"Shing-Tung Yau":"Demostró la conjetura de Calabi, base de las variedades de Calabi-Yau usadas en teoría de cuerdas. Recibió la Medalla Fields en 1982.",
"Carlos Spegazzini":"Botánico y micólogo ítalo-argentino que describió miles de especies de hongos y plantas de Sudamérica, incluida la Patagonia. Fue profesor en La Plata.",
"Hermann Burmeister":"Naturalista alemán que dirigió el Museo Público de Buenos Aires y estudió la fauna y los fósiles de Argentina. Fundó la Academia Nacional de Ciencias en Córdoba.",
"Emilio Goeldi":"Zoólogo suizo que dirigió el Museo Paraense, hoy Museo Goeldi, e investigó la fauna del Amazonas. Fue pionero de la ciencia amazónica.",
"Miguel Lillo":"Naturalista argentino que estudió la flora de Tucumán y legó su fortuna y colecciones para crear el Instituto Miguel Lillo. Fue pionero de la ciencia en el noroeste.",
"Eduardo Holmberg":"Naturalista argentino que estudió la flora y fauna del país y fue defensor temprano de Darwin. También escribió ficción científica.",
"Ellen Swallow Richards":"Fue la primera mujer admitida en el MIT y fundó la química sanitaria al analizar la calidad del agua en Massachusetts. Impulsó la ecología doméstica y la nutrición.",
"Luis E. Valcárcel":"Historiador y arqueólogo cusqueño que impulsó el indigenismo y dirigió excavaciones en Sacsayhuamán. Fue director de museos nacionales y ministro de Educación.",
"Walter Alva":"Arqueólogo peruano que descubrió en 1987 la tumba intacta del Señor de Sipán, de la cultura moche, en Lambayeque. Dirige el Museo Tumbas Reales de Sipán.",
"Augusto Weberbauer":"Botánico alemán radicado en el Perú que recorrió los Andes durante décadas y publicó «El mundo vegetal de los Andes peruanos». Describió numerosas especies.",
"Ramón Ferreyra":"Botánico peruano que estudió la flora de los Andes y la costa y publicó numerosos trabajos sobre las plantas del país. Fue una referencia de la botánica en el Perú.",
"Paul Ehrenfest":"Contribuyó a la mecánica estadística y a la teoría cuántica con el teorema de Ehrenfest y fue un gran maestro en Leiden. Fue amigo cercano de Einstein y Bohr.",
"Friedrich Paschen":"Descubrió la serie espectral del hidrógeno que lleva su nombre y estudió el efecto Paschen-Back. Dirigió el instituto físico-técnico de Alemania.",
"Ilya Frank":"Con Tamm explicó teóricamente la radiación de Cherenkov. Compartió el Nobel de Física de 1958.",
"Johann Bayer":"Publicó la «Uranometria» en 1603, un atlas estelar que asignó letras griegas a las estrellas de cada constelación, las designaciones de Bayer. Incluyó estrellas del hemisferio sur.",
"John Flamsteed":"Fue el primer astrónomo real de Inglaterra y fundó el Observatorio de Greenwich. Elaboró un catálogo de unas 3.000 estrellas.",
"James Bradley":"Descubrió la aberración de la luz de las estrellas, la primera prueba directa del movimiento de la Tierra. Fue astrónomo real.",
"Lord Rosse":"Construyó el telescopio Leviatán de Parsonstown, el mayor de su época, y observó la estructura espiral de galaxias como M51.",
"Heber Curtis":"Defendió en el Gran Debate de 1920 que las nebulosas espirales son galaxias lejanas. Su postura se confirmó con los trabajos de Hubble.",
"Heinrich Schwabe":"Farmacéutico y astrónomo que observó el Sol durante 17 años y descubrió el ciclo de manchas solares de unos once años.",
"Richard Carrington":"Observó en 1859 una gran llamarada solar, que luego se relacionó con una tormenta geomagnética conocida como evento Carrington.",
"Jacobus Kapteyn":"Estudió el movimiento de las estrellas y propuso un modelo de la Vía Láctea y la existencia de dos corrientes estelares. Fue pionero de la astronomía estadística.",
"Daniel Rutherford":"Aisló el nitrógeno en 1772 como «aire mefítico» al estudiar el gas restante de la combustión. Fue médico y botánico en Edimburgo.",
"Johann Wolfgang Döbereiner":"Observó que ciertos elementos con propiedades similares forman tríadas, un paso hacia la tabla periódica. Inventó una lámpara de hidrógeno con platino.",
"John Newlands":"Propuso en 1865 la ley de las octavas, que ordenaba los elementos y anticipó la periodicidad. Su trabajo fue ridiculizado y luego reconocido.",
"Paul-Émile Lecoq de Boisbaudran":"Descubrió el galio en 1875 con espectroscopía, un elemento predicho por Mendeléyev. También descubrió el samario y el disprosio.",
"Clemens Winkler":"Descubrió el germanio en 1886, otro elemento predicho por Mendeléyev. Fue químico analítico en Freiberg.",
"William Withering":"Estudió el uso de la dedalera, la digital, para tratar la insuficiencia cardíaca y publicó su método en 1785. Es considerado pionero de la farmacología.",
"Leo Kanner":"Psiquiatra infantil que describió en 1943 el autismo infantil precoz en un artículo con once niños. Fue figura clave de la psiquiatría infantil.",
"Jacob Henle":"Describió el asa de Henle del riñón y fue de los primeros en proponer la teoría microbiana del contagio. Fue maestro de Koch.",
"Radia Perlman":"Inventó el protocolo de árbol de expansión, que evita bucles en redes Ethernet. Se la conoce como «la madre de internet».",
"Ivan Sutherland":"Creó Sketchpad en 1963, precursor de los gráficos por computadora y del diseño asistido. También desarrolló un visor de realidad virtual. Recibió el premio Turing en 1988.",
"Ron Rivest":"Con Shamir y Adleman creó el algoritmo RSA de criptografía de clave pública. Recibieron el premio Turing en 2002.",
"Adi Shamir":"Co-inventó el algoritmo RSA y contribuyó al criptoanálisis y al esquema de compartición de secretos. Recibió el premio Turing en 2002.",
"Leonard Adleman":"Co-inventó el algoritmo RSA y realizó en 1994 la primera computación con ADN. Recibió el premio Turing en 2002.",
"Barbara Liskov":"Formuló el principio de sustitución de Liskov y desarrolló el lenguaje CLU. Recibió el premio Turing en 2008.",
"Lotfi Zadeh":"Creó la lógica difusa en 1965 para razonar con conceptos imprecisos. Se aplica en control, electrodomésticos e inteligencia artificial.",
"Hipólito Ruiz López":"Botánico español que dirigió con Pavón la Real Expedición Botánica al Virreinato del Perú y Chile entre 1777 y 1788. Describieron miles de plantas.",
"José Antonio Pavón":"Botánico que acompañó a Ruiz en la expedición al Perú y Chile y reunió herbarios y dibujos. Describieron especies como plantas medicinales andinas.",
"Joseph Dombey":"Médico y botánico francés que participó en la expedición al Perú y Chile y reunió plantas. Su colección sufrió disputas y retrasos; murió preso en la isla de Montserrat.",
"Thaddäus Haenke":"Naturalista de Bohemia que recorrió Perú y Bolivia durante décadas, estudió flora, geología y minería, y se estableció en Cochabamba.",
"José Mariano Mociño":"Naturalista novohispano que participó en la Real Expedición Botánica a Nueva España y estudió plantas y animales de México y Guatemala.",
"Jean-Baptiste Boussingault":"Fundó la química agrícola al estudiar el ciclo del nitrógeno en las plantas. Vivió varios años en Colombia, Ecuador y Venezuela, donde estudió volcanes y minas.",
"John James Audubon":"Naturalista y pintor que ilustró cientos de especies de aves norteamericanas en «Las aves de América». Introdujo el anillado de aves.",
"Henri Pittier":"Botánico y geógrafo suizo que exploró Costa Rica y Venezuela, impulsó la creación de parques nacionales y estudió la flora. Un parque venezolano lleva su nombre.",
"Al-Zarqali":"Astrónomo de Toledo que construyó el astrolabio llamado azafea y elaboró las Tablas toledanas, muy usadas en Europa. Fue conocido como Azarquiel.",
"Robert Grosseteste":"Obispo de Lincoln que estudió la luz, el arcoíris y las lentes y defendió combinar observación y matemáticas. Influyó en Roger Bacon.",
"Dietrich de Freiberg":"Explicó el arcoíris con experimentos con esferas de vidrio llenas de agua, mostrando que la luz se refracta y se refleja dentro de las gotas.",
"Thomas Bradwardine":"Formuló una ley matemática para relacionar fuerza, resistencia y velocidad y estudió el teorema de la velocidad media. Fue arzobispo de Canterbury.",
"Giambattista Benedetti":"Propuso, antes de Galileo, que cuerpos de distinto peso caen a igual velocidad en el vacío y criticó la física aristotélica. Escribió sobre mecánica y gnomónica.",
"Guy de Chauliac":"Escribió la «Chirurgia magna», texto de referencia de la cirugía hasta el Renacimiento. Describió la peste negra en Aviñón.",
"Mondino de Luzzi":"Realizó disecciones públicas de cadáveres humanos en Bolonia y escribió un manual de anatomía usado durante siglos.",
"Georg Peurbach":"Escribió «Theoricae novae planetarum», texto de astronomía que fue estándar en universidades. Fue maestro de Regiomontano.",
"Gemma Frisius":"Propuso usar la triangulación para cartografiar territorios y sugirió un método para hallar la longitud con relojes. Fue maestro de Mercator.",
"Valerius Cordus":"Botánico y farmacéutico que escribió una farmacopea, el «Dispensatorium», y describió plantas. Murió joven, a los 29 años, durante un viaje científico a Italia.",
"Leonhart Fuchs":"Publicó «De historia stirpium», un herbario con ilustraciones precisas. La planta fucsia lleva su nombre.",
"Pierre Belon":"Comparó los esqueletos de un ave y un humano y estudió peces y aves. Es considerado pionero de la anatomía comparada.",
"Guillaume Rondelet":"Médico y naturalista que escribió un tratado de peces del Mediterráneo y enseñó en Montpellier. Fue maestro de Clusius.",
"Charles de l'Écluse":"Conocido como Clusius, describió numerosas plantas europeas y americanas e introdujo los tulipanes en los Países Bajos. Dirigió el jardín botánico de Leiden.",
"Giambattista della Porta":"Escribió «Magia natural» y estudió la óptica, las lentes y la cámara oscura. Fundó una de las primeras academias científicas.",
"Simon Marius":"Observó las lunas de Júpiter casi a la vez que Galileo y propuso los nombres Ío, Europa, Ganímedes y Calisto. También describió la galaxia de Andrómeda.",
"Christoph Scheiner":"Jesuita que observó las manchas solares con un telescopio y estudió su movimiento, lo que lo enfrentó con Galileo. Diseñó el pantógrafo.",
"Bonaventura Cavalieri":"Desarrolló el método de los indivisibles para calcular áreas y volúmenes, un precursor del cálculo integral. Fue discípulo de Galileo.",
"Gilles de Roberval":"Estudió tangentes, la cicloide y los indivisibles, y diseñó la balanza de Roberval. Fue profesor en el Collège de France.",
"Girard Desargues":"Fundó la geometría proyectiva y enunció el teorema de Desargues sobre triángulos en perspectiva. Su obra fue poco apreciada en vida.",
"Pierre Gassendi":"Observó en 1631 el tránsito de Mercurio predicho por Kepler. Defendió el atomismo y fue crítico de Descartes.",
"Jeremiah Horrocks":"Predijo y observó en 1639 el tránsito de Venus por el Sol, y estimó el tamaño de la Tierra y la distancia solar. Murió joven, a los 22 años.",
"Richard Lower":"Realizó en 1665 la primera transfusión de sangre entre animales y estudió el corazón y los pulmones. Mostró que la sangre se vuelve roja al contacto con el aire.",
"Frederik Ruysch":"Anatomista que desarrolló técnicas de inyección y conservación de especímenes y describió las válvulas de los vasos linfáticos. Reunió una famosa colección.",
"Regnier de Graaf":"Describió los folículos del ovario que llevan su nombre y estudió las glándulas. Murió joven, a los 32 años.",
"Conde de Rumford":"Benjamin Thompson observó que la fricción produce calor de forma continua al perforar cañones, y cuestionó la teoría del calórico. Inventó la chimenea Rumford y mejoró la nutrición.",
"Charles Wheatstone":"Desarrolló un telégrafo eléctrico con Cooke y popularizó el puente de medida que lleva su nombre. También inventó el estereoscopio.",
"Gustav Magnus":"Describió la fuerza lateral que experimenta un cuerpo giratorio en un fluido, el efecto Magnus. Explica las trayectorias curvas de los balones.",
"Johann Balmer":"Halló una fórmula matemática para las líneas visibles del espectro del hidrógeno. Su fórmula fue base para Rydberg y Bohr.",
"Julius Plücker":"Hizo aportes a la geometría analítica con las coordenadas de Plücker y estudió la descarga eléctrica en gases, con lo que observó los rayos catódicos.",
"Galileo Ferraris":"Descubrió el campo magnético rotante, base del motor de inducción de corriente alterna, casi a la vez que Tesla.",
"Antonio Pacinotti":"Construyó la dinamo de anillo en 1860, un generador de corriente continua que influyó en Gramme. Fue profesor en Pisa.",
"Michael Pupin":"Inventó las bobinas de carga que mejoraron las líneas telefónicas de larga distancia. Fue profesor en Columbia.",
"Johan Gadolin":"Descubrió en 1794 la itria, el primer óxido de una tierra rara. El elemento gadolinio lleva su nombre.",
"Carl Mosander":"Descubrió los elementos lantano, erbio y terbio al separar tierras raras. Fue discípulo de Berzelius.",
"Friedrich Stromeyer":"Descubrió el cadmio en 1817 al analizar un mineral de zinc. También estudió el selenio.",
"Antoine Balard":"Descubrió el bromo en 1826 al analizar salmuera de marismas. Fue profesor en el Collège de France.",
"Pierre-Joseph Pelletier":"Con Caventou aisló la quinina de la quina andina, la estricnina y la clorofila. Su trabajo inició la química de los alcaloides.",
"Joseph Caventou":"Con Pelletier aisló la quinina a partir de la corteza de la quina, árbol de los Andes, lo que permitió tratar la malaria con dosis precisas.",
"Karl von Rokitansky":"Realizó decenas de miles de autopsias y sistematizó la anatomía patológica en Viena, que enseñó a médicos de toda Europa.",
"Jan Purkyně":"Describió las células de Purkinje del cerebelo y clasificó tipos de huellas dactilares. También acuñó el término «protoplasma».",
"Albrecht von Haller":"Distinguió la irritabilidad de los músculos de la sensibilidad de los nervios y escribió un gran tratado de fisiología. Fue también poeta y botánico.",
"François Magendie":"Mostró que las raíces nerviosas anteriores y posteriores tienen funciones distintas, motora y sensitiva. Fue pionero de la farmacología experimental.",
"Pierre Flourens":"Estudió con experimentos en animales las funciones del cerebelo y del tronco encefálico y mostró que el cerebelo coordina el movimiento. Fue secretario de la Academia de Ciencias.",
"Charles Bell":"Describió la parálisis facial que lleva su nombre y distinguió los nervios motores de los sensitivos. También dibujó láminas anatómicas.",
"Astley Cooper":"Cirujano que realizó la primera ligadura de la aorta abdominal y escribió sobre hernias y fracturas. Fue cirujano del rey.",
"Percivall Pott":"Asoció en 1775 el cáncer de escroto con el hollín en deshollinadores, la primera descripción de un cáncer ocupacional. También describió la tuberculosis vertebral y la fractura de Pott.",
"William Hunter":"Anatomista y obstetra que publicó un atlas de la anatomía del útero grávido y fundó una escuela de anatomía en Londres. Fue hermano de John Hunter.",
"Gilbert White":"Clérigo y naturalista que registró durante décadas la vida de su aldea en «Historia natural de Selborne». Es considerado precursor de la ecología y la fenología.",
"William Bartram":"Exploró el sureste de EE. UU. y publicó «Viajes», con descripciones de plantas, animales y pueblos nativos. Influyó en escritores románticos.",
"Georg Forster":"Naturalista que acompañó a su padre en el segundo viaje de Cook y escribió «Viaje alrededor del mundo». Fue también escritor y revolucionario.",
"Peter Pallas":"Exploró Siberia y el sur de Rusia y describió numerosas especies de animales y plantas. Propuso ideas sobre el origen de las montañas.",
"Carl Peter Thunberg":"Discípulo de Linneo que recolectó plantas en Sudáfrica y Japón y publicó «Flora Japonica». Es llamado el «Linneo japonés».",
"Constantine Rafinesque":"Naturalista nacido en Constantinopla que describió miles de especies en América y Europa y propuso ideas tempranas sobre la evolución. Su obra fue controvertida.",
"Aaron Ciechanover":"Con Hershko y Rose descubrió cómo las células marcan proteínas con ubiquitina para destruirlas. Compartieron el Nobel de Química de 2004.",
"Avram Hershko":"Descubrió el sistema de degradación de proteínas dependiente de ubiquitina. Compartió el Nobel de Química de 2004.",
"Richard Henderson":"Desarrolló la crio-microscopía electrónica para ver biomoléculas en tres dimensiones. Compartió el Nobel de Química de 2017.",
"Joachim Frank":"Desarrolló algoritmos para reconstruir imágenes tridimensionales de moléculas a partir de microscopía electrónica. Compartió el Nobel de Química de 2017.",
"Martin Chalfie":"Usó la proteína verde fluorescente como marcador en organismos vivos. Compartió el Nobel de Química de 2008.",
"Robert Lefkowitz":"Aclaró cómo funcionan los receptores acoplados a proteína G, blanco de muchos fármacos. Compartió el Nobel de Química de 2012.",
"Ralph Steinman":"Descubrió las células dendríticas, clave para activar el sistema inmune adaptativo. Recibió el Nobel de Medicina de 2011 tras su muerte.",
"Allan Wilson":"Propuso el reloj molecular para datar la divergencia de especies y apoyó la hipótesis de la «Eva mitocondrial». Revolucionó el estudio de la evolución humana.",
"Luigi Luca Cavalli-Sforza":"Usó la genética para reconstruir las migraciones y la historia de las poblaciones humanas. Fue pionero de la genética de poblaciones humanas.",
"Walter Gilbert":"Desarrolló con Maxam un método para secuenciar ADN y propuso la hipótesis del mundo de ARN. Compartió el Nobel de Química de 1980.",
"Robert Noyce":"Cofundó Fairchild Semiconductor e Intel y co-inventó el circuito integrado de silicio. Fue llamado el «alcalde de Silicon Valley».",
"Federico Faggin":"Diseñó el microprocesador Intel 4004 y fundó la empresa Zilog. Desarrolló también tecnología de pantallas táctiles.",
"Alexandre Rodrigues Ferreira":"Naturalista brasileño que dirigió una expedición científica por el Amazonas y Mato Grosso entre 1783 y 1792, y reunió plantas, animales y datos etnográficos.",
"Felipe Poey":"Naturalista cubano que describió numerosas especies de peces y mariposas de las Antillas. Fue pionero de la historia natural cubana.",
"Pedro Vicente Maldonado":"Cartógrafo ecuatoriano que levantó mapas de la Real Audiencia de Quito, abrió un camino hacia Esmeraldas y colaboró con la misión geodésica de La Condamine.",
"Antonio de León y Gama":"Astrónomo y científico mexicano que estudió y describió los monolitos de la plaza mayor, como la Piedra del Sol. Hizo observaciones de eclipses y cometas.",
"Robert Bárány":"Estudió la función del sistema vestibular del oído interno y desarrolló la prueba calórica. Recibió el Nobel de Medicina de 1914.",
"Allvar Gullstrand":"Describió cómo el ojo forma imágenes y la refracción de sus medios, y desarrolló la lámpara de hendidura. Recibió el Nobel de Medicina de 1911.",
"August Krogh":"Descubrió el mecanismo que regula el flujo de sangre en los capilares según la actividad muscular. Recibió el Nobel de Medicina de 1920.",
"Archibald Hill":"Estudió la producción de calor en los músculos y la energética del ejercicio. Compartió el Nobel de Medicina de 1922 con Meyerhof.",
"Otto Meyerhof":"Mostró la relación entre el consumo de oxígeno y el metabolismo del ácido láctico en los músculos. Compartió el Nobel de Medicina de 1922.",
"George Minot":"Con Murphy demostró que una dieta rica en hígado trata la anemia perniciosa. Compartió el Nobel de Medicina de 1934 con Whipple y Murphy.",
"Henrik Dam":"Descubrió la vitamina K, necesaria para la coagulación de la sangre. Compartió el Nobel de Medicina de 1943 con Doisy.",
"Herbert Gasser":"Con Erlanger usó el osciloscopio para mostrar que distintas fibras nerviosas conducen a diferentes velocidades. Compartieron el Nobel de Medicina de 1944.",
"Walter Hess":"Mostró con electrodos implantados cómo el diencéfalo regula funciones internas como la presión y la temperatura. Compartió el Nobel de Medicina de 1949.",
"John Enders":"Con Weller y Robbins cultivó el virus de la polio en tejidos, lo que hizo posible las vacunas. Compartieron el Nobel de Medicina de 1954.",
"Vincent du Vigneaud":"Sintetizó la oxitocina, la primera hormona polipeptídica creada en laboratorio. Recibió el Nobel de Química de 1955.",
"Stanley Cohen":"Descubrió con Levi-Montalcini el factor de crecimiento epidérmico. Compartió el Nobel de Medicina de 1986.",
"Michael Brown":"Con Goldstein descubrió el receptor de lipoproteínas de baja densidad y la base de la hipercolesterolemia familiar. Compartieron el Nobel de Medicina de 1985.",
"Joseph Goldstein":"Con Brown descubrió el receptor del colesterol LDL y explicó cómo las células captan el colesterol. Compartieron el Nobel de Medicina de 1985.",
"Jules Hoffmann":"Descubrió el papel de la proteína Toll en la defensa de la mosca de la fruta contra los microbios. Compartió el Nobel de Medicina de 2011.",
"Bruce Beutler":"Descubrió que el receptor TLR4 detecta las bacterias en mamíferos. Compartió el Nobel de Medicina de 2011.",
"Charles Édouard Guillaume":"Inventó las aleaciones invar y elinvar, casi insensibles a los cambios de temperatura. Recibió el Nobel de Física de 1920.",
"Polykarp Kusch":"Midió con precisión el momento magnético del electrón, que mostró desviaciones de la teoría de Dirac. Compartió el Nobel de Física de 1955.",
"Donald Glaser":"Inventó la cámara de burbujas para visualizar las trayectorias de partículas. Recibió el Nobel de Física de 1960 y luego trabajó en neurobiología.",
"Alfred Kastler":"Desarrolló el bombeo óptico para controlar la orientación de los estados atómicos con luz. Recibió el Nobel de Física de 1966.",
"Leon Cooper":"Descubrió los pares de electrones que explican la superconductividad, parte de la teoría BCS. Compartió el Nobel de Física de 1972.",
"Robert Schrieffer":"Con Bardeen y Cooper desarrolló la teoría microscópica de la superconductividad. Compartieron el Nobel de Física de 1972.",
"Ivar Giaever":"Demostró experimentalmente el efecto túnel en superconductores. Compartió el Nobel de Física de 1973.",

"Paul Boyer":"Propuso cómo la ATP sintasa produce ATP mediante un mecanismo rotatorio. Compartió el Nobel de Química de 1997.",

"Maria Telkes":"Pionera de la energía solar, diseñó una de las primeras casas calentadas por el Sol y destiladores solares de agua. Trabajó en EE. UU.",

"Sylvia Earle":"Bióloga marina que ha liderado cientos de expediciones y fue pionera del buceo en profundidad. Es conocida como «Her Deepness» y promueve la protección de los océanos.",

"Taqi al-Din":"Astrónomo e ingeniero otomano que dirigió el observatorio de Estambul y construyó relojes astronómicos. Escribió sobre óptica y mecánica.",
"Ali Qushji":"Astrónomo de Samarcanda que trabajó con Ulugh Beg y discutió la rotación de la Tierra. Pasó sus últimos años en Estambul.",
"Thomas Odhiambo":"Entomólogo keniano que estudió el control de plagas y fundó el Centro Internacional de Fisiología y Ecología de Insectos. Impulsó la ciencia en África.",
"Hugh Everett":"Propuso en su tesis la interpretación de los muchos mundos de la mecánica cuántica. Su idea no tuvo mucho eco en vida y hoy es muy discutida.",

"Yakir Aharonov":"Con Bohm descubrió el efecto que muestra que los potenciales electromagnéticos afectan a partículas cuánticas incluso donde no hay campo.",
"Egon Pearson":"Con Neyman desarrolló el marco de las pruebas de hipótesis y el lema de Neyman-Pearson. Fue hijo de Karl Pearson.",
"Jerzy Neyman":"Desarrolló los intervalos de confianza y las pruebas de hipótesis con Egon Pearson. Fundó el laboratorio estadístico de Berkeley.",
"William Gosset":"Químico de Guinness que desarrolló la distribución t para muestras pequeñas y la publicó con el seudónimo «Student».",

"Georg Frobenius":"Desarrolló la teoría de representaciones de grupos finitos y el teorema de Perron-Frobenius. Fue profesor en Berlín.",
"Issai Schur":"Hizo aportes a la teoría de representaciones, el álgebra y la combinatoria, con el lema de Schur. Fue obligado a dejar su puesto por el nazismo.",
"Felix Hausdorff":"Fundó la topología general con la noción de espacio de Hausdorff y estudió la dimensión fractal. Murió en 1942 para no ser deportado.",
