"Li Shizhen":"Tras casi 30 años de trabajo reunió en el «Compendio de materia médica» unos 1.900 remedios de plantas, animales y minerales. Su obra influyó en toda Asia oriental.",
"Seki Takakazu":"Desarrolló métodos de álgebra y determinantes en Japón de forma independiente a Europa. Se le considera el mayor matemático japonés de su época.",
"Antonio Raimondi":"Naturalista italiano que se estableció en el Perú, lo recorrió durante casi veinte años y reunió datos de geografía, botánica y geología. Su obra «El Perú» es una referencia fundamental.",
"Kitasato Shibasaburō":"Aisló el bacilo del tétanos y, con Behring, desarrolló una antitoxina. También identificó el bacilo de la peste durante la epidemia de Hong Kong de 1894.",
"Hertha Ayrton":"Estudió el arco eléctrico y explicó por qué silban las lámparas. Fue la primera mujer en leer un trabajo propio ante la Royal Society.",
"Williamina Fleming":"Empezó como empleada doméstica en Harvard y llegó a ser astrónoma. Descubrió la nebulosa Cabeza de Caballo y clasificó miles de estrellas.",
"Nettie Stevens":"Descubrió que el sexo de ciertos insectos depende de los cromosomas X e Y. Su trabajo con gusanos de la harina fue clave en la genética.",
"Luis Agote":"Realizó en 1914 la primera transfusión de sangre con citrato de sodio como anticoagulante, lo que permitió conservarla. Su método se usó en la Primera Guerra Mundial.",
"Hideyo Noguchi":"Demostró la presencia de la espiroqueta de la sífilis en el cerebro y trabajó sobre la fiebre amarilla en América y África. Murió de esa enfermedad en Ghana; algunas de sus conclusiones resultaron erróneas.",
"Julio C. Tello":"Médico y arqueólogo de origen quechua que estudió la cultura Chavín y descubrió la necrópolis de Paracas. Fundó instituciones de arqueología en el Perú.",
"Salvador Mazza":"Médico argentino que dirigió una misión para estudiar la enfermedad de Chagas en el norte del país. Fue clave para reconocer su importancia clínica.",
"Max Theiler":"Desarrolló la vacuna 17D contra la fiebre amarilla, aún usada hoy. Recibió el Nobel de Medicina de 1951.",
"Eugenio Espejo":"Médico y pensador quiteño que escribió sobre la viruela y la higiene y relacionó las enfermedades con causas ambientales. También fue periodista y reformista.",
"Maria Mitchell":"Descubrió un cometa en 1847 y recibió una medalla del rey de Dinamarca. Fue la primera mujer elegida para la Academia Americana de las Artes y las Ciencias.",
"Frederick Griffith":"Observó en 1928 que bacterias inofensivas se volvían patógenas al mezclarse con bacterias muertas, un fenómeno de transformación. Su experimento llevó a identificar el ADN como material genético.",
"Ida Noddack":"Con Walter Noddack y Otto Berg descubrió el renio en 1925. También propuso la fisión nuclear en 1934, idea que fue ignorada entonces.",
"Katharine Blodgett":"Desarrolló películas delgadas para hacer vidrio no reflectante, usadas en lentes. Fue la primera mujer con doctorado en física de Cambridge.",
"Arturo Rosenblueth":"Fisiólogo mexicano que escribió con Norbert Wiener el artículo sobre «conducta, propósito y teleología», base de la cibernética. También estudió el sistema nervioso y el corazón.",
"Harold Urey":"Descubrió el deuterio, un isótopo del hidrógeno, y recibió el Nobel de Química de 1934. También estudió el origen del sistema solar.",
"Vannevar Bush":"Construyó el analizador diferencial, una computadora analógica, y dirigió la investigación científica de EE. UU. en la Segunda Guerra Mundial. Imaginó el «memex», precursor del hipertexto.",
"Otto Stern":"Con Walther Gerlach mostró en 1922 que el momento angular de los átomos está cuantizado. Recibió el Nobel de Física de 1943.",
"Hans Geiger":"Con Rutherford participó en el experimento de la lámina de oro y desarrolló el contador de radiación que lleva su nombre.",
"Gerard Kuiper":"Descubrió las lunas Miranda de Urano y Nereida de Neptuno y detectó la atmósfera de Titán. Su nombre se asocia con el cinturón de objetos más allá de Neptuno.",
"Alfred Hershey":"Con Martha Chase demostró en 1952 que el material genético de los virus es ADN. Compartió el Nobel de Medicina de 1969.",
"Willard Libby":"Desarrolló el método de datar restos orgánicos midiendo el carbono-14. Recibió el Nobel de Química de 1960.",
"Marguerite Perey":"Descubrió el elemento francio en 1939 mientras trabajaba en el Instituto del Radio. Fue la primera mujer elegida para la Academia de Ciencias de Francia.",
"Javier Pulgar Vidal":"Propuso la división del Perú en ocho regiones naturales según altitud y clima: chala, yunga, quechua, suni, puna, janca, selva alta y selva baja. Su clasificación se usa mucho en la enseñanza.",
"Luis Walter Alvarez":"Con su hijo Walter propuso en 1980 que el impacto de un asteroide causó la extinción de los dinosaurios. Recibió el Nobel de Física de 1968 por su trabajo con partículas.",
"Qian Xuesen":"Estudió y trabajó en EE. UU. antes de volver a China en 1955. Dirigió el desarrollo de misiles y del programa espacial chino.",
"Glenn Seaborg":"Participó en el descubrimiento de diez elementos, entre ellos el plutonio, y reordenó la tabla periódica con la serie de los actínidos. Recibió el Nobel de Química de 1951.",
"Max Perutz":"Determinó la estructura de la hemoglobina con rayos X tras más de veinte años de trabajo. Compartió el Nobel de Química de 1962 con Kendrew.",
"Guillermo González Camarena":"A los 17 años diseñó un sistema de televisión en color por secuencia de campos. Obtuvo patentes en México y EE. UU.",
"John Kendrew":"Resolvió la estructura tridimensional de la mioglobina, la primera proteína cuya estructura se determinó. Recibió el Nobel de Química de 1962.",
"Esther Lederberg":"Descubrió el bacteriófago lambda y desarrolló la réplica en placa, técnica para identificar mutantes. Su aporte no se reconoció con el Nobel que recibió su esposo.",
"Jack Kilby":"Construyó en 1958 el primer circuito integrado en Texas Instruments. Recibió el Nobel de Física del año 2000.",
"Allan Cormack":"Desarrolló los fundamentos matemáticos de la tomografía computarizada. Compartió el Nobel de Medicina de 1979 con Hounsfield.",
"Aaron Klug":"Desarrolló técnicas de microscopía electrónica para determinar la estructura de virus y complejos de ácidos nucleicos con proteínas. Recibió el Nobel de Química de 1982.",
"Paul Berg":"Creó las primeras moléculas de ADN recombinante y fue impulsor de la reunión de Asilomar sobre su seguridad. Recibió el Nobel de Química de 1980.",
"Joshua Lederberg":"Mostró que las bacterias intercambian material genético por conjugación. Recibió el Nobel de Medicina de 1958.",
"Sydney Brenner":"Contribuyó a descubrir el ARN mensajero y propuso usar el gusano C. elegans como organismo modelo. Compartió el Nobel de Medicina de 2002.",
"Carl Woese":"Con el análisis del ARN ribosómico propuso en 1977 que las arqueas forman un dominio distinto de la vida. Redibujó el árbol de la vida en tres dominios.",
"Gordon Moore":"Cofundó Fairchild Semiconductor e Intel y observó que el número de transistores en un chip se duplica cada pocos años. Esa observación se conoce como ley de Moore.",
"Yuan Longping":"Desarrolló variedades de arroz híbrido de mayor rendimiento, que ayudaron a aumentar la producción de alimentos en China y otros países. Se le conoce como el «padre del arroz híbrido».",
"Frank Drake":"Realizó en 1960 el primer intento moderno de captar señales de civilizaciones extraterrestres, el Proyecto Ozma, y formuló la ecuación que estima su número. Ayudó a diseñar el mensaje de Arecibo.",
"Stanley Miller":"En 1953 simuló la atmósfera primitiva con descargas eléctricas y obtuvo aminoácidos. El experimento aportó a la teoría del origen químico de la vida.",
"Luc Montagnier":"Dirigió el equipo que aisló el VIH en 1983. Recibió el Nobel de Medicina de 2008; en sus últimos años defendió ideas científicas muy cuestionadas.",
"Shin'ichirō Tomonaga":"Desarrolló de forma independiente la renormalización de la electrodinámica cuántica durante la guerra. Compartió el Nobel de Física de 1965 con Feynman y Schwinger.",
"Farouk El-Baz":"Geólogo que entrenó a los astronautas del Apolo y ayudó a seleccionar los lugares de alunizaje. Luego estudió los desiertos con imágenes satelitales.",
"Françoise Barré-Sinoussi":"Con Luc Montagnier aisló en 1983 el virus que causa el sida. Recibieron el Nobel de Medicina de 2008.",
"Giulio Natta":"Desarrolló polímeros con estructura regular, como el polipropileno isotáctico, a partir de catalizadores de Ziegler. Compartió el Nobel de Química de 1963.",
"Karl Ziegler":"Descubrió catalizadores que permiten fabricar polietileno a baja presión. Compartió el Nobel de Química de 1963 con Natta.",
"Hermann Staudinger":"Propuso que los polímeros son cadenas largas de moléculas unidas por enlaces covalentes, idea que fue resistida al principio. Recibió el Nobel de Química de 1953.",
"Wallace Carothers":"Dirigió en DuPont la investigación que llevó al nailon, el primer polímero sintético de uso masivo, y al neopreno. Murió joven, a los 41 años.",
"Alfred Werner":"Propuso que los metales forman compuestos con ligandos dispuestos en geometrías definidas, base de la química de coordinación. Recibió el Nobel de Química de 1913.",
"Walther Nernst":"Formuló la tercera ley de la termodinámica y estudió la electroquímica y las pilas. Recibió el Nobel de Química de 1920.",
"Wilhelm Ostwald":"Estudió la catálisis, la velocidad de las reacciones y el equilibrio químico, y fue pionero de la fisicoquímica. Recibió el Nobel de Química de 1909.",
"Ernst Ruska":"Construyó en 1931, con Max Knoll, el primer microscopio electrónico, que permitió ver estructuras mucho más pequeñas que con luz. Compartió el Nobel de Física de 1986.",
"Dennis Gabor":"Ideó en 1947 la holografía para mejorar el microscopio electrónico; el desarrollo del láser la hizo práctica. Recibió el Nobel de Física de 1971.",
"Charles Townes":"Construyó el máser, un amplificador de microondas, y propuso extender el principio a la luz visible, base del láser. Compartió el Nobel de Física de 1964.",
"Theodore Maiman":"Hizo funcionar en 1960 el primer láser, con un cristal de rubí. Aunque otros habían propuesto la idea, él la demostró en la práctica.",
"William Shockley":"Dirigió el equipo de Bell Labs que inventó el transistor y compartió el Nobel de Física de 1956. Más tarde fundó una empresa de semiconductores en California.",
"Walter Brattain":"Con Bardeen construyó en 1947 el transistor de contacto puntual. Compartió el Nobel de Física de 1956.",
"Godfrey Hounsfield":"Construyó el primer escáner de tomografía computarizada, que probó en 1971. Compartió el Nobel de Medicina de 1979 con Cormack.",
"Paul Lauterbur":"Mostró en 1973 cómo usar gradientes magnéticos para formar imágenes con resonancia magnética. Compartió el Nobel de Medicina de 2003 con Mansfield.",
"Willem Kolff":"Construyó durante la Segunda Guerra Mundial el primer dispositivo de diálisis funcional. También participó en el desarrollo de corazones artificiales.",
"Werner Forssmann":"En 1929 se introdujo un catéter por una vena del brazo hasta el corazón y lo comprobó con rayos X. Recibió el Nobel de Medicina de 1956.",
"Hans Selye":"Describió el síndrome general de adaptación y popularizó el término «estrés» en biología y medicina. Fue autor de libros divulgativos muy leídos.",
"Waldemar Haffkine":"Desarrolló vacunas contra el cólera y la peste bubónica y probó la primera en sí mismo. Es considerado un pionero de la vacunación masiva en la India.",
"Albert Calmette":"Con Camille Guérin desarrolló la vacuna BCG contra la tuberculosis, aplicada por primera vez en humanos en 1921. También trabajó en antídotos contra venenos de serpiente.",
"Camille Guérin":"Veterinario y bacteriólogo que, con Calmette, atenuó el bacilo bovino de la tuberculosis durante más de diez años. Su cepa dio origen a la vacuna BCG.",
"Hermann Muller":"Mostró en 1927 que los rayos X producen mutaciones en las moscas de la fruta. Recibió el Nobel de Medicina de 1946 y advirtió sobre los riesgos de la radiación.",
"George Beadle":"Con Edward Tatum, estudiando el moho Neurospora, propuso que cada gen controla la producción de una enzima. Compartieron el Nobel de Medicina de 1958.",
"Edward Tatum":"Con George Beadle demostró que los genes controlan reacciones bioquímicas específicas. Compartió el Nobel de Medicina de 1958 con Beadle y Lederberg.",
"Max Delbrück":"Físico que se pasó a la biología y reunió al «grupo de los fagos» para estudiar la genética con virus bacterianos. Compartió el Nobel de Medicina de 1969.",
"Salvador Luria":"Con Delbrück demostró que las mutaciones en bacterias ocurren al azar y no en respuesta al ambiente. Compartió el Nobel de Medicina de 1969.",
"Christiane Nüsslein-Volhard":"Identificó genes que organizan el plan corporal del embrión de la mosca de la fruta. Compartió el Nobel de Medicina de 1995.",
"Mary-Claire King":"Demostró en 1990 que una región del cromosoma 17, hoy el gen BRCA1, se asocia con cáncer de mama hereditario. También usó la genética para identificar a niños desaparecidos en Argentina.",
"Dian Fossey":"Estudió los gorilas de montaña en Ruanda y fundó el centro Karisoke. Fue asesinada en 1985 y su trabajo impulsó la conservación de estos primates.",
"Hans Spemann":"Mostró con experimentos en embriones de tritón que una región, el organizador, induce el desarrollo de otros tejidos. Recibió el Nobel de Medicina de 1935.",
"Karl von Frisch":"Descifró cómo las abejas comunican la dirección y la distancia del alimento con su «danza». Compartió el Nobel de Medicina de 1973.",
"Norman Lockyer":"Estudió el espectro solar y en 1868 identificó una línea amarilla que atribuyó a un elemento nuevo, el helio. Fundó y dirigió la revista Nature.",
"Jules Janssen":"Observó la misma línea en el espectro solar durante un eclipse en la India en 1868. También inventó el revólver fotográfico para registrar el tránsito de Venus.",
"Angelo Secchi":"Jesuita que clasificó las estrellas en tipos según su espectro. Dirigió el observatorio del Colegio Romano.",
"Bernard Lovell":"Impulsó la construcción del gran radiotelescopio de Jodrell Bank, que siguió al Sputnik y otras sondas espaciales. Estudió también meteoros y radiogalaxias.",
"Grote Reber":"Construyó en su jardín en 1937 un radiotelescopio parabólico y elaboró los primeros mapas de radiación del cielo. Fue pionero de la radioastronomía.",
"Karl Jansky":"Ingeniero de Bell Labs que, al estudiar ruido en comunicaciones, detectó en 1932 radiación de radio procedente del centro de la Vía Láctea. Es considerado fundador de la radioastronomía.",
"Emil Artin":"Hizo aportes a la teoría de números, el álgebra y los anillos artinianos. Fue un influyente profesor en Hamburgo y en Estados Unidos.",
"André Weil":"Formuló las conjeturas de Weil sobre ecuaciones en cuerpos finitos y fue miembro fundador del grupo Bourbaki. Su trabajo unió álgebra, geometría y teoría de números.",
"Julia Robinson":"Contribuyó de forma decisiva a resolver el décimo problema de Hilbert, mostrando que no hay un método general para resolver ecuaciones diofánticas. Fue la primera mujer presidenta de la Sociedad Matemática Americana.",
"John Nash":"Introdujo el concepto de equilibrio de Nash en teoría de juegos y trabajó en ecuaciones diferenciales. Recibió el Nobel de Economía de 1994 y el premio Abel de 2015.",
"Sofia Kovalévskaya":"Fue una de las primeras mujeres en obtener un doctorado en matemáticas y en ocupar una cátedra universitaria en Europa. Demostró un teorema fundamental sobre ecuaciones en derivadas parciales.",
"Mary Cartwright":"Con Littlewood estudió ecuaciones diferenciales no lineales y descubrió comportamientos hoy asociados al caos. Fue la primera mujer en presidir la London Mathematical Society.",
"Henri Lebesgue":"Desarrolló la teoría de la medida y la integral que lleva su nombre, que generaliza la de Riemann. Su trabajo es base del análisis moderno.",
"Alfred Tarski":"Definió con rigor el concepto de verdad en lenguajes formales y fundó la teoría de modelos. También es coautor de la paradoja de Banach-Tarski.",
"Gaspard Coriolis":"Describió las fuerzas aparentes en sistemas que giran, hoy llamadas de Coriolis, que influyen en vientos y corrientes. También introdujo el término «trabajo» en mecánica.",
"Juan Maldacena":"Físico argentino que propuso en 1997 una correspondencia entre teorías de gravedad y teorías cuánticas sin gravedad. Es una de las ideas más influyentes de la física teórica reciente.",
"Alberto Calderón":"Matemático argentino que hizo aportes fundamentales al análisis armónico, las integrales singulares y las ecuaciones diferenciales. Trabajó en la Universidad de Chicago.",
"Rodolfo Llinás":"Neurocientífico colombiano pionero en el estudio de las propiedades eléctricas de las neuronas, el cerebelo y los ritmos cerebrales.",
"Mildred Dresselhaus":"Estudió las propiedades electrónicas del grafito, los fulerenos y los nanotubos de carbono. Fue llamada «la reina de la ciencia del carbono» y recibió la Medalla Presidencial de la Libertad.",
"Pieter Zeeman":"Mostró que un campo magnético desdobla las líneas espectrales de la luz emitida por un átomo. Compartió el Nobel de Física de 1902 con Lorentz.",
"Arnold Sommerfeld":"Extendió el modelo atómico de Bohr con órbitas elípticas y la constante de estructura fina. Fue maestro de varios premios Nobel, como Heisenberg y Pauli.",
"James Franck":"Con Gustav Hertz mostró en 1914 que los átomos absorben energía en cantidades discretas, un apoyo clave al modelo de Bohr. Compartieron el Nobel de Física de 1925.",
"Gustav Hertz":"Con James Franck demostró la cuantización de los niveles de energía del átomo. Compartió el Nobel de Física de 1925 y era sobrino de Heinrich Hertz.",
"Walther Bothe":"Desarrolló el método de coincidencias para detectar partículas casi simultáneas y estudió reacciones nucleares. Compartió el Nobel de Física de 1954 con Born.",
"George Paget Thomson":"Demostró que los electrones se difractan en cristales, lo que confirma su carácter ondulatorio. Compartió el Nobel de Física de 1937 con Davisson; era hijo de J. J. Thomson.",
"Clinton Davisson":"Con Lester Germer observó la difracción de electrones en un cristal de níquel, evidencia de su naturaleza de onda. Compartió el Nobel de Física de 1937.",
"Isidor Rabi":"Desarrolló el método de resonancia de haces moleculares, base de la resonancia magnética nuclear y de los relojes atómicos. Recibió el Nobel de Física de 1944.",
"Felix Bloch":"Desarrolló métodos para medir el magnetismo nuclear y fue pionero de la resonancia magnética. Compartió el Nobel de Física de 1952 con Purcell.",
"Edward Purcell":"Con su equipo detectó la resonancia magnética nuclear en la materia sólida y la línea de hidrógeno de 21 cm del espacio. Compartió el Nobel de Física de 1952.",
"Julian Schwinger":"Desarrolló una formulación de la electrodinámica cuántica y participó en el desarrollo del radar durante la guerra. Compartió el Nobel de Física de 1965 con Feynman y Tomonaga.",
"Freeman Dyson":"Mostró que las formulaciones de Feynman, Schwinger y Tomonaga de la electrodinámica cuántica son equivalentes. También escribió ensayos sobre ciencia y futuro.",
"Leon Lederman":"Con Schwartz y Steinberger descubrió el neutrino muónico y dirigió el Fermilab. Recibió el Nobel de Física de 1988 y popularizó el nombre «partícula de Dios» para el bosón de Higgs.",
"Sheldon Glashow":"Propuso en 1961 una teoría que unificaba la interacción electromagnética y la débil, y predijo el quark encantado. Compartió el Nobel de Física de 1979.",
"Peter Mansfield":"Desarrolló técnicas matemáticas para obtener imágenes rápidas con resonancia magnética. Compartió el Nobel de Medicina de 2003 con Lauterbur.",
"Barry Barish":"Dirigió la construcción y la colaboración científica de LIGO, que detectó ondas gravitacionales en 2015. Compartió el Nobel de Física de 2017.",
"Saul Perlmutter":"Dirigió el Supernova Cosmology Project, que mostró en 1998 que la expansión del universo se acelera. Compartió el Nobel de Física de 2011.",
"Adam Riess":"Con el High-z Supernova Search Team halló en 1998 que la expansión del universo se acelera, evidencia de la energía oscura. Compartió el Nobel de Física de 2011.",
"Michel Mayor":"Con Didier Queloz descubrió en 1995 el primer planeta fuera del sistema solar en torno a una estrella de tipo solar, 51 Pegasi b. Compartieron el Nobel de Física de 2019.",
"Didier Queloz":"Con Michel Mayor detectó 51 Pegasi b, el primer exoplaneta alrededor de una estrella como el Sol. Compartieron el Nobel de Física de 2019.",
"Reinhard Genzel":"Con su grupo siguió estrellas cercanas al centro galáctico y mostró que allí hay un objeto muy masivo y compacto. Compartió el Nobel de Física de 2020 con Ghez y Penrose.",
"Jim Peebles":"Teórico que sentó bases de la cosmología moderna, incluidos la radiación cósmica de fondo y el papel de la materia oscura. Compartió el Nobel de Física de 2019.",
"Carolyn Bertozzi":"Desarrolló reacciones químicas que ocurren dentro de células vivas sin alterar su funcionamiento, la química bioortogonal. Compartió el Nobel de Química de 2022.",
"Frances Arnold":"Aplicó la evolución dirigida para crear enzimas con propiedades útiles. Recibió el Nobel de Química de 2018, siendo la quinta mujer en ganarlo.",
"Thomas Cech":"Descubrió que el ARN puede actuar como catalizador, las ribozimas. Compartió el Nobel de Química de 1989 con Altman.",
"Sidney Altman":"Mostró que la ribonucleasa P contiene ARN catalítico, igual que lo halló Cech en otro sistema. Compartió el Nobel de Química de 1989.",
"Venki Ramakrishnan":"Determinó la estructura de la subunidad pequeña del ribosoma, clave para entender cómo se sintetizan las proteínas y cómo actúan algunos antibióticos. Compartió el Nobel de Química de 2009.",
"Roger Kornberg":"Reveló cómo se copia el ADN en ARN en las células con núcleo, con imágenes de la ARN polimerasa. Recibió el Nobel de Química de 2006.",
"Arthur Kornberg":"Descubrió la ADN polimerasa y mostró cómo se sintetiza el ADN fuera de la célula. Compartió el Nobel de Medicina de 1959 con Ochoa.",
"Carol Greider":"Siendo estudiante de doctorado, con Blackburn, descubrió la enzima telomerasa. Compartió el Nobel de Medicina de 2009.",
"Jack Szostak":"Mostró con Blackburn cómo los telómeros protegen los cromosomas y estudia el origen de la vida desde la química. Compartió el Nobel de Medicina de 2009.",
"Andrew Fire":"Con Craig Mello descubrió en 1998 la interferencia de ARN, un mecanismo que silencia genes. Compartieron el Nobel de Medicina de 2006.",
"William Campbell":"Contribuyó a desarrollar la ivermectina, fármaco contra parásitos que afectan a millones de personas. Compartió el Nobel de Medicina de 2015.",
"Satoshi Ōmura":"Aisló bacterias del suelo que producen la avermectina, base de la ivermectina. Compartió el Nobel de Medicina de 2015.",
"James Allison":"Mostró que bloquear la proteína CTLA-4 libera a las células inmunes para atacar tumores. Compartió el Nobel de Medicina de 2018.",
"Tasuku Honjo":"Descubrió la proteína PD-1 y su papel como freno del sistema inmune. Compartió el Nobel de Medicina de 2018 con Allison.",
"Harald zur Hausen":"Demostró que ciertos virus del papiloma humano causan cáncer de cuello uterino, lo que llevó a vacunas. Recibió el Nobel de Medicina de 2008.",
"Barry Marshall":"Con Warren mostró que la bacteria Helicobacter pylori causa úlceras gástricas, y llegó a beberla para demostrarlo. Compartieron el Nobel de Medicina de 2005.",
"Robin Warren":"Patólogo que observó bacterias en el estómago de pacientes con gastritis y úlceras. Compartió el Nobel de Medicina de 2005 con Marshall.",
"Ian Wilmut":"Dirigió el equipo que clonó a Dolly, el primer mamífero clonado a partir de una célula adulta, nacida en 1996. Su trabajo reabrió el debate sobre la clonación.",
"Robert Edwards":"Desarrolló con Steptoe la fecundación in vitro, que condujo en 1978 al nacimiento de Louise Brown. Recibió el Nobel de Medicina de 2010.",
"Patrick Steptoe":"Ginecólogo pionero de la laparoscopia que colaboró con Edwards en el primer nacimiento por fecundación in vitro, en 1978.",
"Ernest Starling":"Con Bayliss descubrió la secretina y acuñó el término «hormona». Describió también cómo el corazón ajusta su fuerza al volumen de sangre.",
"William Bayliss":"Con Starling descubrió en 1902 la secretina, la primera hormona identificada. Estudió también la fisiología de los vasos sanguíneos.",
"Charles Sherrington":"Estudió los reflejos y el control del movimiento, y acuñó el término «sinapsis». Compartió el Nobel de Medicina de 1932 con Adrian.",
"Edgar Adrian":"Registró los impulsos eléctricos de las fibras nerviosas y mostró que obedecen a la ley del todo o nada. Compartió el Nobel de Medicina de 1932.",
"Alan Hodgkin":"Con Huxley explicó con experimentos en el axón del calamar cómo se genera el impulso nervioso. Compartieron el Nobel de Medicina de 1963.",
"Andrew Huxley":"Con Hodgkin describió las corrientes iónicas que producen el potencial de acción y más tarde propuso un modelo de contracción muscular. Recibió el Nobel de Medicina de 1963.",
"Otto Loewi":"Demostró en 1921 que los nervios se comunican con sustancias químicas, tras un experimento con corazones de rana. Compartió el Nobel de Medicina de 1936.",
"Henry Dale":"Identificó la acetilcolina como neurotransmisor y estudió su acción en el cuerpo. Compartió el Nobel de Medicina de 1936 con Loewi.",
"Roger Sperry":"Con pacientes de cerebro dividido mostró que los hemisferios cerebrales tienen funciones especializadas. Compartió el Nobel de Medicina de 1981.",
"David Hubel":"Con Torsten Wiesel descubrió cómo las neuronas de la corteza visual responden a líneas y bordes. Compartieron el Nobel de Medicina de 1981.",
"Paul Nurse":"Descubrió genes clave que controlan el ciclo de división de las células, estudiando levaduras. Compartió el Nobel de Medicina de 2001.",
"Eric Kandel":"Estudió en el caracol Aplysia cómo cambian las sinapsis al aprender y recordar. Recibió el Nobel de Medicina de 2000.",
"Mario Capecchi":"Desarrolló la recombinación homóloga para modificar genes específicos en ratones. Compartió el Nobel de Medicina de 2007.",
"Martin Evans":"Aisló células madre embrionarias de ratón y las usó para introducir cambios genéticos. Compartió el Nobel de Medicina de 2007.",
"Terence Tao":"Demostró con Ben Green que hay progresiones aritméticas arbitrariamente largas formadas por números primos. Recibió la Medalla Fields en 2006.",
"Grigori Perelman":"Demostró en 2002 y 2003 la conjetura de Poincaré. Rechazó la Medalla Fields y el premio del milenio.",
"William Thurston":"Propuso la conjetura de geometrización, que clasifica las variedades tridimensionales. Recibió la Medalla Fields en 1982.",
"Karen Uhlenbeck":"Hizo aportes al análisis geométrico y a las ecuaciones de la física matemática. Fue la primera mujer en recibir el premio Abel, en 2019.",
"Jean-Pierre Serre":"Aportó a la topología algebraica y a la teoría de números. Recibió la Medalla Fields en 1954 con 27 años, el más joven en lograrlo.",
"Israel Gelfand":"Contribuyó al análisis funcional, la teoría de representaciones y la biología matemática. Dirigió un influyente seminario en Moscú durante décadas.",
"Pierre Deligne":"Demostró la última de las conjeturas de Weil en geometría algebraica. Recibió la Medalla Fields en 1978 y el premio Abel en 2013.",
"Tommy Flowers":"Ingeniero que construyó el Colossus, computadora electrónica usada para descifrar mensajes alemanes en la Segunda Guerra Mundial. Su trabajo se mantuvo en secreto durante décadas.",
"Seymour Cray":"Diseñó los primeros supercomputadores comerciales, como el Cray-1, y fundó su propia empresa. Se le llama el «padre de la supercomputación».",
"Douglas Engelbart":"Presentó en 1968 la «madre de todas las demos», con ratón, ventanas e hipertexto. Su trabajo anticipó las interfaces gráficas modernas.",
"Alan Kay":"Impulsó la programación orientada a objetos con Smalltalk y concibió el Dynabook, anticipo de las tabletas. Recibió el premio Turing en 2003.",
"Geoffrey Hinton":"Contribuyó al aprendizaje profundo con la retropropagación y las máquinas de Boltzmann. Compartió el premio Turing de 2018 y el Nobel de Física de 2024.",
"Yann LeCun":"Desarrolló las redes convolucionales para reconocer imágenes y escritura manuscrita. Compartió el premio Turing de 2018.",
"Yoshua Bengio":"Hizo aportes al aprendizaje profundo, incluido el modelado del lenguaje con redes neuronales. Compartió el premio Turing de 2018.",
"Maimónides":"Médico y filósofo que sirvió en la corte de Egipto y escribió tratados sobre el asma, los venenos y la higiene. Fue también un influyente pensador judío.",
"Al-Idrisi":"Elaboró para Roger II de Sicilia un mapamundi de plata y el libro geográfico «Tabula Rogeriana». Fue una de las representaciones del mundo más precisas de su época.",
"Ibn al-Shatir":"Astrónomo de Damasco que desarrolló modelos planetarios sin el ecuante de Ptolomeo, similares a los que luego usó Copérnico. También diseñó instrumentos para medir el tiempo.",
"Alberto Magno":"Dominico alemán que estudió plantas, animales, minerales y astronomía y defendió observar la naturaleza. Fue maestro de Tomás de Aquino.",
"Jean Buridan":"Propuso la teoría del ímpetu, según la cual un cuerpo en movimiento conserva una fuerza impresa, antecedente de la inercia. Influyó en la física del Renacimiento.",
"Luca Pacioli":"Fraile y matemático italiano que describió la contabilidad por partida doble en su «Summa». También escribió sobre la proporción áurea y colaboró con Leonardo da Vinci.",
"Andrea Cesalpino":"Botánico y médico italiano que clasificó las plantas por frutos y semillas. Propuso ideas sobre la circulación de la sangre antes de Harvey.",
"Francisco Hernández":"Médico de Felipe II enviado a México, donde estudió durante años las plantas y animales y su uso medicinal. Su obra fue una gran fuente de historia natural americana.",
"Maria Sibylla Merian":"Naturalista e ilustradora que viajó a Surinam y documentó la metamorfosis de insectos con detalladas láminas. Fue pionera de la entomología.",
"José Gregorio Hernández":"Médico venezolano que introdujo el microscopio y la bacteriología en la enseñanza de la medicina en su país. También fue profesor y atendió a los más pobres.",
"Andrés Manuel del Río":"Químico que descubrió en México en 1801 un elemento al que llamó eritronio, luego conocido como vanadio. Fue profesor de mineralogía en el Real Seminario de Minería.",
"Fausto Elhuyar":"Con su hermano Juan José aisló el wolframio (tungsteno) en 1783. Dirigió después el Real Seminario de Minería de México.",
"Vital Brazil":"Médico brasileño que desarrolló sueros específicos contra el veneno de distintas serpientes y dirigió el Instituto Butantan. Su trabajo salvó muchas vidas.",
"Francisco Moreno":"Explorador y naturalista argentino conocido como el «perito» Moreno. Exploró la Patagonia, donó tierras para un parque nacional y fundó el Museo de La Plata.",
"Florentino Ameghino":"Paleontólogo autodidacta que reunió una gran colección de fósiles de mamíferos sudamericanos. Propuso teorías sobre el origen de la humanidad que luego se descartaron.",
"Eduardo Braun-Menéndez":"Médico argentino que, con Houssay y otros, descubrió la hipertensina, hoy angiotensina, sustancia que eleva la presión arterial. Su trabajo fue clave para estudiar la hipertensión.",
"Claudio Gay":"Naturalista francés que recorrió Chile durante años y publicó la «Historia física y política de Chile», con datos de flora, fauna y geografía.",
"Ignacy Domeyko":"Geólogo y mineralogista polaco que trabajó en Chile como profesor y rector de la Universidad de Chile. Estudió minerales y meteoritos, y un mineral lleva su nombre.",
"Rudolph Philippi":"Naturalista alemán que dirigió el Museo Nacional de Chile y describió numerosas especies de plantas y animales. Fue pionero de la historia natural chilena.",
"Humberto Fernández-Morán":"Científico venezolano que desarrolló el cuchillo de diamante para cortar tejidos en láminas finas para microscopía electrónica. Fue pionero de la neurociencia en Venezuela.",
"Clodomiro Picado":"Científico costarricense que estudió venenos de serpientes y observó la acción antibacteriana de ciertos hongos antes del descubrimiento de la penicilina.",
"Homi Bhabha":"Físico que fundó el Instituto Tata de Investigación Fundamental y dirigió la Comisión de Energía Atómica de la India. Hizo aportes sobre cascadas de rayos cósmicos.",
"Vikram Sarabhai":"Físico que impulsó la creación de la agencia espacial de la India, ISRO, y el uso de satélites para la educación y el desarrollo.",
"Birbal Sahni":"Fundó la paleobotánica en la India y estudió plantas fósiles del subcontinente. Creó el instituto que hoy lleva su nombre en Lucknow.",
"Masatoshi Koshiba":"Dirigió el detector Kamiokande, que registró neutrinos de la supernova 1987A y abrió la astronomía de neutrinos. Compartió el Nobel de Física de 2002.",
"Takaaki Kajita":"Mostró con Super-Kamiokande que los neutrinos cambian de tipo, lo que implica que tienen masa. Compartió el Nobel de Física de 2015 con McDonald.",
"Isamu Akasaki":"Con Amano y Nakamura desarrolló el LED azul eficiente, que permitió la luz blanca de bajo consumo. Compartieron el Nobel de Física de 2014.",
"Yoshinori Ohsumi":"Descubrió los genes y mecanismos de la autofagia, el proceso por el que las células reciclan sus componentes, usando levaduras. Recibió el Nobel de Medicina de 2016.",
"Susumu Tonegawa":"Descubrió cómo los genes se reorganizan para producir millones de anticuerpos distintos. Recibió el Nobel de Medicina de 1987.",
"Mostafa El-Sayed":"Químico que estudió la espectroscopía de moléculas y las propiedades de nanopartículas metálicas, con aplicaciones en medicina. Trabajó sobre todo en Estados Unidos.",
"Aziz Sancar":"Mapeó cómo las células reparan el ADN dañado por la luz ultravioleta. Compartió el Nobel de Química de 2015.",
"Cumrun Vafa":"Físico teórico que hizo aportes a la teoría de cuerdas y la geometría matemática, entre ellos el cálculo de la entropía de agujeros negros con Strominger.",
"Anna Atkins":"Botánica inglesa que usó cianotipos para ilustrar sus álbumes de algas. Se la considera autora del primer libro ilustrado con imágenes fotográficas.",
"Margaret Lindsay Huggins":"Con su esposo William obtuvo espectros de estrellas y nebulosas y fue pionera de la espectroscopía astronómica con fotografía. Fue una de las primeras mujeres elegidas miembros honorarias de la Real Sociedad Astronómica.",
"Beatrice Tinsley":"Mostró que las galaxias cambian con el tiempo y desarrolló modelos de su evolución. Murió joven, a los 40 años, y dejó una obra influyente.",
"Marie Maynard Daly":"Fue la primera mujer afroamericana con doctorado en química en EE. UU. Estudió la relación entre el colesterol y las enfermedades del corazón.",
"Gladys West":"Matemática que realizó cálculos y modelos de la forma de la Tierra que fueron base del GPS. Trabajó durante décadas en la Marina de EE. UU.",
"Dorothy Vaughan":"Matemática que dirigió un grupo de «computadoras» humanas en la NASA y luego se formó en programación FORTRAN. Fue la primera supervisora afroamericana de la agencia.",
"Jean-Martin Charcot":"Describió enfermedades como la esclerosis múltiple y la esclerosis lateral amiotrófica y fundó la neurología clínica. Sus clases en la Salpêtrière atrajeron a Freud.",
"Emil Kraepelin":"Propuso distinguir las enfermedades mentales por su curso y sus síntomas, y separó la demencia precoz del trastorno maníaco-depresivo. Es considerado fundador de la psiquiatría moderna.",
"Alois Alzheimer":"En 1906 describió el caso de Auguste Deter, con pérdida de memoria y cambios en el cerebro, que dio nombre a la enfermedad de Alzheimer.",
"Carl Jung":"Psiquiatra que desarrolló la psicología analítica, con conceptos como los arquetipos, el inconsciente colectivo y los tipos de personalidad. Colaboró y luego se separó de Freud.",
"Lev Vygotski":"Propuso que el desarrollo cognitivo depende de la interacción social y la cultura, y definió la zona de desarrollo próximo. Murió joven, a los 37 años.",
"Alfred Binet":"Con Théodore Simon creó en 1905 la primera prueba de inteligencia para detectar niños que necesitaban apoyo escolar. Su idea evolucionó en los tests de coeficiente intelectual.",
"Hermann Ebbinghaus":"Estudió la memoria con listas de sílabas sin sentido y describió la curva del olvido y el efecto del espaciado. Fue pionero de la psicología experimental.",
"William James":"Autor de «Principios de psicología», fue figura central del funcionalismo y del pragmatismo. Formuló la teoría de las emociones de James-Lange.",
"Ernst Abbe":"Formuló la teoría que describe la resolución del microscopio y mejoró los instrumentos ópticos junto con Zeiss. Dirigió la fundación Carl Zeiss.",
"Fritz Pregl":"Desarrolló métodos para analizar cantidades diminutas de compuestos orgánicos, que facilitaron la investigación de sustancias complejas. Recibió el Nobel de Química de 1923.",
"Richard Willstätter":"Determinó la estructura de la clorofila y de otros pigmentos vegetales. Recibió el Nobel de Química de 1915.",
"Heinrich Wieland":"Estudió la estructura de los ácidos biliares y de alcaloides y la oxidación biológica. Recibió el Nobel de Química de 1927.",
"Adolf Butenandt":"Aisló y determinó la estructura de hormonas sexuales como la estrona y la progesterona. Recibió el Nobel de Química de 1939, que su gobierno le obligó a rechazar.",
"Leopold Ružička":"Trabajó en la química de los terpenos y sintetizó hormonas sexuales como la testosterona. Recibió el Nobel de Química de 1939.",
"Robert Burns Woodward":"Logró sintetizar compuestos complejos como la quinina, la clorofila y la vitamina B12. Recibió el Nobel de Química de 1965.",
"Herbert Brown":"Descubrió reacciones con compuestos de boro que permiten construir moléculas orgánicas de forma controlada. Compartió el Nobel de Química de 1979.",
"Kenichi Fukui":"Desarrolló la teoría de orbitales frontera, que explica cómo reaccionan las moléculas. Compartió el Nobel de Química de 1981 con Hoffmann.",
"Roald Hoffmann":"Con Woodward formuló reglas que predicen el curso de ciertas reacciones orgánicas a partir de orbitales moleculares. Compartió el Nobel de Química de 1981.",
"Manfred Eigen":"Desarrolló métodos para estudiar reacciones químicas extremadamente rápidas. Recibió el Nobel de Química de 1967.",
"Ilya Prigogine":"Estudió sistemas lejos del equilibrio y mostró que pueden organizarse espontáneamente, las llamadas estructuras disipativas. Recibió el Nobel de Química de 1977.",
"Thomas Henry Huxley":"Conocido como el «bulldog de Darwin», defendió públicamente la evolución. También estudió la anatomía comparada y propuso la relación entre aves y dinosaurios.",
"Joseph Dalton Hooker":"Botánico que dirigió los jardines de Kew y exploró la Antártida y el Himalaya. Fue amigo cercano de Darwin y apoyó su teoría.",
"Henry Walter Bates":"Naturalista que exploró el Amazonas durante once años y describió el mimetismo en el que especies inofensivas imitan a las tóxicas. El mimetismo batesiano lleva su nombre.",
"Fritz Müller":"Naturalista alemán que vivió en Brasil y describió el mimetismo entre especies tóxicas que se parecen entre sí. También defendió la evolución con estudios de crustáceos.",
"Richard Spruce":"Botánico inglés que exploró durante quince años el Amazonas y los Andes y recolectó miles de plantas. También estudió la quina, de la que se extrae la quinina.",
"Sewall Wright":"Desarrolló la teoría de la genética de poblaciones y el concepto de deriva génica. Fue uno de los fundadores de la síntesis evolutiva.",
"J. B. S. Haldane":"Aplicó las matemáticas a la selección natural y fue uno de los fundadores de la genética de poblaciones. También propuso ideas tempranas sobre el origen de la vida.",
"Richard Dawkins":"Divulgó la visión de la evolución centrada en los genes en «El gen egoísta» y acuñó el término «meme». Es conocido también por su defensa del ateísmo y de la ciencia.",
"William Hamilton":"Formuló la regla que explica cómo puede evolucionar el altruismo hacia parientes, la aptitud inclusiva. Influyó en la sociobiología y en Dawkins.",
"Arthur Holmes":"Usó la datación radiactiva de rocas para estimar la edad de la Tierra y propuso que corrientes de convección del manto mueven los continentes.",
"Clair Patterson":"Determinó en 1953 que la Tierra tiene unos 4.550 millones de años y luego demostró la contaminación por plomo de la gasolina. Su trabajo llevó a retirarlo.",
"Walter Alvarez":"Geólogo que halló una capa de iridio en rocas de hace 66 millones de años y propuso con su padre que un impacto causó la extinción de los dinosaurios.",
"Pierre-Gilles de Gennes":"Estudió cómo se ordenan los cristales líquidos y los polímeros aplicando ideas de la física de transiciones de fase. Recibió el Nobel de Física de 1991.",
"Georges Charpak":"Inventó la cámara proporcional multihilos, que permitió detectar partículas de forma rápida y precisa. Recibió el Nobel de Física de 1992.",
"Alain Aspect":"Realizó experimentos que confirmaron el entrelazamiento cuántico y violaron las desigualdades de Bell. Compartió el Nobel de Física de 2022.",
"Serge Haroche":"Desarrolló métodos para observar fotones individuales atrapados en cavidades sin destruirlos. Compartió el Nobel de Física de 2012 con Wineland.",
"David Wineland":"Atrapó y controló iones individuales con luz láser, base de relojes atómicos muy precisos y de la computación cuántica. Compartió el Nobel de Física de 2012.",
"Eric Cornell":"Con Carl Wieman logró en 1995 el primer condensado de Bose-Einstein en un gas diluido de rubidio. Compartió el Nobel de Física de 2001.",
"Andre Geim":"Con Novoselov aisló grafeno, una lámina de carbono de un átomo de grosor, usando cinta adhesiva. Compartieron el Nobel de Física de 2010.",
"Gerd Binnig":"Inventó con Rohrer el microscopio de efecto túnel, que permite ver átomos individuales en superficies. Compartieron el Nobel de Física de 1986.",
"Klaus von Klitzing":"Descubrió en 1980 el efecto Hall cuántico entero, en el que la resistencia toma valores fijos. Recibió el Nobel de Física de 1985.",
"Philip Anderson":"Hizo aportes a la física de la materia condensada, como la localización de electrones en sistemas desordenados. Escribió el ensayo «More is different» y recibió el Nobel de Física de 1977.",
"Vitaly Ginzburg":"Co-desarrolló la teoría de Ginzburg-Landau de la superconductividad y estudió la radiación cósmica. Compartió el Nobel de Física de 2003.",
"Andréi Sájarov":"Físico soviético que contribuyó a la bomba de hidrógeno y luego defendió los derechos humanos. Recibió el Nobel de la Paz en 1975.",
"Pavel Cherenkov":"Descubrió la luz azulada que emiten las partículas cargadas al moverse en un medio más rápido que la luz en él, la radiación de Cherenkov. Compartió el Nobel de Física de 1958.",
"Hendrik Casimir":"Predijo que dos placas metálicas muy cercanas en el vacío se atraen, el efecto Casimir. Trabajó después en los laboratorios de Philips.",
"Charles Kao":"Demostró en 1966 que se podían transmitir señales de luz en fibras de vidrio muy puras, base de las telecomunicaciones modernas. Recibió el Nobel de Física de 2009.",
"Louis Néel":"Describió el antiferromagnetismo y el ferrimagnetismo, formas de orden magnético en los materiales. Recibió el Nobel de Física de 1970.",
"Bruno Pontecorvo":"Propuso la idea de las oscilaciones de neutrinos, por las que estos cambian de tipo. Trabajó en Italia, Canadá y la Unión Soviética.",
"Eugene Shoemaker":"Fundó la geología planetaria y demostró que los cráteres lunares y terrestres proceden de impactos. Su nombre lleva el cometa Shoemaker-Levy 9.",
"Johann Bode":"Divulgó la regla de Titius-Bode sobre las distancias de los planetas y dirigió el Observatorio de Berlín. Impulsó la búsqueda de un planeta entre Marte y Júpiter.",
"Friedrich Bessel":"Midió en 1838 la primera paralaje estelar, la de 61 Cygni, lo que dio una distancia directa a una estrella. También introdujo las funciones de Bessel.",
"Giuseppe Piazzi":"Descubrió en 1801 Ceres, hoy planeta enano, entre Marte y Júpiter. Elaboró un catálogo de estrellas muy preciso.",
"Heinrich Olbers":"Médico y astrónomo que descubrió los asteroides Palas y Vesta y formuló la paradoja de por qué el cielo nocturno es oscuro.",
"John Couch Adams":"Calculó, independientemente de Le Verrier, la posición de un planeta más allá de Urano, Neptuno. Su predicción no se aprovechó a tiempo.",
"George Ellery Hale":"Inventó el espectroheliógrafo y fundó los observatorios Yerkes, Monte Wilson y Palomar. Descubrió campos magnéticos en las manchas solares.",
"Walter Baade":"Distinguió dos poblaciones de estrellas y corrigió la escala de distancias cósmicas, duplicándola. Con Zwicky propuso el origen de las supernovas y las estrellas de neutrones.",
"Allan Sandage":"Trabajó con Hubble y midió la constante de Hubble, además de colaborar en el descubrimiento de los cuásares. Fue figura clave de la cosmología observacional.",
"Maarten Schmidt":"Identificó en 1963 que el objeto 3C 273 es un cuásar muy lejano de enorme luminosidad. Su hallazgo cambió la comprensión de las galaxias activas.",
"Percival Lowell":"Fundó el Observatorio Lowell en Arizona y defendió la existencia de canales en Marte. Buscó un «Planeta X» más allá de Neptuno, y su observatorio halló después Plutón.",
"Irving Langmuir":"Estudió películas de moléculas en superficies y la química de los gases, e inventó la lámpara incandescente llena de gas. Recibió el Nobel de Química de 1932.",
"Gilbert Lewis":"Propuso el enlace covalente por pares de electrones compartidos y una definición de ácidos y bases. Es una figura clave de la química del siglo XX.",
"Frederick Gowland Hopkins":"Mostró que los alimentos contienen factores accesorios esenciales, las vitaminas. Compartió el Nobel de Medicina de 1929 con Eijkman.",
"Albert Szent-Györgyi":"Aisló la vitamina C y estudió la oxidación celular y la contracción muscular. Recibió el Nobel de Medicina de 1937.",
"Fritz Lipmann":"Descubrió la coenzima A y propuso el papel del ATP como moneda de energía celular. Compartió el Nobel de Medicina de 1953 con Krebs.",
"Peter Mitchell":"Propuso la teoría quimiosmótica, que explica cómo las células producen ATP a partir de gradientes de protones. Recibió el Nobel de Química de 1978.",
"Christian de Duve":"Descubrió los lisosomas y los peroxisomas, orgánulos de las células. Compartió el Nobel de Medicina de 1974.",
"George Palade":"Con microscopía electrónica describió los ribosomas y cómo las células fabrican y transportan proteínas. Compartió el Nobel de Medicina de 1974.",
"Otto Warburg":"Estudió la respiración celular y observó que las células cancerosas consumen mucha glucosa, hoy llamado efecto Warburg. Recibió el Nobel de Medicina de 1931.",
"Casimir Funk":"Bioquímico polaco que propuso el término «vitamina» y la idea de que su falta causa enfermedades como el beriberi.",
"Carl Cori":"Con Gerty Cori estudió cómo el cuerpo metaboliza la glucosa y el glucógeno. Compartieron el Nobel de Medicina de 1947.",
"Charles Best":"Con Banting aisló la insulina en 1921 cuando era estudiante y colaboró en su uso clínico. Su aporte fue clave para tratar la diabetes.",
"Jules Bordet":"Descubrió el complemento del sistema inmune y la bacteria de la tos ferina. Recibió el Nobel de Medicina de 1919.",
"Charles Nicolle":"Demostró en 1909 que el tifus exantemático se transmite por el piojo, lo que permitió controlar la enfermedad. Recibió el Nobel de Medicina de 1928.",
"Alexandre Yersin":"Descubrió en 1894 el bacilo de la peste, hoy Yersinia pestis, durante una epidemia en Hong Kong. Luego trabajó en Vietnam y fundó institutos médicos.",
"Patrick Manson":"Mostró que los mosquitos transmiten la filariasis y sugirió a Ross que podían transmitir también la malaria. Es considerado padre de la medicina tropical.",
"David Bruce":"Descubrió que el parásito de la enfermedad del sueño en animales se transmite por la mosca tsetsé. Su trabajo también abordó la brucelosis.",
"Thomas Sydenham":"Defendió la observación cuidadosa de los pacientes y describió enfermedades como la corea que lleva su nombre. Es llamado «el Hipócrates inglés».",
"Hermann Boerhaave":"Impulsó la enseñanza clínica junto a la cama del paciente en Leiden y fue uno de los médicos más famosos de Europa. Influyó en muchos médicos de su tiempo.",
"Giovanni Battista Morgagni":"Relacionó los síntomas con lesiones halladas en autopsias y fundó la anatomía patológica con «De sedibus». Mostró que las enfermedades afectan órganos concretos.",
"John Hunter":"Cirujano escocés que aplicó la observación y el experimento a la cirugía y reunió una gran colección anatómica. Influyó en la cirugía científica.",
"René Laennec":"Inventó el estetoscopio en 1816 y describió los sonidos del tórax. Estudió la tuberculosis y la cirrosis.",
"James Young Simpson":"Introdujo el cloroformo como anestésico en 1847 y lo aplicó en el parto. Fue obstetra en Edimburgo.",
"Michael DeBakey":"Pionero de la cirugía cardiovascular que desarrolló injertos arteriales y técnicas para tratar aneurismas. Ayudó a crear los hospitales móviles MASH.",
"Alexis Carrel":"Desarrolló técnicas de sutura de vasos sanguíneos y de trasplante de órganos. Recibió el Nobel de Medicina de 1912.",
"Joseph Murray":"Realizó en 1954 el primer trasplante de riñón exitoso entre gemelos idénticos. Compartió el Nobel de Medicina de 1990.",
"Peter Medawar":"Mostró que el sistema inmune puede aprender a tolerar tejidos extraños, base de los trasplantes. Compartió el Nobel de Medicina de 1960 con Burnet.",
"Macfarlane Burnet":"Propuso la teoría de la selección clonal de la inmunidad adquirida. Compartió el Nobel de Medicina de 1960.",
"Baruj Benacerraf":"Descubrió genes que controlan la respuesta inmune y su relación con el complejo mayor de histocompatibilidad. Compartió el Nobel de Medicina de 1980.",
"Stanley Prusiner":"Propuso que ciertas enfermedades neurodegenerativas son causadas por proteínas infecciosas, los priones. Recibió el Nobel de Medicina de 1997.",
"Peter Piot":"Co-descubrió el virus del ébola en 1976 y dirigió el programa ONUSIDA. Es un referente de la salud pública mundial.",
"Richard Doll":"Con Austin Bradford Hill mostró en estudios de 1950 que fumar causa cáncer de pulmón. Fue pionero de la epidemiología moderna.",
"John Snow":"Rastreó en 1854 un brote de cólera en Londres hasta una bomba de agua de Broad Street. Es considerado fundador de la epidemiología y también perfeccionó la anestesia.",
"Karl Weierstrass":"Dio rigor al análisis con definiciones precisas de límite y continuidad y construyó una función continua que no es derivable en ningún punto. Fue maestro de Kovalévskaya.",
"Felix Klein":"Propuso el «programa de Erlangen» para clasificar geometrías por sus grupos de simetría. La botella de Klein lleva su nombre.",
"Giuseppe Peano":"Formuló axiomas para los números naturales, que son la base de la aritmética formal. También ideó la curva que llena un cuadrado.",
"Gottlob Frege":"Creó la lógica de predicados moderna con su «Conceptografía». Intentó fundamentar la aritmética en la lógica.",
"Bertrand Russell":"Con Whitehead escribió los «Principia Mathematica» y descubrió la paradoja que lleva su nombre. Recibió el Nobel de Literatura de 1950.",
"G. H. Hardy":"Matemático inglés de la teoría de números que descubrió y apoyó a Ramanujan. Escribió «Apología de un matemático».",
"John Backus":"Dirigió el equipo que creó FORTRAN, el primer lenguaje de alto nivel de uso amplio. Recibió el premio Turing en 1977.",
"Edgar Codd":"Propuso en 1970 el modelo relacional de bases de datos, base de las bases de datos SQL. Recibió el premio Turing en 1981.",
"Frances Allen":"Pionera en la optimización de compiladores, que hizo posible que los programas de alto nivel se ejecutaran con eficiencia. Fue la primera mujer en recibir el premio Turing, en 2006.",
"Hunayn ibn Ishaq":"Médico cristiano de Bagdad que tradujo al árabe obras de Galeno e Hipócrates. Escribió un tratado de oftalmología y trabajó en la Casa de la Sabiduría.",
"Ibn al-Baitar":"Botánico y farmacéutico de al-Ándalus que describió cientos de plantas y remedios en un gran tratado sobre simples. Recorrió el Mediterráneo recolectando plantas.",
"Rheticus":"Único discípulo directo de Copérnico, a quien convenció de publicar «De revolutionibus». Publicó antes la «Narratio prima» y calculó tablas trigonométricas.",
"Girolamo Fabrici":"Anatomista de Padua que describió las válvulas de las venas, observación que aprovechó su discípulo Harvey. Fundó un célebre teatro anatómico.",
"Willebrord Snellius":"Formuló la ley de refracción de la luz que lleva su nombre y mejoró la triangulación para medir arcos de meridiano. Fue profesor en Leiden.",
"Thomas Harriot":"Matemático y astrónomo inglés que dibujó la Luna con telescopio en 1609, antes que Galileo, y trabajó en álgebra. También viajó a América como topógrafo.",
"Edme Mariotte":"Formuló de forma independiente la ley que relaciona presión y volumen de un gas y estudió el punto ciego del ojo. Fue pionero de la física experimental en Francia.",
"Pierre Bouguer":"Participó en la misión geodésica al Virreinato del Perú, hoy Ecuador, para medir la forma de la Tierra. Estudió la atenuación de la luz, base de la ley de Beer-Lambert.",
"Charles Marie de La Condamine":"Dirigió la misión geodésica francesa a los Andes y regresó por el Amazonas, donde describió la quina y el curare. Su viaje confirmó que la Tierra está achatada en los polos.",
"Jorge Juan":"Marino y científico español que participó en la misión geodésica franco-española a Perú. Escribió observaciones astronómicas y fue pionero de la ciencia náutica.",
"Antonio de Ulloa":"Marino y científico español que acompañó a Jorge Juan en la misión geodésica a los Andes. Describió el platino en América y escribió sobre la geografía y costumbres de Perú.",
"Pierre Louis Maupertuis":"Dirigió la expedición a Laponia para medir un grado de meridiano y confirmar el achatamiento de la Tierra. Formuló el principio de mínima acción.",
"Alexis Clairaut":"Matemático francés que participó en la expedición a Laponia y calculó el retorno del cometa Halley en 1759. Escribió sobre la forma de la Tierra.",
"Jean-Baptiste Delambre":"Midió con Méchain el arco de meridiano entre Dunkerque y Barcelona, base de la definición original del metro. Escribió una gran historia de la astronomía.",
"Siméon Poisson":"Matemático francés que dio su nombre a la distribución de probabilidad de eventos raros y a la ecuación de Poisson en física. Hizo aportes a la electricidad y la mecánica.",
"Claude Navier":"Ingeniero francés que formuló ecuaciones del movimiento de fluidos viscosos, hoy ecuaciones de Navier-Stokes. También diseñó puentes colgantes.",
"Jean-Victor Poncelet":"Fundó la geometría proyectiva moderna durante su cautiverio en Rusia tras la campaña de Napoleón. También hizo aportes a la ingeniería hidráulica.",
"Hermann Grassmann":"Desarrolló ideas de álgebra lineal y de espacios vectoriales de dimensión arbitraria, adelantadas a su época. También fue lingüista y estudió el sánscrito.",
"Arthur Cayley":"Desarrolló la teoría de matrices y la geometría de espacios de dimensión superior. Fue uno de los matemáticos más prolíficos del siglo XIX.",
"Augustus De Morgan":"Formuló las leyes de De Morgan en lógica y fue pionero de la lógica matemática. Fue el primer presidente de la London Mathematical Society.",
"Joseph Louis Gay-Lussac":"Formuló la ley que relaciona volumen y temperatura de los gases y la ley de los volúmenes de combinación. Realizó ascensos en globo para estudiar la atmósfera.",
"Michel Chevreul":"Estudió la composición de las grasas y descubrió los ácidos grasos. También investigó los contrastes de color, que influyeron en pintores impresionistas. Vivió 102 años.",
"Edward Frankland":"Introdujo el concepto de valencia y descubrió compuestos organometálicos. Con Lockyer participó en el estudio del helio en el Sol.",
"Alexander Butlerov":"Propuso la teoría de la estructura química, según la cual las propiedades de una sustancia dependen de cómo se enlazan sus átomos. La usó para explicar la isomería.",
"Henri Moissan":"Aisló el flúor en 1886 y desarrolló un horno eléctrico de arco para altas temperaturas. Recibió el Nobel de Química de 1906.",
"Victor Grignard":"Descubrió los reactivos organometálicos de magnesio que llevan su nombre, herramienta central de la síntesis orgánica. Compartió el Nobel de Química de 1912.",
"Paul Sabatier":"Desarrolló la hidrogenación catalítica con níquel, que permite convertir compuestos insaturados en saturados. Compartió el Nobel de Química de 1912.",
"Wilhelm Wien":"Formuló la ley del desplazamiento que relaciona la longitud de onda de máxima emisión de un cuerpo caliente con su temperatura. Recibió el Nobel de Física de 1911.",
"Max von Laue":"Descubrió en 1912 que los cristales difractan los rayos X, lo que probó su naturaleza ondulatoria y abrió la cristalografía. Recibió el Nobel de Física de 1914.",
"Johannes Rydberg":"Formuló una fórmula para las líneas espectrales del hidrógeno y otros elementos, con la constante que lleva su nombre. Su trabajo fue clave para el modelo atómico de Bohr.",
"Anders Ångström":"Pionero de la espectroscopía que identificó hidrógeno en el espectro solar. La unidad de longitud ångström lleva su nombre.",
"Josef Stefan":"Formuló la ley que relaciona la energía emitida por un cuerpo negro con la cuarta potencia de su temperatura. Boltzmann la derivó teóricamente.",
"Oliver Heaviside":"Reformuló las ecuaciones de Maxwell en su forma moderna con vectores y desarrolló el cálculo operacional. Predijo una capa ionizada de la atmósfera.",
"Jean-Henri Fabre":"Entomólogo francés que estudió el comportamiento de los insectos con paciencia y escribió los «Recuerdos entomológicos». Es un clásico de la divulgación naturalista.",
"Karl Ernst von Baer":"Descubrió el óvulo de los mamíferos y formuló leyes de la embriología, como que los embriones de especies cercanas se parecen más al inicio. Fue naturalista y explorador.",
"Johannes Müller":"Fisiólogo alemán que formuló la ley de las energías nerviosas específicas y fue maestro de Helmholtz, Virchow y Schwann. Escribió un influyente manual de fisiología.",
"Eugène Dubois":"Médico holandés que halló en Java, en 1891, fósiles que llamó Pithecanthropus erectus, hoy Homo erectus. Fue una de las primeras búsquedas deliberadas de homínidos fósiles.",
"Pierre Teilhard de Chardin":"Jesuita y paleontólogo que participó en el estudio del Hombre de Pekín y escribió sobre la evolución y el sentido del universo. Sus ideas fueron polémicas.",
"William Bateson":"Defendió las ideas de Mendel en Inglaterra y acuñó el término «genética» en 1905. Descubrió ejemplos de ligamiento génico.",
"Wilhelm Johannsen":"Acuñó los términos «gen», «genotipo» y «fenotipo». Mostró con líneas puras de plantas que la selección actúa sobre diferencias hereditarias.",
"Theodor Boveri":"Mostró que los cromosomas son necesarios en el desarrollo normal del embrión y propuso la teoría cromosómica de la herencia. También propuso un origen cromosómico del cáncer.",
"Walter Sutton":"Propuso en 1902 que los cromosomas llevan los factores hereditarios de Mendel. Murió joven, a los 38 años.",
"Alfred Sturtevant":"Construyó en 1913 el primer mapa genético de cromosomas, de la mosca de la fruta, ordenando genes por su frecuencia de ligamiento. Trabajó con Morgan.",
"Nikolái Vavílov":"Identificó centros de origen de las plantas cultivadas, entre ellos los Andes para la papa. Murió en prisión en 1943 tras ser perseguido por Lysenko.",
"Norman Borlaug":"Desarrolló variedades de trigo de alto rendimiento y resistentes a enfermedades, base de la «revolución verde». Recibió el Nobel de la Paz en 1970.",
"M. S. Swaminathan":"Impulsó la revolución verde en la India con variedades de trigo y arroz de mayor rendimiento. Fue director de institutos agrícolas internacionales.",
"George Washington Carver":"Investigó cultivos alternativos, como el maní y la batata, y promovió la rotación de cultivos en suelos agotados. Fue profesor en el Instituto Tuskegee.",
"Charles Elton":"Fundó la ecología animal moderna e introdujo conceptos como cadena alimentaria y nicho ecológico. Estudió las poblaciones del Ártico.",
"Arthur Tansley":"Acuñó el término «ecosistema» en 1935 y fue pionero de la ecología vegetal en Inglaterra. Fundó la Nature Conservancy.",
"G. Evelyn Hutchinson":"Ecólogo que desarrolló el concepto de nicho ecológico como hipervolumen y estudió lagos. Influyó en generaciones de ecólogos.",
"Robert MacArthur":"Con E. O. Wilson desarrolló la teoría de la biogeografía de islas y estudió la ecología de comunidades. Murió joven, a los 42 años.",
"Jacques Cousteau":"Co-inventó el Aqua-Lung, el equipo de buceo autónomo, y dio a conocer los océanos con documentales y expediciones en el Calypso. Impulsó la conservación marina.",
"Wilder Penfield":"Neurocirujano que cartografió las áreas del cerebro estimulando eléctricamente a pacientes despiertos y describió el «homúnculo». Fundó el Instituto Neurológico de Montreal.",
"Hans Berger":"Registró por primera vez la actividad eléctrica del cerebro humano en 1924 e inventó el electroencefalograma. Su técnica sigue en uso clínico.",
"Archibald Garrod":"Propuso que ciertas enfermedades son «errores congénitos del metabolismo», causados por la falta de una enzima. Su idea anticipó la genética bioquímica.",
"Émile Roux":"Con Yersin descubrió la toxina de la difteria y desarrolló el suero antidiftérico. Colaboró con Pasteur y dirigió el Instituto Pasteur.",
"Hamilton Smith":"Descubrió la primera enzima de restricción de tipo II, herramienta para cortar ADN en sitios específicos. Compartió el Nobel de Medicina de 1978.",
"Werner Arber":"Descubrió que las bacterias usan enzimas de restricción para defenderse de virus. Compartió el Nobel de Medicina de 1978.",
"Daniel Nathans":"Usó enzimas de restricción para mapear el ADN de un virus, lo que abrió la vía de la ingeniería genética. Compartió el Nobel de Medicina de 1978.",
"Joseph Marie Jacquard":"Perfeccionó un telar controlado por tarjetas perforadas que permitía tejer diseños complejos. Su sistema inspiró a Babbage y a las primeras computadoras.",
"Herman Hollerith":"Inventó una máquina tabuladora con tarjetas perforadas para el censo de EE. UU. de 1890 y fundó la empresa que dio origen a IBM.",
"John Atanasoff":"Construyó con Clifford Berry una computadora electrónica digital pionera, la Atanasoff-Berry, a fines de los años 1930. Su prioridad se reconoció en un juicio en 1973.",
"John Mauchly":"Con Eckert diseñó el ENIAC, una de las primeras computadoras electrónicas de propósito general. Más tarde crearon el UNIVAC.",
"J. Presper Eckert":"Ingeniero que, con Mauchly, construyó el ENIAC en 1945 y el UNIVAC, primer computador comercial de EE. UU.",
"Maurice Wilkes":"Dirigió la construcción de EDSAC, una de las primeras computadoras con programa almacenado en funcionamiento. Introdujo la microprogramación y recibió el premio Turing en 1967.",
"Bob Kahn":"Con Vint Cerf diseñó los protocolos TCP/IP que sostienen internet. Recibieron el premio Turing en 2004.",
"Leonard Kleinrock":"Desarrolló en los años 1960 la teoría matemática de las redes de conmutación de paquetes. Su equipo envió el primer mensaje por ARPANET en 1969.",
"Paul Baran":"Concibió en los años 1960 la conmutación de paquetes y las redes distribuidas, ideas que influyeron en ARPANET. Trabajó en RAND.",
"Philo Farnsworth":"Inventó un sistema de televisión totalmente electrónico y lo demostró en 1927. Obtuvo más de cien patentes.",
"Edwin Armstrong":"Inventó la radio de modulación de frecuencia (FM), que reduce el ruido, y el circuito regenerativo y el superheterodino. Su batalla de patentes fue muy conocida.",
"Pierre Weiss":"Propuso la existencia de dominios magnéticos en los materiales ferromagnéticos y estudió el campo molecular. Su teoría explica por qué un trozo de hierro puede estar o no imantado.",
"Paul Langevin":"Desarrolló la teoría del paramagnetismo y creó con Chilowsky un sistema de detección submarina con ultrasonidos, precursor del sonar. También difundió la relatividad en Francia.",
"Jean Perrin":"Con experimentos sobre el movimiento browniano determinó el número de Avogadro y confirmó la realidad de los átomos. Recibió el Nobel de Física de 1926.",
"Peter Debye":"Estudió los momentos dipolares de las moléculas y la difracción de rayos X en polvos y líquidos. Recibió el Nobel de Química de 1936.",
"Edward Appleton":"Demostró la existencia de la ionosfera y estudió cómo refleja las ondas de radio. Recibió el Nobel de Física de 1947.",
"Robert Watson-Watt":"Dirigió el desarrollo del radar en el Reino Unido, clave en la defensa aérea durante la Segunda Guerra Mundial. Su sistema ayudó a ganar la batalla de Inglaterra.",
"Eugene Wigner":"Aplicó la teoría de grupos a la física cuántica y desarrolló las bases de las simetrías en física. Recibió el Nobel de Física de 1963.",
"Leo Szilard":"Concibió en 1933 la idea de una reacción nuclear en cadena y alertó a Roosevelt, con Einstein, sobre la posibilidad de armas atómicas. Después fue activo en el control de armas.",
"John Wheeler":"Popularizó el término «agujero negro» y contribuyó a la relatividad general y a la fisión nuclear. Fue maestro de Feynman y de Kip Thorne.",
"Kenneth Wilson":"Desarrolló el grupo de renormalización para explicar las transiciones de fase y los fenómenos críticos. Recibió el Nobel de Física de 1982.",
"Raymond Davis":"Detectó neutrinos solares en una mina de Dakota del Sur y halló menos de los esperados, lo que dio origen al problema de los neutrinos solares. Compartió el Nobel de Física de 2002.",
"John Bahcall":"Elaboró modelos detallados del Sol que predijeron el flujo de neutrinos solares. Fue un impulsor del telescopio espacial Hubble.",
"Riccardo Giacconi":"Fue pionero de la astronomía de rayos X y descubrió la primera fuente cósmica de rayos X fuera del sistema solar. Compartió el Nobel de Física de 2002.",
"William Fowler":"Estudió cómo se forman los elementos químicos por reacciones nucleares en las estrellas. Compartió el Nobel de Física de 1983 con Chandrasekhar.",
"Margaret Burbidge":"Con Geoffrey Burbidge, Fowler y Hoyle publicó el artículo «B²FH» sobre la síntesis de elementos en las estrellas. Fue luego directora del Observatorio de Greenwich.",
"Fred Whipple":"Propuso que el núcleo de un cometa es una «bola de nieve sucia» de hielo y polvo. Dirigió el Observatorio Astrofísico Smithsoniano.",
"Edward Pickering":"Dirigió el Observatorio de Harvard y organizó el equipo de «computadoras» que clasificaron miles de estrellas. Impulsó un catálogo fotográfico de espectros.",
"Nicolas-Louis de Lacaille":"Catalogó cerca de 10.000 estrellas del hemisferio sur desde Sudáfrica y nombró catorce constelaciones. Midió también un arco de meridiano.",
"Al-Sufi":"Astrónomo persa que revisó el catálogo de estrellas de Ptolomeo en su «Libro de las estrellas fijas». Describió la galaxia de Andrómeda, hoy conocida como M31.",
"Henry Moseley":"Mostró con rayos X que el número atómico, y no la masa, ordena los elementos en la tabla periódica. Murió en 1915 en la batalla de Galípoli, con 27 años.",
"Hannes Alfvén":"Fundó la magnetohidrodinámica, el estudio de plasmas conductores en campos magnéticos. Recibió el Nobel de Física de 1970.",
"Igor Tamm":"Explicó teóricamente, con Frank, la radiación de Cherenkov y contribuyó a la física nuclear y a los reactores de fusión. Compartió el Nobel de Física de 1958.",
"Zhores Alferov":"Desarrolló heteroestructuras de semiconductores, base de láseres, LED y comunicaciones por fibra óptica. Compartió el Nobel de Física de 2000.",
"Ali Javan":"Construyó en 1960 el primer láser de gas, el de helio-neón. Su trabajo abrió el camino a aplicaciones como los lectores de códigos de barras.",
"Archer Martin":"Desarrolló con Synge la cromatografía de partición para separar mezclas de sustancias. Compartieron el Nobel de Química de 1952.",
"Jaroslav Heyrovský":"Inventó la polarografía, un método electroquímico para analizar sustancias disueltas. Recibió el Nobel de Química de 1959.",
"Lothar Meyer":"Organizó los elementos por sus propiedades y pesos atómicos casi al mismo tiempo que Mendeléyev. Su curva de volúmenes atómicos mostró la periodicidad.",
"Harry Kroto":"Co-descubrió el buckminsterfullereno, una molécula esférica de 60 carbonos. Compartió el Nobel de Química de 1996 con Curl y Smalley.",
"Sumio Iijima":"Observó en 1991 con microscopía electrónica los nanotubos de carbono. Su descubrimiento abrió un gran campo de la nanotecnología.",
"John Goodenough":"Desarrolló materiales para cátodos de baterías de iones de litio. Compartió el Nobel de Química de 2019 y fue el ganador de mayor edad.",
"Jean-Marie Lehn":"Fundó la química supramolecular, que estudia cómo las moléculas se reconocen y se ensamblan. Compartió el Nobel de Química de 1987.",
"George de Hevesy":"Desarrolló el uso de isótopos radiactivos como trazadores para seguir procesos químicos y biológicos. Recibió el Nobel de Química de 1943.",
"Dan Shechtman":"Descubrió en 1982 los cuasicristales, estructuras ordenadas pero no periódicas. Recibió el Nobel de Química de 2011.",
"Mijaíl Lomonósov":"Polímata ruso que propuso la conservación de la masa en reacciones químicas y observó la atmósfera de Venus. Fundó la Universidad de Moscú.",
"Wendell Stanley":"Cristalizó el virus del mosaico del tabaco en 1935 y mostró que es una partícula de proteína y ácido nucleico. Compartió el Nobel de Química de 1946.",
"Martinus Beijerinck":"Mostró que el agente de la enfermedad del mosaico del tabaco es un «contagium vivum fluidum», idea inicial del concepto de virus. También aportó a la microbiología ambiental.",
"Dmitri Ivanovski":"Demostró en 1892 que el agente del mosaico del tabaco atraviesa filtros que retienen a las bacterias. Es considerado uno de los descubridores de los virus.",
"Peyton Rous":"Mostró en 1911 que un virus puede causar un sarcoma en gallinas, el virus del sarcoma de Rous. Recibió el Nobel de Medicina de 1966, décadas después.",
"Howard Temin":"Descubrió la transcriptasa inversa, enzima que copia ARN en ADN en los retrovirus. Compartió el Nobel de Medicina de 1975 con Baltimore y Dulbecco.",
"Mary Lyon":"Propuso en 1961 que en las hembras de mamíferos uno de los cromosomas X se inactiva en cada célula, la hipótesis de Lyon. Es clave para entender la genética del sexo.",
"Motoo Kimura":"Propuso la teoría neutralista de la evolución molecular, según la cual la mayoría de las mutaciones son neutras. Influyó en la genética de poblaciones.",
"Charles Henry Turner":"Zoólogo afroamericano que demostró que los insectos aprenden y distinguen sonidos y colores. Publicó más de 70 trabajos.",
"Walter Cannon":"Acuñó el término «homeostasis» y describió la respuesta de «lucha o huida». Estudió también la digestión con rayos X.",
"Christiaan Eijkman":"Observó que el beriberi se debía a la falta de una sustancia en el arroz pulido, lo que llevó a la vitamina B1. Compartió el Nobel de Medicina de 1929.",
"Joseph Goldberger":"Demostró que la pelagra se debe a una dieta pobre y no a un microbio, y que podía prevenirse con una alimentación adecuada. Fue pionero de la epidemiología nutricional.",
"Iván Séchenov":"Fundó la fisiología rusa moderna y propuso que los actos psíquicos son reflejos del cerebro. Su libro «Reflejos del cerebro» influyó en Pávlov.",
"Alberto Hurtado":"Médico peruano que impulsó la fisiología de altura, estudió la adaptación del cuerpo a vivir a gran altitud y fue fundador del Instituto de Biología Andina. Fue también ministro de Salud.",
"René Favaloro":"Cirujano argentino que desarrolló en Cleveland la técnica del bypass coronario con vena safena. Fundó una fundación cardiológica en Buenos Aires.",
"Francisco Varela":"Chileno que, con Maturana, desarrolló la teoría de la autopoiesis y luego propuso la neurofenomenología. Estudió la relación entre ciencia cognitiva y experiencia.",
"Johanna Döbereiner":"Brasileña que estudió bacterias que fijan nitrógeno en plantas como la soja y la caña de azúcar. Su trabajo redujo el uso de fertilizantes químicos.",
"Clemente Estable":"Neurocientífico uruguayo que estudió las neuronas y su estructura con técnicas histológicas y fundó el Instituto de Investigaciones Biológicas de Montevideo.",
"Ruth Shady":"Arqueóloga peruana que dirige las investigaciones en Caral, una ciudad de más de 4.500 años de antigüedad, de las más antiguas de América. Su trabajo cambió la visión del origen de la civilización andina.",
"Phillip Tobias":"Paleoantropólogo sudafricano que estudió fósiles de Sterkfontein y describió Homo habilis junto con Leakey. Fue director del departamento de anatomía de Witwatersrand.",
"Margarita Salas":"Descubrió y caracterizó la ADN polimerasa del fago phi29, muy usada en biotecnología para amplificar ADN. Fue una de las científicas más reconocidas de España.",
"Pío del Río Hortega":"Desarrolló técnicas de tinción para describir la microglía y la oligodendroglía. Fue discípulo de Cajal.",
"Daniel Bovet":"Descubrió los primeros antihistamínicos y los relajantes musculares sintéticos. Recibió el Nobel de Medicina de 1957.",
"Georg von Békésy":"Demostró cómo se propagan las ondas sonoras en la cóclea y cómo el oído interno detecta los sonidos. Recibió el Nobel de Medicina de 1961.",
"Federico Villarreal":"Matemático e ingeniero peruano que publicó trabajos sobre cálculo de raíces y ecuaciones, y fue rector de la Universidad de San Marcos. Es una figura de la matemática en el Perú.",
"Shiing-Shen Chern":"Fundó la geometría diferencial global con las clases de Chern. Recibió la Medalla Wolf y fundó institutos de matemáticas en China.",
"Stanisław Ulam":"Con Teller propuso el diseño de la bomba de hidrógeno y con von Neumann desarrolló el método de Monte Carlo. También hizo aportes a la teoría de conjuntos y de números.",
"Michael Atiyah":"Con Singer demostró el teorema del índice que une análisis y topología. Recibió la Medalla Fields en 1966 y el premio Abel en 2004.",
"John Horton Conway":"Inventó el «juego de la vida», un autómata celular, y estudió grupos, nudos y teoría de juegos. Fue muy conocido por su estilo lúdico.",
"Leonardo Torres Quevedo":"Inventó el telekino, un sistema de control remoto, el aerostático Astra-Torres y autómatas ajedrecistas. Fue pionero de la informática y la automática.",
"Isaac Peral":"Diseñó y construyó un submarino con propulsión eléctrica y torpedos, botado en 1888. Su proyecto no tuvo apoyo continuado.",
"Juan de la Cierva":"Inventó el autogiro, una aeronave con rotor libre que precedió al helicóptero. Murió en un accidente aéreo en 1936.",
"John Logie Baird":"Realizó en 1926 la primera demostración pública de televisión mecánica. Más tarde desarrolló un sistema de televisión en color.",
"James Dewar":"Inventó el matraz de vacío, base del termo, y logró licuar hidrógeno. Con Abel desarrolló la cordita.",
"Nicéphore Niépce":"Obtuvo hacia 1826 la fotografía más antigua que se conserva, tomada desde su ventana con una cámara oscura. Colaboró después con Daguerre.",
"Louis Daguerre":"Desarrolló el daguerrotipo, primer procedimiento fotográfico práctico, presentado en 1839. Antes fue pintor y creador de dioramas.",
"William Henry Fox Talbot":"Inventó el calotipo, proceso fotográfico con negativo que permite múltiples copias. Publicó «El lápiz de la naturaleza», uno de los primeros libros ilustrados con fotografías.",
"Christian Doppler":"Propuso en 1842 que la frecuencia de una onda cambia cuando la fuente y el observador se mueven uno respecto del otro, el efecto Doppler. Se usa en astronomía, radar y medicina.",
"Thomas Seebeck":"Descubrió en 1821 que dos metales unidos, con sus extremos a distinta temperatura, generan una corriente eléctrica. Su efecto es la base de los termopares.",
"Jean Peltier":"Observó que al pasar corriente por la unión de dos conductores distintos esta se calienta o se enfría. El efecto Peltier se usa en refrigeración termoeléctrica.",
"Heinrich Lenz":"Formuló la ley que da el sentido de la corriente inducida, que se opone a la variación que la produce. También estudió la conductividad eléctrica de los metales.",
"Wilhelm Weber":"Con Gauss construyó un telégrafo electromagnético en Gotinga y estudió el magnetismo terrestre. La unidad de flujo magnético, el weber, lleva su nombre.",
"Hermann Minkowski":"Formuló la relatividad especial como una geometría de espacio-tiempo de cuatro dimensiones, base de la relatividad general de Einstein, quien fue su alumno. También hizo aportes a la teoría de números.",
"Gabriel Lippmann":"Desarrolló un método de fotografía en color basado en la interferencia de la luz. Recibió el Nobel de Física de 1908.",
"Karl Ferdinand Braun":"Inventó el tubo de rayos catódicos con pantalla, precursor de la televisión de tubo, y mejoró la telegrafía sin hilos. Compartió el Nobel de Física de 1909 con Marconi.",
"Willem de Sitter":"Halló soluciones cosmológicas de la relatividad general que describen un universo en expansión, el espacio de De Sitter. También estudió las lunas de Júpiter.",
"Alexander Friedmann":"Encontró en 1922 soluciones de las ecuaciones de Einstein que describen un universo en expansión o contracción. Su trabajo es base de la cosmología del Big Bang. Murió joven, a los 37 años.",
"Vesto Slipher":"Midió desde el Observatorio Lowell los corrimientos al rojo de nebulosas espirales y halló que la mayoría se aleja de nosotros. Sus datos fueron clave para Hubble y la expansión del universo.",
"Ralph Alpher":"Con Gamow calculó cómo se formaron los elementos ligeros en el universo temprano y predijo una radiación de fondo residual. Su tesis fue base de la teoría del Big Bang caliente.",
"Robert Wilson":"Con Arno Penzias detectó en 1964 una señal de microondas uniforme que resultó ser la radiación cósmica de fondo. Compartieron el Nobel de Física de 1978.",
"John Mather":"Dirigió el análisis del espectro de la radiación cósmica de fondo con el satélite COBE, que coincidió con el de un cuerpo negro. Compartió el Nobel de Física de 2006.",
"Alan Guth":"Propuso en 1981 la inflación cósmica, una expansión extremadamente rápida del universo en sus primeros instantes. La idea explica la uniformidad y la planitud del cosmos.",
"Andrei Linde":"Desarrolló modelos de inflación cósmica, entre ellos la inflación caótica y el universo eterno. Es una figura clave de la cosmología teórica.",
"Brian Schmidt":"Dirigió el High-z Supernova Search Team, que halló en 1998 que la expansión del universo se acelera. Compartió el Nobel de Física de 2011 con Perlmutter y Riess.",
"Carolyn Shoemaker":"Con su esposo Eugene y David Levy descubrió el cometa Shoemaker-Levy 9, que chocó con Júpiter en 1994. Descubrió más de 30 cometas en total.",
"Nikolái Kardashev":"Propuso una escala para medir el nivel de desarrollo tecnológico de una civilización según la energía que usa. Fue pionero de la búsqueda de inteligencia extraterrestre y de la radioastronomía.",
"Edwin Salpeter":"Descubrió el proceso triple alfa por el que las estrellas producen carbono a partir de helio. También estudió la distribución de masas de las estrellas, la función inicial de masa de Salpeter.",
"Samuel Goudsmit":"Con Uhlenbeck propuso en 1925 que el electrón posee un momento angular intrínseco, el espín. Dirigió también la misión Alsos para investigar el programa nuclear alemán.",
"Cecil Powell":"Desarrolló emulsiones fotográficas para detectar partículas y con ellas halló el pion en rayos cósmicos, junto con Lattes y Occhialini. Recibió el Nobel de Física de 1950.",
"Friedrich Bergius":"Desarrolló un proceso para convertir carbón en combustibles líquidos con hidrógeno a alta presión. Compartió el Nobel de Química de 1931 con Bosch.",
"Carl Bosch":"Convirtió el proceso de síntesis de amoníaco de Haber en un método industrial a gran escala. Compartió el Nobel de Química de 1931 con Bergius.",
